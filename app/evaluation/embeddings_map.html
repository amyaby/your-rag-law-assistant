<script>
const D = {"points": [{"id": 4024, "article": "1", "content": "المادة1\n \n.يطلق على هذا القانون اسم مدونة األسرة، ويشار إليها بعده باسم المدونة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.03473761286470845, "y": -0.01598586631443774}, {"id": 4025, "article": "2", "content": "المادة2\n \n :تسري أحكام هذه المدونة على \n1 - \n جميع المغاربة ولو كانوا حاملين لجنسية أخرى؛ \n2 - \n الالجئين بمن فيهم عديمو الجنسية، طبقا التفاقية جنيف المؤرخة بـ28\n \n يوليوز لسنة\n1951\n \n المتعلقة بوضعية الالجئين؛ \n3 - \n العالقات التي يكون فيها أحد الطرفين مغربيا؛ \n4 - \n.العالقات التي تكون بين مغربيين ", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.007590210308748889, "y": -0.042193715321051525}, {"id": 4026, "article": "3", "content": "المادة3\n \n .تعتبر النيابة العامة طرفا أصليا في جميع القضايا الرامية إلى تطبيق أحكام هذه المدونة \n الكتاب األول: الزواج \n القسم األول: الخطبة والزواج", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08140036292563747, "y": -0.08083126508055703}, {"id": 4027, "article": "4", "content": "المادة4\n \n الزواج ميثاق تراض وترابط شرعي بين رجل وامرأة على وجه الدوام، غايته اإلحصان\n .والعفاف وإنشاء أسرة مستقرة، برعاية الزوجين طبقا ألحكام هذه المدونة \n الباب األول: الخطبة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09117352868361259, "y": -0.027948762178162088}, {"id": 4028, "article": "5", "content": "المادة5\n \n.الخطبة تواعد رجل وامرأة على الزواج \n تتحقق الخطبة بتعبير طرفيها بأي وسيلة متعارف علي ها تفيد التواعد على الزواج، ويدخل\n .في حكمها قراءة الفاتحة وما جرت به العادة والعرف من تبادل الهدايا", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07336589863619054, "y": -0.03929942207586131}, {"id": 4029, "article": "6", "content": "المادة6\n \n يعتبر الطرفان في فترة خطبة إلى حين اإلشهاد على عقد الزواج، ولكل من الطرفين حق\n .العدول عنها", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.1394107711657931, "y": -0.04079531723901944}, {"id": 4030, "article": "7", "content": "المادة7\n \n .مجرد العدول عن الخطبة ال يترتب عنه تعويض \n غير أنه إذا صدر عن أحد الطرفين فعل سبب ضررا لآلخر، يمكن للمتضرر المطالبة\n .بالتعويض \n\n \n- \n12\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.11729855878090871, "y": 0.005847771586413975}, {"id": 4031, "article": "8", "content": "المادة8\n \n لكل من الخاطب والمخطوبة أن يسترد ما قدمه من هدايا، ما لم يكن العدول عن الخطبة\n .من قبله \n ترد الهدايا\nبعينها، أو بقيمتها حسب \n .األحوال", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.0888577201695094, "y": 0.008261866645561585}, {"id": 4032, "article": "9", "content": "المادة 9\n \n إذا قدم الخاطب الصداق أو جزءا منه، وحدث عدول عن الخطبة أو مات أحد الطرفين\n.أثناءها، فللخاطب أو لورثته استرداد ما سلم بعينه إن كان قائما، وإال فمثله أو قيمته يوم تسلمه \n إذا لم ترغب المخطوبة في أداء المبلغ الذي حول إلى جهاز، تحمل المتسبب في العدول\n .ما قد ينتج عن ذلك من خسارة بين قيمة الج", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07018516110028691, "y": 0.03110228508152121}, {"id": 4033, "article": "10", "content": "المادة10\n \nينعقد الزواج بإيجاب من أحد المتعاقدين وقبول من اآلخر، بألفاظ تفيد \n معنى الزواج لغة\n .أو عرفا \nيصح اإليجاب والقبول من العاجز عن النطق بالكتابة إن ك ان يكتب، وإال فبإشارته\n.المفهومة من الطرف اآلخر ومن الشاهدين", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.04550324033178118, "y": -0.013072266168340507}, {"id": 4034, "article": "11", "content": "المادة11\n \n:يشترط في اإليجاب والقبول أن يكونا \n1 - \n شفويين عند االستطاعة، وإال فبالكتابة أو اإلشارة المفهومة؛ \n2 - \n متطابقين وفي مجلس واحد؛ \n3 - \n .باتين غير مقيدين بأجل أو شرط واقف أو فاسخ \n\n \n- \n13\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.0072384157846413855, "y": -0.045679778282802126}, {"id": 4035, "article": "12", "content": "المادة12\n \n تطبق على عقد الزواج المشوب بإكراه أو تدليس األحكام المنصوص \n عليها في المادتين\n63\n  و66\n \n .بعده", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09990801354790133, "y": -0.04557994480713178}, {"id": 4036, "article": "13", "content": "المادة13\n \n :يجب أن تتوفر في عقد الزواج الشروط اآلتية \n1 - \n أهلية الزوج والزوجة؛ \n2 - عدم االتفاق على إسقاط الصداق؛ \n3 - \n ولي الزواج عند االقتضاء؛ \n4 - \n سماع العدلين التصريح ب اإليجاب والقبول من الزوجين وتوثيقه؛ \n5 - \n .انتفاء الموانع الشرعية", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08314236721173857, "y": -0.009595831632079716}, {"id": 4037, "article": "14", "content": "المادة14\n \n يمكن للمغاربة المقيمين في الخارج، أن يبرموا عقود زواجهم وفقا لإلجراءات اإلدارية\n المحلية لبلد إقامتهم، إذا توفر اإليجاب والقبول واألهلية والولي عند االقتضاء، وانتفت الموانع\nولم ينص عل ى إسقاط الصداق، وحضره شاهدان مسلمان، مع مراعاة أحكام المادة21\n \n .بعده", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.010491718290101107, "y": 0.011494374498565033}, {"id": 4038, "article": "15", "content": "المادة15\n2\n \n يجب على المغاربة الذين أبرموا عقد الزواج طبقا للقانون المحلي لبلد إقامتهم، أن يودعوا\nنسخة منه داخل أجل ثالثة أشهر من تاريخ إبرامه، بالمصالح القنصلية المغربية التابع\nة \n لها\n محل سكنى طالبة أو طالب التسجيل أو محل .إبرام العقد \n \n 2 - \n تم تغيير وتتميم الفقرة األولى من المادة15\n أعاله، ب", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.05070870203716885, "y": 0.07883871624795935}, {"id": 4039, "article": "16", "content": "المادة16\n \n .تعتبر وثيقة عقد الزواج الوسيلة المقبولة إلثبات الزواج \n إذا حالت أسباب قاهرة دون توثيق العقد في وقته، تعتمد المحكمة في سماع دعوى\n الزوجية سائر وسائل اإلثبات\nوكذا الخبرة . \nتأخذ المحكمة بعين االعتبار وهي تنظر في \n دعوى الزوجية وجود أطفال أو حمل ناتج\n .عن العالقة الزوجية، وما إذا رفعت الد", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.016380368147027455, "y": 0.11407521000879038}, {"id": 4040, "article": "17", "content": "المادة17\n \n يتم عقد الزواج بحضور أطرافه، غير أنه يمكن التوكيل على إبرامه، بإذن من قاضي\n :األسرة، المكلف بالزواج وفق الشروط اآلتية \n1 - \n وجود ظروف خاصة، ال يتأتى معها للموكل أن يقوم بإبرام عقد الزواج بنفسه؛ \n2  - \n تحرير وكالة عقد الزواج في ورقة رسمية أو عرفية، مصادق على توقيع الموكل\n فيها؛ \n3  - \n ", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.01682891526916321, "y": 0.0530862050582253}, {"id": 4041, "article": "18", "content": "المادة18\n \n ليس للقاضي أن يتولى بنفسه، تزويج من له الوالية عليه من نفسه وال من أصوله وال\n .من فروعه \n \n- \n بمقتضى المادة الفريدة من القانون رقم102.15\n \n الرامي إلى تعديل المادة16\n \n من القانون رقم70.03\n \n بمثابة مدونة\n ،األسرة تم تعديل الفقرة الرابعة من المادة16\n \n من القانون رقم70.03\n \n ليصبح العمل", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.0018829039759249457, "y": 0.025250248075731865}, {"id": 4042, "article": "19", "content": "المادة19\n \n .تكتمل أهلية الزواج بإتمام الفتى والفتاة المتمتعين بقواهما العقلية ثمان عشرة سنة شمسية", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.0929291443530034, "y": -0.05562301932345288}, {"id": 4043, "article": "20", "content": "المادة20\n \n \n لقاضي األسرة المكلف بالزواج، أن يأذن بزواج الفتى والفتاة دون سن األهلية\n المنصوص عليه في المادة19\n \n ،أعاله، بمقرر معلل يبين فيه المصلحة واألسباب المبررة لذلك\n .بعد االستماع ألبوي القاصر أو نائبه الشرعي واالستعانة بخبرة طبية أو إجراء بحث اجتماعي \n مقرر االستجا .بة لطلب اإلذن بزواج القا", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.007069240238187776, "y": -0.04766162529621067}, {"id": 4044, "article": "21", "content": "المادة21\n \n .زواج القاصر متوقف على موافقة نائبه الشرعي \n تتم موافقة النائب الشرعي بتوقيعه مع القاصر على طلب اإلذن بالزواج وحضوره إبرام\n.العقد \n إذا امتنع النائب الشرعي للقاصر عن الموافقة بت قاضي األسرة المكلف بالزواج في\n .الموضوع", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.04395600140824602, "y": -0.06483218357014003}, {"id": 4045, "article": "22", "content": "المادة22\n \n يكتسب المتزوجان طبقا للمادة20\n \n أعاله، األهلية المدنية في ممارسة حق التقاضي في\n.كل ما يتعلق بآثار عقد الزواج من حقوق والتزامات \n يمكن للمحكمة بطلب من أحد الزوجين أو نائبه الشرعي، أن تحدد التكاليف المالية للزوج\n .المعني وطريقة أدائها \n\n \n- \n17\n  -\n \nالماد ة23\n \n يأذن قاضي األسرة المكلف ب", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.016433044879287904, "y": -0.005271780092950729}, {"id": 4046, "article": "24", "content": "المادة24\n \n .الوالية حق للمرأة، تمارسه الراشدة حسب اختيارها ومصلحتها", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08177399784629776, "y": -0.030589055445171955}, {"id": 4047, "article": "25", "content": "المادة25\n \n .للراشدة أن تعقد زواجها بنفسها، أو تفوض ذلك ألبيها أو ألحد أقاربها \n الباب الثاني: الصداق", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09881348924688055, "y": -0.05817685828902783}, {"id": 4048, "article": "26", "content": "المادة26\n \n  الصداق هو ما يقدمه الزوج لزوجته إشعارا بالرغبة في عقد الزواج وإنشاء أسرة\n مستقرة، وتثبيت أسس المودة والعشرة بين الزوجين، وأساسه الشرعي هو قيمته المعنوية\n .والرمزية، وليس قيمته المادية", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.06254775649507453, "y": -0.00045002944375365634}, {"id": 4049, "article": "27", "content": "المادة27\n \n يحدد الصداق وقت إبرام العقد، وفي حالة السكوت عن تحديده، يعتبر العقد زواج\n .تفويض \nإذا لم يتراض الزوجان بع د البناء على قدر الصداق في زواج التفويض، فإن المحكمة\n .تحدده مراعية الوسط االجتماعي للزوجين \n\n \n- \n18\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07552087671942337, "y": -0.012573731519611477}, {"id": 4050, "article": "28", "content": "المادة28\n \n.كل ما صح التزامه شرعا، صلح أن يكون صداقا، والمطلوب شرعا تخفيف الصداق", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.13259015254708084, "y": -0.03417362611820987}, {"id": 4051, "article": "29", "content": "المادة29\n \n الصداق ملك للمرأة تتصرف فيه كيف شاءت، وال حق للزوج في أن يطالبها بأثاث أو\nغ.يره، مقابل الصداق الذي أصدقها إياه", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09888768762511217, "y": -0.05935253774150144}, {"id": 4052, "article": "30", "content": "المادة30\n \n.يجوز االتفاق على تعجيل الصداق أو تأجيله إلى أجل مسمى كال أو بعضا", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.10381723220127981, "y": -0.012213290410684719}, {"id": 4053, "article": "31", "content": "المادة31\n \n .يؤدى الصداق عند حلول األجل المتفق عليه \n .للزوجة المطالبة بأداء الحال من الصداق قبل بداية المعاشرة الزوجية \n إذا وقعت المعاشرة الزوجية قب.ل األداء، أصبح الصداق دينا في ذمة الزوج", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08569520411228394, "y": -0.036254015993714396}, {"id": 4054, "article": "32", "content": "المادة32\n \n.تستحق الزوجة الصداق كله بالبناء أو الموت قبله \n .تستحق الزوجة نصف الصداق المسمى إذا وقع الطالق قبل البناء \n :ال تستحق الزوجة الصداق قبل البناء \n1 - \n إذا وقع فسخ عقد الزواج؛ \n2 - \n إذا وقع رد عقد الزواج بسبب عيب في \n الزوجة، أو كان الرد من الزوجة بسبب عيب\n في الزوج؛ \n3 - \n .إذا حدث الطال", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.13916696152633648, "y": 0.003914615177156878}, {"id": 4055, "article": "33", "content": "المادة33\n \n إذا اختلف في قبض حال الصداق قبل البناء، فالقول قول الزوجة، أما بعده فالقول قول\n.الزوج \n .إذا اختلف الزوجان في قبض الصداق المؤجل، فعلى الزوج إثبات أدائه \n ال يخضع.الصداق ألي تقادم", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09354176281947812, "y": -0.03654829375713063}, {"id": 4056, "article": "34", "content": "المادة34\n \n .كل ما أتت به الزوجة من جهاز وشوار يعتبر ملكا لها \n .إذا وقع نزاع في باقي األمتعة، فالفصل فيه يخضع للقواعد العامة لإلثبات \n غير أنه إذا لم يكن لدى أي منهما بينة، فالقول للزوج بيمينه في المعتاد للرجال، وللزوجة\n بيمينها في المعتاد للنساء. أما المعتاد للرجال والنساء معا فيحلف كل منهما ويقتس", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07160816590058397, "y": -0.049613396805765694}, {"id": 4057, "article": "35", "content": "المادة35\n \n .موانع الزواج قسمان: مؤبدة ومؤقتة \n الباب األول: الموانع المؤبدة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.129674456515675, "y": -0.05660102084263977}, {"id": 4058, "article": "36", "content": "المادة36\n \n المحرمات بالقرابة أصول الرجل وفصوله وفصول أول أصوله وأول فصل من كل أصل\n .وإن عال \n\n \n- \n20\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.1305064397325692, "y": -0.06804133530281434}, {"id": 4059, "article": "37", "content": "المادة37\n \n ،المحرمات بالمصاهرة، أصول الزوجات بمجرد العقد، وفصولهن بشرط البناء باألم\n .وزوجات اآلباء وإن علوا، وزوجات األوالد وإن سفلوا بمجرد العقد", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.11809385208880643, "y": -0.02691133107948002}, {"id": 4060, "article": "38", "content": "المادة38\n \n.يحرم من الرضاع ما يحرم من النسب والمصاهرة \n ي .عد الطفل الرضيع خاصة، دون إخوته وأخواته ولدا للمرضعة وزوجها \n.ال يمنع الرضاع من الزواج، إال إذا حصل داخل الحولين األولين قبل الفطام \n الباب الثاني: الموانع المؤقتة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07727507172441182, "y": -0.019062555693348467}, {"id": 4061, "article": "39", "content": "المادة39\n \n :موانع الزواج المؤقتة هي \n1 - الجمع بين أختين، أو بين امرأة وعمتها أو خالتها من نسب أ و رضاع؛ \n2 - الزيادة في الزوجات على العدد المسموح به شرعا؛ \n3 - \n حدوث الطالق بين الزوجين ثالث مرات، إلى أن تنقضي عدة المرأة من زوج آخر\nدخل بها دخوال يعتد به شرعا؛ \n زواج المطلقة من آخر يبطل الثالث السا", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.05640203216646037, "y": -0.01964136359957889}, {"id": 4062, "article": "40", "content": "المادة40\n \n يمنع التعدد إذا خيف عدم العدل بين الزوجات، كما يمنع في حالة وجود شرط من الزوجة\n .بعدم التزوج عليها \n\n \n- \n21\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09416399612018599, "y": -0.04732806228016197}, {"id": 4063, "article": "41", "content": "المادة41\n \n ال تأذن :المحكمة بالتعدد \n- \n إذا لم يثبت لها المبرر الموضوعي االستثنائي؛ \n- \n إذا لم تكن لطالبه الموارد الكافية إلعالة األسرتين، وضمان جميع الحقوق من نفقة\nوإسكان \n .ومساواة في جميع أوجه الحياة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.06626922441383594, "y": -0.04018710470133388}, {"id": 4064, "article": "42", "content": "المادة42\n \n في حالة عدم وجود شرط االمتناع عن التعدد، يقدم الراغب فيه طلب اإلذن بذلك إلى\n .المحكمة \n يجب أن يتضمن الطلب بيان األسباب الموضوعية االستثنائية المبررة له، وأن يكون\n .مرفقا بإقرار عن وضعيته المادية", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.03402116399202976, "y": -0.01727613648077699}, {"id": 4065, "article": "43", "content": "المادة43\n \n تستدعي المحكمة الزوجة المراد التزوج عليها للحضور. فإذا توصلت شخصيا ولم\n تحضر أو امتنعت من تسلم االستدعاء، توجه إليها المح كمة عن طريق عون كتابة الضبط\n إنذاراً تشعرها فيه بأنها إذا لم تحضر في الجلسة المحدد تاريخها في اإلنذار فسيبت في طلب\n .الزوج في غيابها \n كما يمكن البت في الطلب في غيبة ", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.003188530825869723, "y": 0.011092053911355468}, {"id": 4066, "article": "361", "content": "الفصل361\n \n .من القانون الجنائي بطلب من الزوجة المتضررة \n\n \n- \n22\n  -", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.11315068540731926, "y": -0.03243586745072424}, {"id": 4067, "article": "44", "content": "المادة44\n \nتجري المناقشة في غرفة المشورة ب حضور الطرفين. ويستمع إليهما لمحاولة التوفيق\n .واإلصالح، بعد استقصاء الوقائع وتقديم البيانات المطلوبة \n للمحكمة أن تأذن بالتعدد بمقرر معلل غير قابل ألي طعن، إذا ثبت لها مبرره الموضوعي\nاالستثنائي، وتوفرت شروطه الشرعية، مع تقييده بشروط لفائدة المتزوج عليها وأط", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.031139415525271583, "y": -0.04943627522986594}, {"id": 4068, "article": "45", "content": "المادة45\n \n إذا ثبت للمحكمة من خالل المناقشات تعذر استمرار العالقة الزوجية، وأصرت الزوجة\n المراد التزوج عليها على المطالبة بالتطليق، حددت المحكمة مبلغا الستيفاء كافة حقوق الزوجة\n .وأوالدهما الملزم الزوج باإلنفاق عليهم \nيجب على الزوج إيداع المبلغ المحدد د .اخل أجل ال يتعدى سبعة أيام \n تصدر المحكمة بم", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.021198105216855986, "y": 0.04977698194215434}, {"id": 4069, "article": "46", "content": "المادة46\n \n في حالة اإلذن بالتعدد، ال يتم العقد مع المراد التزوج بها إال بعد إشعارها من طرف\n القاضي بأن مريد الزواج.بها متزوج بغيرها ورضاها بذلك \n .يضمن هذا اإلشعار والتعبير عن الرضى في محضر رسمي \n\n \n- \n23\n  -\n \n القسم الرابع: الشروط اإلرادية لعقد الزواج وآثارها", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08023137954597881, "y": 0.008955033303318769}, {"id": 4070, "article": "47", "content": "المادة47\n \n الشروط كلها ملزمة، إال ما خالف منها أحكام العقد ومقاصده وما خالف القواعد اآلمرة\n .للقانون فيعتبر باطال والعقد صحيحا \nا لمادة48\n \n الشروط التي تحقق فائدة مشروعة لمشترطها تكون صحيحة وملزمة لمن التزم بها من\n .الزوجين \n إذا طرأت ظروف أو وقائع أصبح معها التنفيذ العيني للشرط مرهقا، أمكن للملتز", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.015261652122830137, "y": 0.03335443367648287}, {"id": 4071, "article": "49", "content": "المادة49\n \n لكل واحد من الزوجين ذمة مالية مستقلة عن ذمة اآلخر، غير أنه يجوز لهما في إطار\n .تدبير األموال التي ستكتسب أثناء قيام الزوجية، االتفاق على استثمارها وتوزيعها \n.يضمن هذا االتفاق في وثيقة مستقلة عن عقد الزواج \n يقوم العدالن بإشعار.الطرفين عند زواجهما باألحكام السالفة الذكر \n إذا لم يكن هناك ", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.020939137183425115, "y": 0.029720757597290925}, {"id": 4072, "article": "50", "content": "المادة50\n \n إذا توفرت في عقد الزواج أركانه وشروط صحته، وانتفت الموانع، فيعتبر صحيحا وينتج\n ،جميع آثاره من الحقوق والواجبات التي رتبتها الشريعة بين الزوجين واألبناء واألقارب\n .المنصوص عليها في هذه المدونة \n الفرع األول: الزوجان", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.11383134630988816, "y": -0.01439520234172224}, {"id": 4073, "article": "51", "content": "المادة51\n \n الحقوق :والواجبات المتبادلة بين الزوجين \n1\n  -  \n ،المساكنة الشرعية بما تستوجبه من معاشرة زوجية وعدل وتسوية عند التعدد\n وإحصان كل منهما وإخالصه لآلخر، بلزوم العفة وصيانة العرض والنسل؛ \n2\n  -  \n المعاشرة بالمعروف، وتبادل االحترام والمودة والرحمة والحفاظ على مصلحة\nاألسرة؛ \n3 - ت حمل الزوجة", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.026069309462992536, "y": 0.02826600634313781}, {"id": 4074, "article": "53", "content": "المادة53\n \nإذا قام أحد الزوجين بإخراج اآلخر من بيت الزوجية \n دون مبرر، تدخلت النيابة العامة\n .من أجل إرجاع المطرود إلى بيت الزوجية حاال، مع اتخاذ اإلجراءات الكفيلة بأمنه وحمايته \n الفرع الثاني: األطفال", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.04625429372434503, "y": -0.049821005275442386}, {"id": 4075, "article": "54", "content": "المادة54\n \n:لألطفال على أبويهم الحقوق التالية \n1 - حماية حياتهم وصحتهم منذ الحمل إلى حين بلوغ سن الرشد؛ \n2 - \n العمل على تثبيت هويتهم والحفاظ عليها خاصة، بالنسبة لالسم والجنسية والتسجيل\n في الحالة المدنية؛ \n3 - \n النسب والحضانة والنفقة طبقا ألحكام الكتاب الثالث من هذه المدونة؛ \n4 - \n إرضاع األم ألوا", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": 0.005184648799237603, "y": -0.016683563172817606}, {"id": 4076, "article": "55", "content": "المادة55\n \nينشئ عقد الزواج آثارا تمتد إلى أقارب الزوج ،ين كموانع الزواج الراجعة إلى المصاهرة\n .والرضاع، والجمع \nالباب الثاني: الزواج غير الصحيح وآثاره", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09403835436327282, "y": -0.06784762410114638}, {"id": 4077, "article": "56", "content": "المادة56\n \n.الزواج غير الصحيح يكون إما باطال وإما فاسدا \n\n \n- \n27\n  -\n \n الفرع األول: الزواج الباطل", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.1380562252661332, "y": -0.030117923996675934}, {"id": 4078, "article": "57", "content": "المادة57\n \n :يكون الزواج باطال \n1 - إذا اختل فيه أحد األركان المنصوص عليها في الما دة10\n \n أعاله؛ \n2 - \n إذا وجد بين الزوجين أحد موانع الزواج المنصوص عليها في المواد35\n \n إلى39\n \nأعاله؛ \n3 - \n .إذا انعدم التطابق بين اإليجاب والقبول", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.09644574691940039, "y": -0.029394459124231682}, {"id": 4079, "article": "58", "content": "المادة58\n \n تصرح المحكمة ببطالن الزواج تطبيقا ألحكام المادة57\n \n ،أعاله بمجرد اطالعها عليه\n .أو بطلب ممن يعنيه األمر \nيترتب على هذا الزواج بعد البناء الصداق واالستبراء، كما يترتب عليه عند حسن ا لنية\n.لحوق النسب وحرمة المصاهرة \nالفرع الثاني: الزواج الفاسد", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.07569024897434569, "y": -0.04430249966502907}, {"id": 4080, "article": "59", "content": "المادة59\n \n يكون الزواج فاسدا إذا اختل فيه شرط من شروط صحته طبقا للمادتين60\n  و61\n \n بعده\nومنه ما يفسخ قبل البناء ويصحح بعده، ومنه م .ا يفسخ قبل البناء وبعده", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.10157360527032329, "y": -0.019919224551101664}, {"id": 4081, "article": "60", "content": "المادة60\n \n ،يفسخ الزواج الفاسد قبل البناء وال صداق فيه إذا لم تتوفر في الصداق شروطه الشرعية\n .ويصحح بعد البناء بصداق المثل، وتراعي المحكمة في تحديده الوسط االجتماعي للزوجين", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.11553521799854125, "y": -0.032119269550529586}, {"id": 4082, "article": "61", "content": "المادة61\n \n ،يفسخ الزواج الفاسد لعقده قبل البناء وبعده :وذلك في الحاالت اآلتية \n\n \n- \n28\n  -\n \n- إذا كان الزواج في المرض المخوف ألحد الزوجين، إال أن يشفى المريض بعد الزواج؛ \n- \n إذا قصد الزوج بالزواج تحليل المبتوتة لمن طلقها ثالثا؛ \n- \n .إذا كان الزواج بدون ولي في حالة وجوبه \nيعتد بالطالق أو التطليق", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.08947184947011312, "y": -0.012020670508385881}, {"id": 4083, "article": "62", "content": "المادة62\n \n إذا اقترن اإليجاب أو القبول بأجل أو شرط واقف أو فاسخ، تطبق أحكام المادة47\n \n .أعاله", "law": "code-famille-70-03.pdf", "law_idx": 0, "x": -0.058652705901114835, "y": -0.037347437901819866}, {"id": 1480, "article": "101", "content": "المادة101\n \n من القانون رقم06.99\n \n المتعلق بحرية األسعار والمنافسة، الصادر\n بتنفيذه\nظهير شريف \n رقم1.00.225\n \n بتاريخ2 \n ربيع األول1421\n (\n5 يوني\nو \n2000\n)، \n والتي نسخت الفصول289\n و290\n و291\n من القانون الجنائي، الجريدة الرسمية \n عدد\n4810\n \n بتاريخ3 \n ربيع اآلخر1421\n (\n6 \n يوليو2000\n)، \n ص1941؛ \n2", "law": "code-penal-2024.pdf", "law_idx": 1, "x": 0.026139987890500795, "y": 0.10404113101363513}, {"id": 1481, "article": "733", "content": "المادة733\n من القانون ر قم15.95\n \n المتعلق بمدونة التجارة الصادر بتنفيذه\nظهير شريف \n رقم1.96.83\n \n بتاريخ15\n \n من ربيع األول1417\n (فاتح أغسطس \n1996\n)، الجريدة الرسمية \n عدد4418\n \n بتاريخ19\n جمادى األولى1417\n (\n3 \n أكتوبر\n1996\n)، \n ص2187؛ \n28\n-\n \n القانون رقم25.93\n \n المغير بموجبه القانون الجنائي، ال", "law": "code-penal-2024.pdf", "law_idx": 1, "x": 0.049712298642092326, "y": 0.13464716064138876}, {"id": 1482, "article": "733", "content": "ا أحكام عقوبة الحبس ضمن الشروط المنصوص عليها في الفصل28\n. \n العقوبات السالبة للحرية التي تتجاوز مدتها خمس سنوات والمحكوم بها من أجل جناية\n تسري عليها أحكام عقوبة السجن ضمن الشروط المنصوص عليها في الفصل24\n. \nالفصل السادس \n في جميع الحاالت التي يكون قد صدر فيها حكم بعقوبة إضافية أو تكميلية ولم يبدأ تن", "law": "code-penal-2024.pdf", "law_idx": 1, "x": 0.022192687138795873, "y": 0.03775086271756548}, {"id": 1483, "article": "1", "content": "الفصل1\n \n يحدد التشريع الجنائي أفعال اإلنسان التي يعدها جرائم، بسبب ما تحدثه من اضطراب\n.اجتماعي، ويوجب زجر مرتكبيها بعقوبات أو بتدابير وقائية", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.10552082863370485, "y": -0.12380233223321487}, {"id": 1484, "article": "2", "content": "الفصل2\n \n.ال يسوغ ألحد أن يعتذر بجهل التشريع الجنائي", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.11561596044093021, "y": -0.042469958832232896}, {"id": 1485, "article": "3", "content": "الفصل3\n \nال يسوغ مؤاخذة أحد على فعل ال يعد جريمة بصريح القانون وال  معاقبته بعقوبات لم\n.يقررها القانون", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.1590829943067563, "y": -0.09163559630682504}, {"id": 1486, "article": "4", "content": "الفصل4\n \n.ال يؤاخذ أحد على فعل لم يكن جريمة بمقتضى القانون الذي كان ساريا وقت ارتكابه", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.14749418189804903, "y": -0.03058196707063129}, {"id": 1487, "article": "5", "content": "الفصل5\n \n .ال يسوغ مؤاخذة أحد على فعل لم يعد يعتبر جريمة بمقتضى قانون صدر بعد ارتكابه\n فإن كان قد صدر حكم باإلدانة، فإن العقوبات المحكوم بها، أصلية كانت أو إضافية، يجعل حد\n.لتنفيذها", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.15236680531709268, "y": -0.06769412592714666}, {"id": 1488, "article": "6", "content": "الفصل6\n \n في حالة وجود عدة قوانين سارية المفعول، بين تاريخ ارتكاب الجريمة والحكم النهائي\n .بشأنها، يتعين تطبيق القانون األصلح للمتهم", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.1325390262376265, "y": -0.08565133145666748}, {"id": 1489, "article": "7", "content": "الفصل7\n \n ال تشمل مقتضيات الفصلين5 و6 القوانين المؤقتة التي تظل، ولو بعد انتهاء ا ،لعمل بها\n.سارية على الجرائم المرتكبة خالل مدة تطبيقها", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.08859735183791387, "y": -0.08030335690621501}, {"id": 1490, "article": "8", "content": "الفصل8\n \n.ال يجوز الحكم بأي تدبير وقائي، إال في األحوال وطبق الشروط المقررة في القانون \n\n \n \n- \n12\n -\n.وال يحكم إال بالتدابير المنصوص عليها في القانون النافذ وقت صدور الحكم", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.07784208493891291, "y": -0.061070983817125606}, {"id": 1491, "article": "9", "content": "الفصل9\n \n ينتهي تنفيذ التدبير الوقائي إذا صدر قانون جديد يزيل صبغة الجريمة عن الفعل الذي\n.استوجبه، أو إذا صدر قانون يلغي ذلك التدبير", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.10254809870795499, "y": -0.05223388691787543}, {"id": 1492, "article": "10", "content": "الفصل10\n \n يسري التشريع الجنائي المغربي على كل من يوجد بإقليم المملكة من وطنيين وأجانب\nوعديمي الجنسية، مع مراعاة االستثناءات المقررة في القانون العام الداخلي والقانون الدو.لي", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.025803018056620396, "y": -0.13179014595610114}, {"id": 1493, "article": "11", "content": "الفصل11\n \n يدخل ضمن إقليم المملكة، السفن والطائرات المغربية أينما وجدت، فيما عدا الحاالت\n.التي تكون فيها خاضعة لتشريع أجنبي بمقتضى القانون الدولي", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.03567786813427765, "y": -0.09440142462129335}, {"id": 1494, "article": "12", "content": "الفصل12\n \n3\n \n يطبق التشريع الجنائي المغربي على الجرائم المرتكبة خارج المملكة، إذا كانت من\n اختصاص المحاكم الزجرية المغربية حسب الفصول751\n \n إلى756\n \n.من المسطرة الجنائية \n                                                \n \n3 - \n تم تعوض المواد من751\n \n الى756\n \n في الفصل12\n أعاله ب المواد من707\n \n إ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.006749832114484945, "y": -0.06602706065228667}, {"id": 1495, "article": "13", "content": "الفصل13\n \n4\n \n تطبق على البالغين ثمان عشرة سنة ميالدية كاملة العقوبات والتدابير الوقائية المنصوص\nعل.يها في هذا القانون \n تطبق في حق األحداث الجانحين القواعد الخاصة المنصوص عليها في الكتاب الثالث\n.من القانون المتعلق بالمسطرة الجنائية \nالجزء األول: في العقوبات \n (الفصول14\n – \n60\n )", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.051419642688571195, "y": -0.049490805838993734}, {"id": 1496, "article": "14", "content": "الفصل14\n \n5\n \n.تكون العقوبات إما أصلية أو بديلة أو إضافية \n تكون أصلية عندما يمكن.الحكم بها وحدها دون أن تضاف إلى عقوبة أخرى \n.وتكون بديلة عندما يمكن الحكم بها بديال للعقوبة السالبة للحرية \n وتكون إضافية عندما ال يمكن الحكم بها وحدها، وتضاف إلى عقوبة أصلية أو بديلة، أو\nعندما تكون ناتجة عن الحكم بعقو", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0015833791905095764, "y": 0.041224752040113055}, {"id": 1497, "article": "15", "content": "الفصل15\n \n.العقوبات األصلية إما جنائية أو جنحية أو ضبطية", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.13181436354410464, "y": -0.08501953296404761}, {"id": 1498, "article": "16", "content": "الفصل16\n \n :العقوبات الجنائية األصلية هي \n1 - اإلعدام \n2 - السجن المؤبد \n3 - السجن المؤقت من خمس سنوات إلى ثالثين سنة \n4 - اإلقامة اإلجبارية \n5 - التجريد من الحقوق الوطنية", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.09171802969719241, "y": -0.11583991025747561}, {"id": 1499, "article": "17", "content": "الفصل17\n \n6\n \n :العقوبات الجنحية األصلية هي \n1 – الحبس؛ \n2 - \n الغرامة التي تتجاوز1200\n \n.درهم \n \n وأقل مدة الحبس شهر وأقصاها خمس سنوات، باستثناء حاالت العود أو غيرها التي\n.يحدد فيها القانون مددا أخرى", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0972113430842828, "y": -0.06686018767564253}, {"id": 1500, "article": "18", "content": "الفصل18\n \n7\n \n :العقوبات الضبطية األصلية هي  \n1 - االعتقال لمدة تقل عن شهر؛ \n                                                \n \n6 - \n تم تغيير هذه الفقرة األولى\nبمو\nجب الفصل األ ول من\nال قانون رقم3.80\n \n المغيرة بموجبه بعض مقتضيات القانون\nالجنائي، الصادر بتنفيذه ظهير شريف رقم1.81.283\n \n بتاريخ11\n \n ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0021836007838497724, "y": 0.06473362513032102}, {"id": 1501, "article": "24", "content": "الفصل24\n \n تنفذ عقوبة السجن داخل سجن مركزي مع االنفراد بالليل كلما سمح المكان بذلك ومع\n.الشغل اإلجباري فيما عدا حالة ثبوت عجز بدني \nوال يمكن مطلقا للمحكوم عليه بالسجن أن يشغل في الخارج قبل أن يقضي عشر \n سنوات\n من العقوبة إذا كان محكوما عليه بالسجن المؤبد، أو قبل أن يقضي ربع العقوبة إذا كان محكوما\n.ع", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06625180036078558, "y": -0.08043252585487111}, {"id": 1502, "article": "25", "content": "الفصل25\n \n اإلقامة اإلجبارية هي أن تحدد المحكمة مكانا لإلقامة أو دائرة محدودة ال يجوز للمحكوم\nعليه االبتعاد عنها بدون رخصة طوال المدة التي يحدد ها الحكم بحيث ال تقل عن خمس سنوات\n.متى كانت عقوبة أصلية \n ويبلغ الحكم باإلقامة اإلجبارية إلى اإلدارة العامة لألمن الوطني التي يجب عليها أن\n.تتولى مراقبة اإل", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0037880512221331116, "y": -0.05453483505149197}, {"id": 1503, "article": "26", "content": "الفصل26\n \n :التجريد من الحقوق الوطنية يشمل \n1 - \n عزل المحكوم عليه وطرده من جميع الوظائف العمومية وكل الخدمات واألعمال\n.العمومية \n2 - \n حرمان المحكوم عليه من أن يكون ناخبا أو منتخبا وحرمانه بصفة عامة من سائر\nالحقوق الوطنية والسياسية ومن حق التحلي بأ .ي وسام \n3 - \n عدم األهلية للقيام بمهمة عضو محلف أ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.018585448867718155, "y": -0.03361407898625508}, {"id": 1504, "article": "27", "content": "الفصل27\n \n عندما يحكم بالتجريد الوطني كعقوبة أصلية فإنه يجوز أن تضاف إليه عقوبة الحبس لمدة\n.يحددها الحكم بحيث ال تزيد عن خمس سنوات \n فإن لم يكن من الممكن الحكم بالتجريد من الحقوق الوطنية، إما لكون المتهم مغربيا سبق\nتجريده من هذه \n.الحقوق، وإما لكونه أجنبيا وجب الحكم بالسجن من خمس سنوات إلى عشر", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06110227480397989, "y": -0.11795455457430666}, {"id": 1505, "article": "28", "content": "الفصل28\n \n تنفذ عقوبة الحبس في إحدى المؤسسات المعدة لهذا الغرض أو في جناح خاص من أحد\n.السجون المركزية مع الشغل اإلجباري في الداخل أو الخارج فيما عدا حالة ثبوت عجز بدني", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.08399671511493823, "y": -0.12495715634034434}, {"id": 1506, "article": "29", "content": "الفصل29\n \nتنفذ عقوبة االع تقال في السجون المدنية أو في ملحقاتها مع الشغل اإلجباري في الداخل\n.أو الخارج فيما عدا حالة ثبوت عجز بدني", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.12348889381724291, "y": -0.09918790156301506}, {"id": 1507, "article": "30", "content": "الفصل30\n \n تبتدئ مدة العقوبة السالبة للحرية من اليوم الذي يصبح فيه المحكوم عليه معتقال بمقتضى\n.حكم حاز قوة الشيء المحكوم به \n وفي حالة تقدم اعتقال احتياطي فإن مدته تخصم بتمامها من مدة العقوبة وتحسب من يوم\n أن وضع المحكوم عليه تحت الحراسة أو من يوم أن ودع رهن االعتقال من أجل الجريمة التي\n.أدت إلى الح", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.04711087190788468, "y": -0.03318568900019828}, {"id": 1508, "article": "31", "content": "الفصل31\n \n إذا تعين تنفيذ عدة عقوبات سالبة للحرية فإن المحكوم عليه يبدأ بقضاء أشدها ما لم ينص\n.القانون على خالف ذلك", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.1492556301099314, "y": -0.09298184568760548}, {"id": 1509, "article": "32", "content": "الفصل32\n \n المرأة المحكوم عليها بعقوبة سالبة للحرية إذا ثبت أنها حامل ألكثر من ستة أشهر فإنها\n ال تنفذ العقوبة إال بعد وضعها بأربعين يوما فإن كانت معتقلة وقت صدور الحكم فإنها تنتفع\n.بنظام االعتقال االحتياطي طوال الفترة الالزمة \n ويؤخر تنفيذ العقوبات السالبة للحرية أيضا في حق النساء\nالالئي \n وضعن قبل", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0909565517648632, "y": -0.061646292754285355}, {"id": 1510, "article": "33", "content": "الفصل33\n \n9\n \n إذا حكم على رجل وزوجته، ولو عن جرائم مختلفة، بالحبس لمدة تقل عن سنة، وكانا\n غير معتقلين يوم صدور الحكم، فإنهما ال ينفذان عقوبتيهما في آن واحد إن هما أثبتا أن لهما\n محل إقامة معينا وأن في كفالتهما وتحت رعايتهما طفال دون الثامنة عشرة ليس في اإلمكان\n ،أن يقوم بكفالته على الوجه المرضي غير", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.09465935060120087, "y": -0.03975632930672812}, {"id": 1511, "article": "34", "content": "الفصل34\n \n إذا صدر حكم بالغرامة وكان المحكوم عليه قد قضى مدة ما رهن االعتقال االحتياطي\nفإنه يجوز للمحكمة أن تقرر إعفاء المحكوم عليه م ن أداء تلك الغرامة كال أو بعضا على أن\n.تعلل قرارها بذلك تعليال خاصا", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.10153484623882203, "y": -0.07326215973510536}, {"id": 1512, "article": "35", "content": "الفصل35\n \n ،الغرامة هي إلزام المحكوم عليه بأن يؤدي لفائدة الخزينة العامة مبلغا معينا من النقود\n.بالعملة المتداولة قانونا في المملكة \n \n                                                \n \n9 - تم تغيير وت تميم هذا الفصل بمقتضى المادة الثالثة من القانون رقم24.03\n المتعلق بتغيير وتتميم مجموعة ا لقانون\n .", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.07846820698437953, "y": -0.014563685860376752}, {"id": 1513, "article": "35-1", "content": "الفصل 35-1\n \n العقوبات البديلة\nه ي العقوبات التي يحكم بها بديال للعقوبات السالبة للحرية في الجنح التي\nال تتجاوز \n.العقوبة المحكوم بها من أجلها خمس سنوات حبسا نافذا \nال يحكم بالعقوبات البديلة في حالة العود. \n تح ول العقوبة البديلة دون تنفيذ العقوبة السالبة \n للحرية على المحكوم عليه، في حالة تنفيذه\nلا", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0914579870388812, "y": -0.07111271302692146}, {"id": 1514, "article": "35-2", "content": "الفصل 35-2\n \n تحدد العقوبات البديلة:في \n1\n- \n العمل ألجل المنفعة\nالعامة؛ \n2\n- \n المراقبة\nاإللكترونية؛ \n3\n- تقييد بعض الحقوق أو فرض تدابير رقابية أو عالجية أو تأهيلية\n؛ \n4\n- \n.الغرامة اليومية", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06683932772477942, "y": -0.06503213044840926}, {"id": 1515, "article": "35-3", "content": "الفصل 35-3\n \n ال يحكم بالعقوبات البديلة في الجنح المتعلقة بالجرائم:التالية \n-\n \n الجرائم المتعلقة بأمن الدولة\nواإلرهاب؛ \n-\n \n االختالس أو الغدر أو الرشوة أو استغالل النفوذ أو تبديد األموال\nالعمومية؛ \n-\n \n غسل\nاألموال؛ \n-\n \n الجرائم\nالعسكرية؛ \n-\n \n االتجار الدولي في\nالمخدرات؛ \n-\n \n االتجار في المؤثرا", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.08439322061018203, "y": -0.08064294753643417}, {"id": 1516, "article": "الثانية", "content": "المادة الثانية من القانون رقم43.22\n المتعلق بالعقوبات البديلة.، سالف الذكر \n\n \n \n- \n19\n -", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.07682718717850831, "y": -0.003993972852388476}, {"id": 1517, "article": "35-4", "content": "الفصل 35-4\n \n إذا قررت المحكمة الحكم بالعقوبة الحبسية المشار إليها في الفقرة األولى من الفصل 35-1\n أعاله، فإنه يمكنها أن تستبدلها بعقوبة بديلة أو أكثر إما تلقائيا أو ب ناء على ملتمس النيابة\nالعامة أو طلب المحكوم عليه أو دفاعه أو \n النائب الشرعي للحدث أو مدير المؤسسة السجنية\nأو من يعنيه األمر. \n وفي ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.00956560193332192, "y": -0.04186889715589294}, {"id": 1518, "article": "35-5", "content": "الفصل 35-5\n \n يمكن للمحكمة أن تحكم بعقوبة العمل ألجل المنفعة العامة بديال للعقوبة السالبة للحرية\n إذا كان المحكوم عليه بالغا.من العمر خمس عشرة سنة على األقل في تاريخ صدور الحكم", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06767517615096677, "y": -0.0616716858885256}, {"id": 1519, "article": "35-6", "content": "الفصل 35-6\n \n يكون العمل ألجل المنفعة العامة غير مؤدى عنه، وينجز لمدة تتراوح بين40\n و3600\n \nساعة \n لفائدة مصالح الدولة أو الجماعات الترابية أو مؤسسات أو هيئات حماية الحقوق\nوالحريات والحكامة الجيدة أو المؤسسا ت العمومية أو المؤسسات الخيرية أو دور العبادة، أو\nغيرها من المؤسسات أو الجمعيات أو المنظمات ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": 0.03356053171369678, "y": -0.014819923639190217}, {"id": 1520, "article": "35-7", "content": "الفصل 35-7\n \n يلتزم المحكوم عليه بتنفيذ عقوبة العمل ألجل المنفعة العامة داخل أجل ال يتجاوز ستة\n أشهر من تاريخ صدور المقرر التنفيذي المشار إليه في المادة 647-2\n \n من القانون المتعلق\n بالمسطرة الجنائية. ويمكن تمديد هذا األجل لمدة مماثلة مرة واحدة بقرار صادر عن قاضي\nتطبيق العقوبات، بناء على طلب مبرر من", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.02982479941671602, "y": -0.054706253702957786}, {"id": 1521, "article": "35-8", "content": "الفصل 35-8\n \n إذا قررت المحكمة الحكم على الحدث بعقوبة حبسية وفقا للمادة482\n \n من القانون المتعلق\nبالمسطرة الجنائية، فيمكنها أن تستبدلها بعقوبة العمل ألجل المنفع ة العامة مع مراعاة أحكام", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.0598634210858761, "y": -0.06300008994818876}, {"id": 1522, "article": "35-5", "content": "الفصل 35-5\n \n.أعاله \n يجب على قاضي األحداث أن يتأكد من مدى مالءمة العمل ألجل المنفعة العامة مع القدرة\nالجسدية للحدث ومصلحته الفضل\nى \n.ولحاجيات تكوينه وإعادة إدماجه", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.07830346837498986, "y": -0.08042651492606549}, {"id": 1523, "article": "35-9", "content": "الفصل 35-9\n \nتطبق على أنشطة العمل ألجل المنفعة العامة المقتضيات التشريعي ة والتنظيمية المتعلقة\nبحماية أمن \n.وصحة العاملين \n تتحمل الدولة مسؤولية تعويض األضرار التي تسبب فيها المحكوم عليه والتي لها عالقة\n مباشرة بتنفيذ عقوبة العمل ألجل المنفعة العامة. ويحق لها الرجوع على المحكوم عليه للمطالبة\n.بما تم", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.019657421781199898, "y": -0.0502522045270915}, {"id": 1524, "article": "35-10", "content": "الفصل 35-10\n \n.يمكن للمحكمة أن تحكم بالمراقبة اإللكترونية بديال للعقوبة السالبة للحرية \n \n يتم الخضوع للمراقبة اإللكترونية من خالل مراقبة حركة وتنقل المحكوم عليه إلكترونيا\nبواحدة أو أكثر من وسائل \n.المراقبة اإللكترونية المعتمدة \nيحدد مكان ومدة المراقبة اإل لكترونية من طرف المحكمة ويراعى في تحديدها خ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.04040983121269087, "y": -0.023802271961758274}, {"id": 1525, "article": "35-11", "content": "الفصل 35-11\n \n يمكن للمحكمة أن تحكم بالعقوبة المقيدة لبعض الحقوق أو فرض تدابير رقابية أو عالجية\nأو تأهيلية \n.بديال للعقوبات السالبة للحرية \n تستهدف هذه العقوبات اختبار المحكوم عليه للتأكد من استعداده لتقويم سلوكه واستجابته\n.إلعادة اإلدماج", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.07309494288095457, "y": -0.087502427447355}, {"id": 1526, "article": "35-12", "content": "الفصل 35-12\n \nالعقوبات المقيدة لبعض ال حقوق أو فرض تدابير رقابية أو عالجية أو تأهيلية والتي يمكن\n ،الحكم بواحدة أو أكثر منها:هي \n1 - \n مزاولة المحكوم عليه نشاطا مهنيا محددا أو تتبعه دراسة أو تأهيال مهنيا\nمحددا؛ \n2\n- \n إقامة المحكوم عليه بمكان محدد والتزامه بعدم مغادرته، أو بعدم مغادرته في أوقات\n،معي", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06229664057444694, "y": -0.05107512080206509}, {"id": 1527, "article": "35-13", "content": "الفصل 35-13\n \n يلتزم المحكوم عليه بتنفيذ العقوبات المقيدة لبعض الحقوق أو فرض تدابير رقابية أو\nعالجية أو \n تأهيلية، داخل أجل ال يتجاوز ستة أشهر من تاريخ صدور المقرر التنفيذي المشار\n إليه في المادة 647-2\n من القانون المتعلق \n بالمسطرة الجنائية، ويمكن تمديد هذا األجل لمدة\nمماثلة مرة واحدة، بناء على طلب", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.04626861252254433, "y": -0.05318609400056978}, {"id": 1528, "article": "35-14", "content": "الفصل 35-14\n \n.يمكن للمحكمة أن تحكم بعقوبة الغرامة اليومية بديال للعقوبة الحبسية النافذة \n\n \n \n- \n22\n -\nتتمثل الغرامة اليومية في مبلغ مالي تحدده المحكمة عن كل يوم من المدة الحب\nسية \n.المحكوم بها \n.يمكن الحكم بعقوبة الغرامة اليومية على األحداث في حالة موافقة وليهم أو من يمثلهم \n ال يمكن الحكم بعقوبة ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06802367740513435, "y": -0.05224968683812532}, {"id": 1529, "article": "35-15", "content": "الفصل 35-15\n \n يحدد مبلغ الغرامة اليومية بين100\n و2.000\n درهم \n عن كل يوم من العقوبة الحبسية\n.المحكوم بها \n تراعي المحكمة في تحديد الغرامة اليومية اإلمكانيات المادية للمحكوم عليه أو ذويه\nوتحمالته المالية وخطورة \n.الجريمة المرتكبة والضرر المترتب عنها \nيلتزم \n المحكوم عليه بأداء المبلغ المحدد له في أج", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.022299628963950557, "y": -0.03147112356488972}, {"id": 1530, "article": "36", "content": "الفصل36\n \n11\n \n :العقوبات اإلضافية هي \n1 - الحجر القانوني \n2 - التجريد من الحقوق الوطنية \n3 - الحرمان المؤقت من ممارسة بعض الحقوق الوطنية أو المدنية أو العائلية \n4 - \n الحرمان النهائي أو المؤقت من الحق في المعاشات التي تصرفها الدولة والمؤسسات\n.العمومية \n                                              ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.022045047152437342, "y": 0.001292309495654608}, {"id": 1531, "article": "37", "content": "الفصل37\n \n الحجر القانوني والتجريد من الحقوق الوطنية، كعقوبة تبعية، ينتجان عن العقوبات\n.الجنائية وحدها \n ويتعين تطبيقهما بحكم القانون دون.حاجة إلى النطق بهما في الحكم", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.11825674831712063, "y": -0.11157281196212636}, {"id": 1532, "article": "38", "content": "الفصل38\n \n الحجر القانوني يحرم المحكوم عليه من مباشرة حقوقه المالية طوال مدة تنفيذ العقوبة\n.األصلية \n وله في جميع األحوال أن يختار وكيال ينوب عنه في مباشرة تلك الحقوق تحت إشراف\n.الوصي القضائي المعين في أحكام الفصل التالي", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.09116057431734215, "y": -0.06919833402887214}, {"id": 1533, "article": "39", "content": "الفصل39\n \n يعين وفق اإلجراءات المقررة في شأن المحجورين القضائيين، وصي لإلشراف على\n إدارة أموال المحكوم عليه أثناء وجوده في حالة الحجر القانوني. فإذا كان المحكوم عليه قد\n اختار وكيال لمباشرة تلك اإلدارة، فإنه يكون تحت إشراف الوصي ومسؤوال أمامه. وفي غير\n هذه الحالة يتولى.الوصي بنفسه مباشرة تلك اإلدارة", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.008785588601055343, "y": -0.030137825181938662}, {"id": 1534, "article": "40", "content": "الفصل40\n \n12\n \n يجوز للمحاكم، في الحاالت التي يحددها القانون، إذا حكمت بعقوبة جنحية أن تحرم\n المحكوم عليه، لمدة تتراوح بين سنة وعشر سنوات، من ممارسة حق أو عدة حقوق من الحقوق\n الوطنية أو المدنية أو العائلية المنصوص عليها في الفصل26\n. \n يجوز أيضا للمحاكم تطبيق مقتضيات الفقرة األولى من هذا الفصل إذا حك", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06603057840326237, "y": -0.09400230254825075}, {"id": 1535, "article": "41", "content": "الفصل41\n \n كل حكم باإلعدام أو السجن المؤبد يتبعه حتما الحرمان النهائي من الحق في المعاش الذي\nتصرفه الدولة، ويطبق هذا الحرمان بحكم القانون، دون حاجة للنطق ب.ه في الحكم \n أما الحكم الصادر بعقوبة جنائية غير العقوبتين المنصوص عليهما في الفقرة السابقة\n.فيجوز أن يتضمن النص على الحرمان المؤقت من الحق في ال", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.04376975971012319, "y": -0.06475444677866503}, {"id": 1536, "article": "42", "content": "الفصل42\n \n.المصادرة هي تمليك الدولة جزءا من أمالك المحكوم عليه أو بعض أمالك له معينة \nا لفصل43\n \n في حالة الحكم بالمؤاخذة عن فعل يعد جناية، يجوز للقاضي أن يحكم بأن يصادر لفائدة\n الدولة، مع حفظ حقوق الغير، األدوات واألشياء التي استعملت أو كانت ستستعمل في ارتكاب\n الجريمة أو التي تحصلت منها وكذلك المنح", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06394608078420895, "y": -0.06402392489068098}, {"id": 1537, "article": "44", "content": "الفصل44\n \n في حالة الحكم بالمؤاخذة عن أفعال تعد جنحا أو مخالفات ال يجوز الحكم بالمصادرة\n.المشار إليها في الفصل السابق إال في األحوال التي يوجد فيها نص قانوني صريح", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.11591947928895927, "y": -0.05531450987193097}, {"id": 1538, "article": "44-1", "content": "الفصل 44-1\n \n13\n \n يمكن للمحكمة أن تحكم بالمصادرة المنصوص عليها في الفصل42\n \n من هذا القانون إذا\n.تعلق األمر بجريمة إرهابية \n                                                \n \n12\n - تم تتميم هذ ا الفصل بمقتضى المادة الثانية من الباب األول من القانون رقم03.03\n المتعلق بمكافحة اإلرها ،ب\n بتنفيذه ظهير ", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.017957761175750386, "y": 0.03925681392604324}, {"id": 1539, "article": "45", "content": "الفصل45\n \nالمصادرة ال تمس إال األشياء المملوكة للمحكوم عليه. باستثناء األحوال المن صوص عليها\n.في هذه المجموعة \n وإذا كان المال محل المصادرة مملوكا على الشياع بين المحكوم عليه والغير فإن\n المصادرة ال تنصب إال على نصيب المحكوم عليه ويترتب عنها حتما القسمة أو التصفية على\n.طريق المزايدة", "law": "code-penal-2024.pdf", "law_idx": 1, "x": -0.06094296733505994, "y": -0.016726621525047686}, {"id": 4423, "article": "1", "content": "المادة1 \n كل متهم أو مشتبه فيه بارتكاب جريمة يعتبر بريئا إلى أن تثبت إدانته قانوناً بمقرر\n .مكتسب لقوة الشيء المقضي به، بناء على محاكمة عادلة تتوفر فيها كل الضمانات القانونية \n .يفسر الشك لفائدة المتهم \nالباب الثاني: إقا مة الدعوى العمومية والدعوى المدنية", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.04744806701621424, "y": -0.0751403306081321}, {"id": 4424, "article": "2", "content": "المادة2 \nيترتب \n عن كل جريمة الحق \n في إقامة دعوى عمومية لتطبيق العقوبات والحق في إقامة \nدعوى مدنية للمطالبة بالتعويض عن الضرر الذي تسببت \n فيه \n .الجريمة \nالباب الثالث: الدعوى العمومية", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.08384266586501847, "y": -0.05006369520995349}, {"id": 4425, "article": "3", "content": "المادة3 \n تمارس الدعوى العمومية ضد الفاعل األصلي للجريمة \n والمساهمين والمشاركين \n في \n .ارتكابها \n يقيم الدعوى العمومية ويمارسها \n قضاة النيابة \n العامة، كما يمكن أن يقيمها الموظفون \nالمكلفون بذلك \n .ًقانونا \nيمكن أن يقيمها \n الطرف المتضرر طبقا للشروط المحددة \n في \n .هذا القانون \n إذا أقيمت الدعوى ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.06038897228631524, "y": -0.08911262631204758}, {"id": 4426, "article": "4", "content": "المادة4 \nتسقط الدعوى \n العمومية بموت الشخص \n المتابع، وبالتقادم وبالعفو الشامل وبنسخ\n،المقتضيات الجنائية التي تجرم الفعل \n وبصدور مقرر اكتسب قوة \n .الشيء المقضي به \nوتسقط بالصلح عندما ينص القانون صراحة على \n .ذلك \n تسقط أيضا بتنازل المشتكي عن شكايته، إذا كانت الشكاية شرطاً ضرورياً للمتابعة، ما\n .لم ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.01410297301160156, "y": -0.05392294752163087}, {"id": 4427, "article": "5", "content": "المادة 5 \n3\n  \n \n:تتقادم الدعوى العمومية، ما لم تنص قوانين خاصة على خالف ذلك بمرور \n- \n خمس عشرة سنة ميالدية كاملة تبتدئ من يوم ارتكاب الجناية؛ \n- \n أربع سنوات ميالدية كاملة تبتدئ من يوم ارتكاب الجنحة؛ \n- \n.سنة ميالدية كاملة تبتدئ من يوم ارتكاب المخالفة \n غير أنه إذا كان الضحية قاصراً وتعرض العتداء ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.02251744747098283, "y": -0.006298932405557598}, {"id": 4428, "article": "6", "content": "المادة6 \n4\n \nينقطع أمد تقادم الدعوى \n العمومية بكل إجراء من إجراءات المتابعة أو التحقيق أو\n المحاكمة تقوم به السلطة القضائية أو \n.تأمر به، وبكل إجراء يعتبره القانون قاطعا للتقادم \n يقصد بإجراءات \n المتابعة في مفهوم هذه المادة، كل إجراء يترتب عنه رفع الدعوى \nالعمومية إلى \n هيئة التحقيق أو هيئة الحكم.", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.05703331201000874, "y": 0.022291018639417227}, {"id": 4429, "article": "7", "content": "المادة7\n5 \n يرجع \n الحق في إقامة الدعوى المدنية للتعويض عن الضرر الناتج عن \n جناية أو جنحة \n أو \n،مخالفة لكل من تعرض شخصياً لضرر جسماني \n أو مادي \n أو \n معنوي تسببت فيه الجريمة \n .مباشرة \n يمكن للجمعيات المعلن أنها ذات منفعة عامة أن تنتصب طرفاً مدنياً، إذا كانت قد تأسست\n بصفة قانونية منذ أربع سنوات ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.032775694060022946, "y": -0.017364111191210688}, {"id": 4430, "article": "8", "content": "المادة8 \nيمكن أن تقام الدعوى المدنية ضد الفاعلين األصليين أو المساهمين أو المشاركين \n في\nارتكاب الجريمة، وضد ورثتهم \n أو األشخاص \n المسؤولين \n ًمدنيا \n .عنهم", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.010143049021374957, "y": -0.0873096359877915}, {"id": 4431, "article": "9", "content": "المادة9 \nيمكن إقامة الدعوى المدنية والدعوى العمومية في آن واحد أمام المحكمة \n الزجرية \nالمحالة إليها الدعوى \n .العمومية \nتختص هذه المحكمة سواء كان \n المسؤول عن الضرر شخصا ذاتيا \n أو معنويا خاضعا \nللقانون المدني. كما تختص \n بالنظر في القضايا المنسوبة \n ألشخاص القانون العام \n في حالة ما \nإذا كانت دعوى", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.04303800309273825, "y": -0.07287437417803598}, {"id": 4432, "article": "10", "content": "المادة10\n \nيمكن إقامة الدعوى المدنية، منفصلة \n عن الدعوى \n،العمومية لدى المحكمة المدنية \n .المختصة \n \n5 - \n تم تتميم المادة7 \n أعاله، بمقتضى المادة7 \n من القانون رقم103.13\n \n المتعلق بمحاربة العنف ضد النساء الصادر\n بتنفيذه الظهير الشريف رقم1.18.19\n \n بتاريخ5 \n جمادى اآلخرة1439\n  (\n22\n \n فبراير2018\n ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.026231131880830205, "y": -0.01982309767841216}, {"id": 4433, "article": "11", "content": "المادة11\n \n ال يجوز للطرف المتضرر الذي أقام دعواه لدى المحكمة المدنية المختصة أن يقيمها لدى\n .المحكمة الزجرية \nغير أنه يجوز له ذلك إذا أحالت النيابة العامة الدعوى العمومية إلى المحكمة \n الزجرية\n .قبل أن تصدر المحكمة المدنية حكمها في الموضوع", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.0012593453622760274, "y": -0.06234872328595025}, {"id": 4434, "article": "12", "content": "المادة12\n \n،ًإذا كانت المحكمة الزجرية تنظر في الدعوى العمومية والدعوى المدنية معا فإن وقوع \nسبب مسقط للدعوى العمومية \n يترك الدعوى المدنية \n،قائمة \n وتبقى خاضعة الختصاص \n المحكمة \n .الزجرية", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.0545655749773378, "y": -0.07618859425623488}, {"id": 4435, "article": "13", "content": "المادة13\n \n يمكن للطرف \n المتضرر أن \n يتخلى \n عن دعواه أو يصالح بشأنها \n أو \n يتنازل \n عنها \n دون أن \nيترتب عن ذلك انقطاع سير الدعوى \n العمومية \n أو \n،توقفها \n إال إذا سقطت هذه الدعوى تطبيقا \nللفقرة الثالثة من المادة \n الرابعة، مع مراعاة مقتضيات المادة372\n \n.بعده", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.04662938220093744, "y": 0.002739682769778519}, {"id": 4436, "article": "14", "content": "المادة14\n \nتتقادم \n الدعوى \n المدنية طبقا للقواعد المعمول بها في القانون \n .المدني  \nإذا تقادمت الدعوى العمومية \n فال \n يمكن إقامة الدعوى \n المدنية إال أمام المحكمة \n .المدنية \n \n \n \n \n\n \n - \n23\n -\n الكتاب األول: التحري عن الجرائم ومعاينتها \n القسم األول: السلطات المكلفة بالتحري عن الجرائم \n الباب ا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.0035765717478545163, "y": -0.08283183254289095}, {"id": 4437, "article": "15", "content": "المادة15\n \n .تكون المسطرة التي تجرى أثناء البحث والتحقيق سرية \n كل شخص يساهم \n في إجراء \n هذه المسطرة ملزم بكتمان السر المهني ضمن \n الشروط\nوتحت طائلة العقوبات المقررة في القانون \n .الجنائي \n الباب الثاني: الشرطة القضائية \n الفرع األول: أحكام عامة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.038490712236739257, "y": -0.06505969928392533}, {"id": 4438, "article": "16", "content": "المادة16\n \n يمارس مهام الشرطة القضائية القضاة والضباط \n والموظفون \n واألعوان \n المبينون \n في هذا \n .القسم \nيسير وكيل الملك \n أعمال الشرطة القضائية في دائرة \n .نفوذه", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.06982892434559575, "y": -0.1569193877649709}, {"id": 4439, "article": "17", "content": "المادة17\n \nتوضع الشرطة \n القضائية في دائرة \n نفوذ كل محكمة استئناف \n تحت سلطة \n الوكيل العام \nللملك ومراقبة الغرفة الجنحية بمحكمة االستئناف المشار إليها في الفرع الخامس من هذا \n.الباب", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.011802312973257447, "y": -0.12187694680000477}, {"id": 4440, "article": "18", "content": "المادة18\n \n يعهد إلى الشرطة القضائية تبعا للبيانات المقررة في هذا القسم بالتثبت من وقوع الجرائم\n.وجمع األدلة عنها والبحث عن مرتكبيها \n تقوم بتنفيذ أوامر .وإنابات قضاء التحقيق وأوامر النيابة العامة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.006451141705735766, "y": -0.08779811127850838}, {"id": 4441, "article": "19", "content": "المادة19\n \n تضم الشرطة القضائية باإلضافة إلى الوكيل العام للملك ووكيل الملك ونوابهما وقاضي\n:التحقيق، بوصفهم ضباطاً سامين للشرطة القضائية \n أوال: ضباط الشرطة القضائية؛ \n ثانياً: ضباط الشرطة القضائية المكلفين باألحداث؛ \n\n \n - \n24\n -\n ث الثاً: أعوان الشرطة القضائية؛ \n .رابعاً: الموظفون واألعوان الذين ي", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0969145420639406, "y": -0.15547088872935202}, {"id": 4442, "article": "20", "content": "المادة20\n6 \n يحمل صفة \n ضابط للشرطة \n :القضائية \n- المدير العام لألمن الوطني ووالة األمن والمراقبون \n العامون \n للشرطة\nوعمداء الشرطة \n وضباطها؛ \n- ضباط الدرك الملكي \n وذوو \n الرتب فيه وكذا الدركيون الذين يتولون قيادة \n فرقة أو مركز \nللدرك الملكي طيلة مدة هذه القيادة؛ \n- \n .الباشوات والقواد \n- \n المد", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0823112130666663, "y": -0.08041931122235203}, {"id": 4443, "article": "21", "content": "المادة21\n \nيباشر ضباط الشرطة القضائية السلطات المحددة في المادة \n18\n . \n يتلقون الشكايات \n والوشايات ويجرون األبحاث \n ،التمهيدية طبقا \n للشروط المنصوص \nعليها في الباب \n الثاني من القسم الثاني من الكتاب األول \n اآلتي \n .بعده \n يمارسون السلطات المخولة لهم بمقتضى الباب األول من القسم الثاني من الكتاب ا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07672458283382, "y": -0.03622717525575549}, {"id": 4444, "article": "22", "content": "المادة \n22\n \n7 \n \n يمارس ضباط الشرطة القضائية اختصاصاتهم في نطاق الحدود الترابية التي يزاولون\n .فيها وظائفهم \n يمكنهم في حالة االستعجال أو إذا استدعت ضرورة البحث ذلك، أن يمارسوا مهامهم في\n جميع أنحاء المملكة إذا طلبت منهم ذلك السلطة .القضائية أو العمومية \n يتعين إشعار النيابة العامة المختصة مكانيا ب", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.09311594868876101, "y": -0.0953617208033237}, {"id": 4445, "article": "1-22", "content": "المادة 1-22\n-\n8 \n يمكن إنشاء فرق وطنية أو جهوية للشرطة القضائية بمقتضى قرار مشترك لوزير العدل\n.والسلطة الحكومية المشرفة إداريا على الفرقة \n .تخضع هذه الفرق لتسيير النيابة العامة التي تشرف على البحث \n يمكن للنيابة العامة إذا اقتضت ضرورة البحث أو طبيعة الجريمة، أن تعهد بالبحث إلى\n فرقة مشتركة تتألف من", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.11141418989957771, "y": -0.14340262458925365}, {"id": 4446, "article": "23", "content": "المادة23\n \n يجب على ضباط الشرطة القضائية أن يحرروا محاضر بما أنجزوه من عمليا\nت وأن \nيخبروا وكيل الملك أو الوكيل العام للملك المختص فورا بما يصل إلى علمهم من جنايات \n .وجنح  \n \n7\n - \n تم تغيير وتتميم المادة22\n \n أعاله بمقتضى المادة الثانية من القانون رقم35.11\n.، سالف الذكر \n8\n - \n تمت إضافة المادة 1-", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07889429465523438, "y": -0.02535812972195438}, {"id": 4447, "article": "24", "content": "المادة24\n \n المحضر في مفهوم المادة السابقة هو الوثيقة المكتوبة التي يحررها ضابط الشرطة\n القضائية أثناء ممارسة مهامه\nويضمنها ما \n عاينه أو ما تلقاه من تصريحات أو ما قام به من\n.عمليات ترجع الختصاصه \n دون اإلخالل بالبيانات المشار إليها في مواد أخرى من هذا القانون أو في نصوص خ اصة\n أخرى، يتضمن المحضر خا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.057045155725741085, "y": 0.03411277265325422}, {"id": 4448, "article": "25", "content": "المادة25\n \nأعوان الشرطة القضائية \n:هم \n أوال: موظفو المصالح العاملة \n للشرطة؛ \n ثانيا: الدركيون الذين ليست لهم صفة ط ضاب الشرطة \n القضائية؛ \n\n \n - \n27\n -\n .ثالثاً: خلفاء الباشوات وخلفاء القواد", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.019109185076547772, "y": -0.12687697432144768}, {"id": 4449, "article": "26", "content": "المادة26\n \n تناط \n بأعوان الشرطة القضائية المهام \n :التالية \n:أوال مساعدة ضباط الشرطة القضائية \n في مباشرة \n مهامهم؛ \n:ثانيا إخبار \n رؤسائهم المباشرين بجميع \n الجرائم التي تبلغ إلى \n علمهم؛ \n:ثالثا \n جمع كل \n المعلومات \n المؤدية إلى \n ،العثور على مرتكبيها وفقا \n ألوامر رؤسائهم ونظام \nالهيئة \n التي ي", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07638371899490252, "y": -0.08151147840400451}, {"id": 4450, "article": "27", "content": "المادة27\n \n يمارس \n موظفو \n وأعوان اإلدارات والمرافق العمومية \n الذين \n تسند \n إليهم بعض مهام \nالشرطة القضائية بموجب \n نصوص \n ،خاصة \n هذه المهام حسب الشروط وضمن الحدود المبينة \nفي هذه \n .النصوص", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0441443370827572, "y": -0.061120275421742795}, {"id": 4451, "article": "28", "content": "المادة28\n \n يجوز للوالي أو العامل، في حالة االستعجال، عند ارتكاب جرائم تمس أمن الدولة الداخلي\nأو الخارجي، أن يقوم شخصياً باإلجراءات الضرورية للتثبت من ارتكاب الجرائم المبينة أ عاله\n أو أن يأمر كتابة ضباط الشرطة القضائية المختصين بالقيام بذلك، ما لم يخبر بإحالة القضية\n .إلى السلطة القضائية \n يجب على ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.042541593812971804, "y": -0.043859993263593744}, {"id": 4452, "article": "29", "content": "المادة29\n \nتراقب الغرفة الجنحية بمحكمة االستئناف \n أعمال ضباط \n الشرطة القضائية عندما تكون\n.صادرة عنهم بهذه الصفة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.05075988562713581, "y": -0.10883024788294547}, {"id": 4453, "article": "30", "content": "المادة30\n \n يحيل الوكيل العام للملك لدى \n محكمة االستئناف \n إلى الغرفة الجنحية بمحكمة االستئناف\nكل \n إخالل ينسب لضابط من ضباط الشرطة القضائية أثناء قيامه \n .بمهامه", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.015188534538915638, "y": -0.12553906678703994}, {"id": 4454, "article": "31", "content": "المادة31\n \nتأمر الغرفة الجنحية بمحكمة االستئناف، بعد إحالة القضية إليها \n وتقديم الوكيل العام \nللملك لملتمساته الكتابية، بإجراء بحث وتستمع ألقوال ضابط الشرطة القضائية \n المنسوب إليه \n .اإلخالل \n يجب أن يستدعى هذا األخير لالطالع \n على ملفه المفتوح له \n بالنيابة العامة \n لمحكمة \nاالستئناف بصفته ضابطا ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.03673477580275532, "y": -0.10297215273193094}, {"id": 4455, "article": "32", "content": "المادة32\n \n يمكن للغرفة الجنحية لدى محكمة االستئناف، بصرف النظر عن العقوبات التأديبية التي\n قد يتخذها في حقه رؤساؤه اإلداريون، أن تصدر في حق ضابط الشرطة القضائية إحدى\n :العقوبات التالية \n- \n توجيه مالحظات؛ \n- \n التوقيف المؤقت عن ممارسة مهام الشرطة القضائية لمدة ال تتجاوز سنة واحدة؛ \n- \n .التجريد الن", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.04083276001283048, "y": -0.06965237339097126}, {"id": 4456, "article": "33", "content": "المادة33\n \nإذا ارتأت الغرفة الجنحية أن ضابط الشرطة القضائية ارتكب \n ،جريمة أمرت عالوة \nعلى ما ذكر بإرسال الملف إلى الوكيل العام \n.للملك", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.06402688408049727, "y": -0.1066391061991095}, {"id": 4457, "article": "34", "content": "المادة34\n \nتبلغ المقررات المتخذة ضد ضباط الشرطة القضائية بناء على المقتضيات \n،السابقة إلى \nعلم السلطات التي ينتمون إليها بمبادرة من الوكيل العام \n.للملك \n\n \n - \n29\n -", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.05716751947412434, "y": -0.10951664465496146}, {"id": 4458, "article": "35", "content": "المادة35\n \n تطبق مقتضيات هذا الفرع على جميع الموظفين وأعوان اإلدارات والمرافق \n،العمومية \nالذين \n تخولهم \n نصوص خاصة \n بعض مهام الشرطة \n ،القضائية عندما يمارسون هذه \n،المهام \nحسب \n الشروط وضمن \n الحدود المبينة \n في هذه \n .النصوص \n الباب الثالث: النيابة العامة \n الفرع األول: أحكام عامة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.013168497298368447, "y": -0.07225932022078492}, {"id": 4459, "article": "36", "content": "المادة36\n \nتتولى \n النيابة \n العامة إقامة\nوممارسة \n الدعوى العمومية \n ومراقبتها وتطالب بتطبيق \n،القانون \nولها أثناء ممارسة مهامها الحق في تسخير القوة \n العمومية \n.مباشرة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.010432744414539587, "y": -0.0983555109011624}, {"id": 4460, "article": "37", "content": "المادة37\n \nتمثل النيابة العامة لدى كل محكمة زجرية وتحضر مناقشات هيئات \n .الحكم ويجب النطق \n بجميع المقررات \n.بحضورها  \n تقوم \n النيابة العامة \n بإشعار \n الوكيل \n القضائي للمملكة بالمتابعات المقامة في حق القضاة أو \nالموظفين أو األعوان التابعين للسلطة أو القوة العمومية \n .وتشعر كذلك اإلدارة التي ينتمو", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0745096647896428, "y": -0.1283316919758823}, {"id": 4461, "article": "38", "content": "المادة38\n \n يجب \n على \n النيابة العامة أن تقدم ملتمسات \n ،كتابية طبقا للتعليمات \n التي \n،تتلقاها ضمن \nالشروط المنصوص عليها في", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.06388896338281008, "y": -0.03387114955937989}, {"id": 4462, "article": "51", "content": "المادة51\n. وهي حرة في تقديم المالحظات الشفهية التي ترى \nأنها ضرورية لفائدة \n.العدالة \n الفرع الثاني: وكيل الملك", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.05881521759652747, "y": -0.027116867668535907}, {"id": 4463, "article": "39", "content": "المادة39\n \nيمثل وكيل الملك شخصياً أو بواسطة نوابه النيابة العامة، في \n دائرة \n نفوذ المحكمة\n االبتدائية المعين بها، ويمارس الدعوى العمومية تحت مراقبة الوكيل العام للملك إما تلقائياً أو \nبناء \n على شكاية أي شخص \n .متضرر \n يمارس وكيل الملك سلطته على نوابه، وله أثناء مزاولة مهامه الحق في تسخير القوة\n.ا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07144289233004696, "y": -0.08111698014878549}, {"id": 4464, "article": "40", "content": "المادة40\n9 \nيتلقى وكيل الملك المحاضر والشكايات والوشايات ويتخذ بشأنها ما يراه \n .ًمالئما \n \n يباشر بنفسه أو يأمر بمباشرة اإلجراءات الضرورية للبحث عن مرتكبي المخالفات\n .للقانون الجنائي ويصدر األمر بضبطهم وتقديمهم ومتابعتهم \n يحق لوكيل الملك، لضرورة تطبيق مسطرة تسليم المجرمين، إصدار أوامر دولية بالبحث", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.05125100762251705, "y": 0.010171254006636765}, {"id": 4465, "article": "41", "content": "المادة41\n \n يمكن للمتضرر أو المشتكى به قبل إقامة الدعوى العمومية وكلما تعلق األمر بجريمة\n يعاقب عليها بسنتين حبساً أو أقل أو بغرامة ال يتجاوز حدها األقصى5.000\n \n ،درهم أن يطلب\n .من وكيل الملك تضمين الصلح الحاصل بينهما في محضر \n ًفي حالة موافقة وكيل الملك وتراضي الطرفين على الصلح، يحرر وكيل الملك محض", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.039921717036106, "y": 0.015805454850558773}, {"id": 4466, "article": "42", "content": "المادة42\n \n يجب على \n كل سلطة منتصبة وعلى كل \n موظف بلغ إلى علمه أثناء ممارسته لمهامه \nارتكاب \n،جريمة \n أن \n يخبر بذلك فوراً وكيل الملك أو الوكيل العام للملك وأن يوجه إليه جميع \nما \n يتعلق \n بالجريمة \n من معلومات ومحاضر \n .ووثائق", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.019859980858256184, "y": -0.06367901852729085}, {"id": 4467, "article": "43", "content": "المادة43\n \n يجب أيضا \n على كل \n من شاهد \n ارتكاب \n جريمة تمس باألمن العام \n أو بحياة شخص أو \nأمواله أن يبلغ وكيل الملك \n .أو الوكيل العام للملك أو الشرطة القضائية \n .إذا كان الضحية قاصراً أو معاقاً ذهنياً، تبلغ أي سلطة قضائية أو إدارية مختصة", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.00514391553517765, "y": -0.07141503661183893}, {"id": 4468, "article": "44", "content": "المادة44\n \nيرجع االختصاص المحلي إما لوكيل الملك في مكان ارتكاب \n،الجريمة وإما لوكيل الملك \nفي \n محل إقامة \n أحد األشخاص \n المشتبه في \n مشاركته في \n ،ارتكابها وإما لوكيل الملك \n في مكان \nإلقاء القبض على أحد هؤالء \n األشخاص \n ولو تم هذا القبض لسبب \n .آخر", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.04056731602290234, "y": -0.09399380168630102}, {"id": 4469, "article": "45", "content": "المادة \n45\n \n10\n \nيسير وكيل الملك \n في دائرة نفوذ محكمته أعمال ضباط الشرطة القضائية ويقوم بتنقيطهم\nفي نهاية كل سنة. \n يوجه وكيل الملك الئحة التنقيط إلى الوكيل العام للملك قصد إبداء وجهة نظره وإحالتها\n على السلطة المشرفة إداريـا على ضبـاط الشرطة القضائية. ويؤخذ هذا التنقيط بعين االعتبار\n .من أجل التق", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.09010004650561036, "y": -0.07207528787709316}, {"id": 4470, "article": "46", "content": "المادة46\n11\n  \n \n .إذا حدث لوكيل الملك مانع فيخلفه نائبه، وإذا تعدد النواب فيخلفه النائب المعين من قبله \n إذا تغيب جميع ممثلي النيابة العامة أو حدث لهم مانع، فإن الوكيل العام للملك ينتدب أحد\nنوابه أو أحد قضاة النيابة العامة بالدائرة القضائية لمحكمة االس تئناف ليقوم بجميع اختصاصات\n .ًالنيابة العامة م", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07780431875242892, "y": -0.10218184142783891}, {"id": 4471, "article": "47", "content": "المادة \n47\n \n12\n \n إذا تعلق األمر بالتلبس بجنحة طبقا للمادة56\n ، فإن وكيل الملك يقوم باستنطاق المشتبه\n فيه. ويمكنه مع مراعاة مقتضيات المادة74\n \n أن يصدر أمراً باإليداع في السجن، إذا كانت\n .الجنحة يعاقب عليها بالحبس \n يستعين وكيل الملك بترجمان أو بكل شخص يحسن التخاطب أو التفاهم مع من يقع\n .استنطاقه ع", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.044283041212176306, "y": -0.0022166796905783354}, {"id": 4472, "article": "48", "content": "المادة48\n \nيمثل النيابة العامة أمام محكمة االستئناف الوكيل العام \n للملك شخصياً بوصفه رئيساً للنيابة\n .العامة أو بواسطة نوابه \nإذا حدث للوكيل العام للملك مانع، فيخل .فه نائب الوكيل العام للملك المعين من قبله", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.054487245968796914, "y": -0.12161656726239421}, {"id": 4473, "article": "49", "content": "المادة49\n \n13\n \nيتولى الوكيل العام للملك السهر على تطبيق القانون الجنائي في مجموع دائرة نفوذ \n محكمة \n .االستئناف \nيمارس سلطته على جميع قضاة النيابة العامة التابعين لدائرة نفوذه وكذا على ضباط \nوأعوان الشرطة القضائية وعلى الموظفين القائمين بمهام الشرطة القضائية استنادا إلى المادة \n17\n \n.أعاله  \n .وله", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0555504597760894, "y": -0.027413007717239174}, {"id": 4474, "article": "50", "content": "المادة50\n \n يختص الوكيل العام للملك محلياً، طبقاً لمقتضيات المادة44\n \n .من هذا القانون", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.012405455231635165, "y": -0.07468705768225302}, {"id": 4475, "article": "51", "content": "المادة \n51\n \n يشرف وزير العدل على تنفيذ السياسة الجنائية، ويبلغها إلى الوكالء العامين للملك الذين\n .يسهرون على تطبيقها \nوله أن يبلغ إلى الوكيل العام للملك ما يصل إلى علمه من مخالفات \n للقانون الجنائي، وأن \nيأمره كتابة بمتابعة مرتكبيها \n أو يكلف من يقوم \n،بذلك \n أو أن يرفع إلى المحكمة المختصة ما \nيرا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.04107384922072947, "y": -0.10617319939362031}, {"id": 4476, "article": "52", "content": "المادة52\n  \nيعين القضاة المكلفون بالتحقيق في المحاكم االبتدائية من بين قضاة الحكم فيها لمدة ثالث \nسنوات قابلة للتجديد بقرار لوزير العدل، بناء على \n اقتراح من .رئيس المحكمة االبتدائية \n يعين القضاة المكلفون بالتحقيق في محاكم االستئناف من بين مستشاريها لمدة ثالث\n سنوات قابلة للتجديد بقرار لوزير العدل،", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.07268622803158326, "y": -0.06264109796889634}, {"id": 4477, "article": "53", "content": "المادة53\n \n  إذا لم يوجد في المحكمة سوى قاض واحد مكلف\nبالتحقيق وحال \n مانع مؤقت دون \n ممارسته \n لمهامه، فيمكن لرئيسها في حالة االستعجال، بناء على طلب من النيابة العامة، وفي\n انتظار زوال المانع أو صدور التعيين بقرار نظامي، أن يعين أحد قضاة أو مستشاري المحكمة\n .لممارسة هذه المهام", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.0558194794782344, "y": -0.09666598262801868}, {"id": 4478, "article": "54", "content": "المادة54\n \nال يمكن لقاضي التحقيق إجراء تحقيق إال بناء على ملتمس محال إليه من النيابة \n،العامة \n أو بناء على شكاية مرفقة بتنصيب المشتكي \n ًطرفا \n .ًمدنيا \nيحق له عند \n ممارسته \n ،لمهامه أن يسخر القوة \n العمومية \n.مباشرة \n\n \n - \n37\n -\n .يقوم قاضي التحقيق بتفقد المعتقلين االحتياطيين مرة كل شهر على األق", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.028498262584096865, "y": -0.10295778929787262}, {"id": 4479, "article": "55", "content": "المادة55\n \nيختص ق اضي التحقيق محلياً، طبقا لمقتضيات المادة44\n \n .من هذا القانون \n القسم الثاني: إجراءات البحث \n الباب األول: حالة التلبس بالجنايات والجنح", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.005164446514042524, "y": -0.09201130325500347}, {"id": 4480, "article": "56", "content": "المادة56\n \n تتحقق حالة \n التلبس بجناية \n أو \n :جنحة \n:ًأوال إذا ضبط الفاعل أثناء ارتكابه \n الجريمة أو على إثر \n ارتكابها؛ \nثانياً: إذا كان الفاعل ما زال مطاردا بصياح \n الجمهور على إثر ارتكابها؛ \n:ثالثا إذا \n وجد \n الفاعل بعد مرور \n وقت قصير \n على ارتكاب الفعل حامال أسلحة أو أشياء \n يستدل معها \n أنه ", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": -0.012488535708270776, "y": -0.055589308678734815}, {"id": 4481, "article": "57", "content": "المادة57\n \n15\n \n يجب على ضابط الشرطة القضائية الذي أشعر بحالة تلبس بجنحة أو جناية أن يخبر بها\n .النيابة العامة فوراً وأن ينتقل في الحال إلى مكان ارتكابها إلجراء المعاينات المفيدة \n وعليه أن يحافظ على األدلة القابلة لالندثار وعلى كل ما يمكن أن يساعد على إظهار\n الحقيقة وأن يحجز األسلحة واألدوات التي ا", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.04894005323258499, "y": -0.03449504628255367}, {"id": 4482, "article": "58", "content": "المادة58\n \nيمنع على كل شخص غير \n ًمؤهل قانونا أن يغير حالة \n،المكان الذي وقعت فيه الجريمة \n أو أن يقوم بإزالة أي شيء منه ل قب القيام بالعمليات األولية للبحث \n،القضائي وذلك تحت طائلة \nغرامة \n تتراوح \n بين1.200\n  و10.000\n \n.درهم \nغير أنه \n،يسمح بصفة \n،استثنائية \n بهذه \n التغييرات \n أو \n هذه \n اإلزاالت", "law": "code-procedure-penale-22-01.pdf", "law_idx": 2, "x": 0.005181491122719104, "y": -0.01318407006829189}, {"id": 3819, "article": "2", "content": "المادة2\n \nيحدد هذا القانون العالقات بين المستهلك و.المورد \n\n \n - 5 -  \n يقصد بالمستهلك كل شخص طبيعي أو معنوي يقتني أو يستعمل لتلبية حاجياته غير\n المهنية منتوجات أو سلعا أو خدمات معدة الستعماله الشخصي أو\nالعائلي\n؛ \n.يقصد بالمورد كل شخص طبيعي أو معنوي يتصرف في إطار نشاط مهني أو تجاري \nويتقيد األشخاص ا", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.0009418831892875102, "y": 0.16598159562502032}, {"id": 3820, "article": "3", "content": "المادة3\n \n يجب على كل مورد أن يمكن المستهلك بأي وسيلة مالئمة من معرفة المميزات\nاألساسية للمنتوج أو السلعة أو الخدمة و\nكذا مصدر المنتوج أو السلعة و تاريخ الصالحية إن\nاقتضى الحال ،وأن يقدم إليه المعلومات التي من شأنها مساعدته على القيا م باختيار معقول\n.باعتبار حاجياته وإمكانياته \nولهذه الغاية ،\n يجب ع", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.01836550446999577, "y": 0.15429188358438942}, {"id": 3821, "article": "4", "content": "المادة4\n \n يجب على المورد كذلك أن يسلم فاتورة أو مخالصة أو تذكرة صندوق أو أي وثيقة\nأخرى تقوم مقامها إلى كل مستهلك قام بعملية ش راء وذلك وفقا للمقتضيات الجبائية الجاري\nبها العمل. \nتحدد بنص تنظيمي3 البيانات التي يجب أن تتضمنها الفاتورات \n والمخالصات والتذاكر\n والوثائق المشار إليها أعاله. \n            ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.060113456310011734, "y": 0.18250349947652264}, {"id": 3822, "article": "5", "content": "المادة5\n \n يجب أن يشمل البيان المتعلق بالسعر أو التعريفة التي يكون اإلعالم بهما إجباريا تطبيقا\nللمادة 3\n الثمن أو \n التعريفة اإلجمالية التي يتعين على المستهلك دفعها بما في ذلك الضريبة\n على القيمة المضافة وجميع الرسوم األخرى وكذا التكلفة اإلضافية لجميع الخدمات التي يلزم\n المستهلك.بأدائها", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.027725354225908435, "y": 0.08969569124974285}, {"id": 3823, "article": "6", "content": "المادة6\n \nيجب أن يصاحب كل منتوج أو سلعة معروضة للبيع لصيقة يحدد مضمونها وش كلها\nبنص تنظيمي4.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.03382273485970249, "y": 0.05661528170413642}, {"id": 3824, "article": "7", "content": "المادة7\n \nفيما يخص عقود االشتراك محددة المدة ،\n يجب على المورد أن يذكر المستهلك كتابة\n بأي وسيلة تثبت:التوصل \n1. \n في حالة عدم التجديد الضمني،للعقد \n بانتهاء العقد شهرا على األقل قبل األجل\n المحدد النقضاء\nمدته؛ \n2. \n أو في حالة التجديد الضمني،للعقد \n باألجل الذي يجوز للمستهلك خالله أن يمارس\n حقه في ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.017309781081652518, "y": 0.18058205503891087}, {"id": 3825, "article": "8", "content": "المادة8\n \n يتعين على\nالمورد ،ا إذ \n كان من الواجب إبرام عقد بصفة كلية أو جزئية\nكتابة ،\n أن\nيحرره في العدد الالزم من النظائر وأن يسلم إحداها على األقل إلى المستهلك.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.040584278988837784, "y": 0.07456407788110936}, {"id": 3826, "article": "9", "content": "المادة9\n \nفيما يتعلق بالعقود التي يحرر جميع أو بعض شروطها المقترحة على المستهلك كتابة ،\nيجب تقديم هذه الشروط وتحريرها بصورة واضحة و\nمفهومة. و في حالة الشك حول مدلول\nأحد الشروط ،يرجح التأويل األكثر فائدة بالنسبة إ\nلى المستهلك. \n                                                                         ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.04468867040090053, "y": 0.20465412594220578}, {"id": 3827, "article": "10", "content": "المادة10\n \nيلتزم المورد بإخبار المستهلك بالمدة التي تكون خاللها قطع الغيار والقطع الال زمة\nالستخدام المنتوجات أو السلع متوفرة في السوق و\nذلك قبل إبرام العقد.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.06368870801725651, "y": 0.12595762341817401}, {"id": 3828, "article": "11", "content": "المادة11\n \n يجب على المورد أن يسلم لكل شخص ذي مصلحة يقدم طلبا بذلك نظيرا من االتفاقات\n.التي يقترحها بصفة اعتيادية \nالباب الثاني: اإلعالم بآجال التسليم", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.047943758647987715, "y": 0.038990114651394604}, {"id": 3829, "article": "12", "content": "المادة12\n \n في كل عقد يكون موضوعه بيع\nمنتوجات أو سلع أو تقديم خدمات إلى المستهلك ،\n إذا\nتجاوز الثمن أو التعريفة المتفق عليها الحد المقرر بنص تنظيمي5 و كان تسليم المنتوجات أو\nالسلع أو تقديم الخدمات غير فوري ،\n يجب على المورد أن يحدد كتابة في العقد أو الفاتورة أو\nتذكرة الصندوق أو المخالصة أو أي وثيقة ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.011802378547210265, "y": 0.1834332244756102}, {"id": 3830, "article": "13", "content": "المادة13\n \n إذا تم تجاوز األجل المنصوص عليه في المادة12\n \n بسبعة أيام ولم يعز التأخير إلى قوة\nقاهرة ،جاز للمستهلك ،دون اللجوء إلى القضاء ،\n أن يفسخ االلتزام الذي يربطه بالمورد فيما\nيتعلق بالسلعة غير المسلمة أو الخدمة غير المقدمة بأي\nة وسيلة تثبت التوصل ،\n وذلك بالرغم\nمن جميع األحكام التعاقدية المخال", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.01443411598339454, "y": 0.2028678957044664}, {"id": 3831, "article": "14", "content": "المادة14\n \n في حالة فسخ االلتزام وفقا للشروط المنصوص عليها في المادة13\n ،\n يجب على المورد\n أن يرد المبالغ المسبقة من لدن المستهلك داخل أجل ال يتجاوز سبعة أيام ابتداء من تاريخ\n                                                             \n5 - أنظر", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.043869397004639724, "y": 0.12088787914762882}, {"id": 3832, "article": "28", "content": "المادة28\n من المرسوم رقم \n2.12.503\n، سالف الذكر. \n\n \n - 8 -  \nتسلم اإلشعار المذكور. وتستحق بقوة القان ون فائدة بالسعر القانوني الجاري بها العمل على\nالمبلغ المذكور ابتداء من اليوم الثامن لصالح المستهلك، و ذلك دون المساس بحق هذا األخير\nفي المطالبة بال.تعويض عن الضرر الذي لحق به \nالقسم الثالث: حماية ال", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.023586718078407485, "y": 0.15255293807517342}, {"id": 3833, "article": "15", "content": "المادة15\n \nيعتبر شرطا تعسفيا في ال عقود المبرمة بين المورد والمستهلك كل شرط يكون الغرض\n.منه أو يترتب عليه اختالل كبير بين حقوق وواجبات طرفي العقد على حساب المستهلك \n دون المساس بمقتضيات الفصول39\n \n إلى56\n \n من الظهير الشريف الصادر في9 \n رمضان1331\n (\n12\n \n أغسطس1913) بمثابة قانون االلتزامات و\nالعقود ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.01675115150330208, "y": 0.14852933461230972}, {"id": 3834, "article": "16", "content": "المادة16\n \n دون اإلخالل بقواعد التأويل المنصوص عليها في الفصول من461\n \n إلى473\n \n من\n الظهير الشريف الصادر في9\n \n رمضان1331\n (\n12\n أغسطس1913\n ) بمثابة قانون\nااللتزامات والعقود ،\n يقدر الطابع التعسفي لشرط من الشروط بالرجوع وقت إبرام العقد إلى\nجميع الظروف المحيطة ب\nإبرامه وإلى جميع الشروط األخرى الوار", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.014666916079631049, "y": 0.08769748702641507}, {"id": 3835, "article": "17", "content": "المادة17\n \nال يشمل تقدير الطابع التعسفي لشرط من الشروط ،\n حسب مدلول المادة16\n ،\n تحديد\n المحل األساسي من العقد وال مالءمة السعر للسلعة المبيعة أو األجرة للخدمة المقدمة ما\nدامت الش\nروط محررة بصورة واضحة ومفهومة.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.03406155840731257, "y": 0.13216911024938835}, {"id": 3836, "article": "18", "content": "المادة18\n \nمع مراعاة تطبيق النصوص التشريعية الخاصة أو تقدير المحاكم أو هما معا ،\n وعلى\nسبيل المثال ال الحصر ،\n تعتبر الشروط تعسفية إذا كانت تتوفر فيها شروط المادة15\n ،\n ويكون\nالغ رض منها أو يترتب عليها ما:يلي \n1. \n إلغاء أو انتقاص حق المستهلك في االستفادة من التعويض في حالة إخالل المورد\n بأحد\nالتزام", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.009899863146610097, "y": 0.1893776197561954}, {"id": 3837, "article": "19", "content": "المادة19\n \nيعتبر باطال و.الغيا الشرط التعسفي الوارد في العقد المبرم بين المورد والمستهلك \nتطبق باقي مقتضيات العقد األخرى إذا أمكن أن يبقى العقد قا ئما بدون الشرط التعسفي\n.المذكور", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.08959225487222851, "y": 0.0861744026803138}, {"id": 3838, "article": "20", "content": "المادة20\n \nتعتبر أ.حكام هذا القسم من النظام العام \n \n \n \n \n \n \n\n \n - 11 -  \nالقسم الرابع: الممارسات التجارية \n الباب األول: اإلشهار", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.040615643310104116, "y": -0.012011138647307679}, {"id": 3839, "article": "21", "content": "المادة21\n \n دون المساس بمقتضيات المادتين2\n \n و67\n \n من القانون رقم77.03\n \n المتعلق باالتصال\nالسمعي البصري6\n ،يمنع كل إشهار يتضمن ،بأي شكل من األ
