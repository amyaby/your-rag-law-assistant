صله ، بعد قضائه ستة أشهر من الشغل داخل نفس المقاولة ، بصرف النظر عن الطريقة التي يتقاضى بها أجره ، وعن دورية أدائه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.06869404946188369, "y": 0.05995626310585471}, {"id": 5327, "article": "53", "content": "المادة 53 :\nيعادل مبلغ التعويض عن الفصل ، عن كل سنة ، أو جزء من السنة من الشغل الفعلي ، ما يلي :\n- 96 ساعة من الأجرة ، في ما يخص الخمس سنوات الأولى من الأقدمية ؛\n- 144 ساعة من الأجرة ، في ما يخص فترة الأقدمية المتراوحة بين السنة السادسة والعاشرة ؛\n- 192 ساعة من الأجرة ، في ما يخص مدة الأقدمية المترا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.0072902055146501265, "y": 0.09593433213091207}, {"id": 5328, "article": "54", "content": "المادة 54 :\nتدخل ضمن مدد الشغل الفعلي ، ما يلي :\n1 - فترات العطلة السنوية المؤدى عنها ؛\n2 - فترات استراحة النوافس المنصوص عليها في المادتين 153 و154 أدناه ، وفترة توقف عقد الشغل المنصوص عليها في المادة 156 أدناه ؛\n3 - مدة عجز الأجير عن الشغل عجزا مؤقتا ، بسبب حادثة شغل ، أو مرض مهني ؛\n4 - مدة توقف ع", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.006173048727168315, "y": 0.04915258524127608}, {"id": 5329, "article": "55", "content": "المادة 55 :\nيقدر التعويض عن الفصل على أساس معدل الأجور المتقاضاة خلال الأسابيع الاثنين والخمسين السابقة لتاريخ الإنهاء.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.03911650137930192, "y": -0.00030149994322181434}, {"id": 5330, "article": "56", "content": "المادة 56 :\nلا يمكن أن يكون الأجر المعتمد لتقدير التعويض عن الفصل دون الحد الأدنى القانوني للأجر المنصوص عليه في المادة 356 أدناه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.05648470708823843, "y": 0.043383606913776955}, {"id": 5331, "article": "57", "content": "المادة 57 :\nيعتمد في تقدير التعويض عن الفصل من الشغل الأجر بمعناه الأساسي ، مع توابعه المبينة أدناه :\n1 - المكافآت ، والتعويضات المرتبطة بالشغل باستثناء ما يلي :\nأ) المبالغ المستردة تغطية لمصاريف أو لنفقات سبق أن تحملها الأجير بسبب شغله ؛\nب) التعويض المؤدى عن تحمل مسؤولية ، باستثناء التعويضات عن الم", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.027357984672702368, "y": 0.0959975532733927}, {"id": 5332, "article": "58", "content": "المادة 58 :\nيرفع بنسبة 100% التعويض المستحق لمندوب الأجراء والممثل النقابي بالمقاولة عند وجوده ، الذين يفصلون من شغلهم خلال مدة انتدابهم ، وفق المقتضيات المنصوص عليها في المادة 53 أعلاه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.014630039151946881, "y": 0.018297490437745076}, {"id": 5333, "article": "59", "content": "المادة 59 :\nيستفيد الأجير عند فصله تعسفيا من التعويض عن الضرر والتعويض عن أجل الإخطار المنصوص عليهما على التوالي في المادتين 41 و51 أعلاه.\nكما يستفيد من التعويض عن فقدان الشغل.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.035169336510376806, "y": 0.04813368964890988}, {"id": 5334, "article": "60", "content": "المادة 60 :\nلا حق للأجير في التعويضات الواردة في المادة 59 أعلاه إذا وجب له راتب الشيخوخة عند بلوغه سن التقاعد طبقا للمادة 526 أدناه ، إلا إذا نص عقد الشغل أو اتفاقية الشغل الجماعية ، أو النظام الداخلي على مقتضيات أكثر فائدة للأجير.\nالفرع الخامس\nالفصل التأديبي", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.025736124160482585, "y": 0.06470060414666214}, {"id": 1, "article": "2", "content": "المادة 2  \n يقصد بما يلي في مدلول هذا\nالقا:نون \n1. \n:الصحافة \n\n \n- 4 - \n مهنة جمع األخبار أو المعلومات أو الوقائع أو التحري أو االستقصاء عنها بطريقة\n مهنية قصد كتابة أو إنجاز مادة إعالمية مكتوبة أو مسموعة أو سمعية بصرية أو مصورة أو\n.مرسومة أو بأية وسيلة أخرى كيفما كانت الدعامة المستعملة لنشرها أو بث", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07913363027975356, "y": 0.09301712266414691}, {"id": 2, "article": "3", "content": "المادة3\n \n حرية الصحافة مضمونة طبقا ألحكام الفصل28\n \n من الدستور وال يمكن تقييدها بأي\n.شكل من أشكال الرقابة القبلية \n حرية الفكر والرأي والتعبير مكفولة للجميع طبقا للفصل25\n من \n.الدستور \n تمارس هذه الحقوق والحريات طبقا للدستور وفق الشروط والشكليات الواردة في هذا\nـ ان ـقـ ال ون ووفقا للقانون رقم89.13", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.0521455756242412, "y": -0.026857377966410818}, {"id": 3, "article": "4", "content": "المادة 4\n \n يشكل هذا القانون إلى جانب القانون رقم89.13\n \n المتعلق بالنظام األساسي للصحافيين\n المهنيين والقانون رقم90.13\n المتعلق بالمجلس الوط\nن ي.للصحافة مدونة الصحافة والنشر", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.04229340821368154, "y": -0.010609480725670683}, {"id": 4, "article": "5", "content": "المادة5\n \n سرية مصادر الخبر مضمونة وال يمكن الكشف عنها إال بمقرر قضائي وفي الحاالت\n:التالية \n\n \n القضايا المتعلقة بالدفاع\nالوطني وأمن الدولة الداخلي والخ\nي؛ جرا \n\n \n.الحياة الخاصة لألفراد ما لم تكن لها عالقة مباشرة بالحياة العامة \nلا مادة6\n \n يحق للصحافيات وللصحافيين ولهيئات\nومؤسسات الصحافة \n الول", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09194041381513954, "y": 0.0038064524462608487}, {"id": 5, "article": "7", "content": "المادة 7\n \nتلتزم الدولة بضمان حرية الصحافة وترسيخ الديمقراطي ة وتعددية اإلعالم وتعمل على\n.االلتزام بها \n تستفيد قطاعات الصحافة والنشر والطباعة والتوزيع من الدعم العمومي بناء على\n مبادئ الشفافية وتكافؤ الفرص والحياد، بهدف تنمية القراءة وتعزيز التعددية ودعم مواردها\n.البشرية \n تحدد شروط وكيفيات االستفا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.06309100063230658, "y": 0.017099289525637655}, {"id": 6, "article": "8", "content": "المادة8\n \nيعتبر مؤسسة صحفية، في مدلول هذا القانون، كل شخص ذاتي أو اعتباري يمار س\n كل أو بعض األنشطة الواردة في المادة2\n \n أعاله ويتولى لهذه الغاية نشر مطبوع دوري أو\n.صحيفة إلكترونية بوصفه مالكا أو مستأجرا أو مسيرا، ألحدهما أو هما معا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.08332313189537041, "y": 0.0236116347813382}, {"id": 7, "article": "9", "content": "المادة9\n \n باستثناء المؤسسات الصحفية األجنبية الخاضعة للباب الخامس من هذا القانون، يجب\nعلى المؤسسات الصحفي:ة، سواء كانت شخصا ذاتيا أو اعتباريا أن يكون \n\n مقرها الرئي\nس\nي بالمغرب؛ \n\n ثلثا مالكيها على األقل أو الشركاء فيها أو \n المساهمين فيها أومن لهم حقوق\nـ وي ـصـتـ ال\nـ ت ف ي الجموع وأجهزة إدارة ا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.08959448255263283, "y": -0.011257476375082367}, {"id": 8, "article": "10", "content": "المادة10\n \n عندما\nتتخذ المؤسسة الناشرة شكل شركة مساهمة، \n ما عدا الحالة الي تكون فيها\n.المؤسسة مسعرة في بورصة القيم، يجب أن تكون األسهم إسمية \nكل نقل لهذه األسهم يجب أن يصادق عليه مجل\nس \n.إدارة الشركة أو مجلس رقابتها", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07679865926940661, "y": 0.013983846399785617}, {"id": 9, "article": "11", "content": "المادة11\n \n يجب على كل شخص ذاتي أو اعتباري يملك أكثر من30\n المائ ة في رأس مال أو\n حقوق تصويت داخل أجهزة إدارة أو تسيير مؤسسة صحفية أو المؤسسة المالكة لها أو هما\n معا أن يصرح بذلك إلى المجلس\nالوطني \n.للصحافة \n\n \n \n-9 - \n يجب على كل مؤسسة صحفية تملك\nأ كثر من10\n \n في المائة من رأس مال أو حقوق\n تصويت دا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.13553938287628367, "y": 0.009887618966768335}, {"id": 10, "article": "12", "content": "المادة12\n \nـنـمـي ع على كل شخص تحت طائلة غرامة يصل حدها األقصى50\n \n مرة مبلغ االكتتاب\nأو االقتناء أو القرض الخفي، على أن \n ال يقل المبلغ األدنى للغرامة عن5.000\n \n درهم، القيام\nبإعا\nرة اال سم ألية مؤسسة ناشرة من خالل التظاهر باكتتاب أسهم أو حصص أو اقتناء أصل\n.تجاري أو مند أو استئجاره لتسييره \n.يتعرض ", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.006071985387003632, "y": 0.04450657439673225}, {"id": 11, "article": "13", "content": "المادة13\n \nـنـمـي ع على كل مؤسسة صحفية أن تتلقى لفائدتها بصفة مباشرة أو غير مباشرة أمواال\n أو منافع من حكومة أو جهة أجنبية، باستثناء دعم القدرات التدبيرية والجوائز الخاصة\n بالصحف والصحفيين والخدمات المتعلقة ببيع أو اشتراك أو إشهار أو تكوين أو تطوير\n.للقدرات البشرية \nـ اق ـعـي\nـ ة م ـ رام ـغـ ب ب ن60", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.06054361425778278, "y": 0.04529766096784605}, {"id": 12, "article": "14", "content": "المادة14\n \nتنشر القوائم التركيبية المحاسبية للمؤ\nس سة الصحفية في منشوراتها قبل فاتح يوليو\n الموالي للسنة المحاسبية المعنية، مع نشر كمية\nالسحب. \n الباب\nا\nلثاني :\n في\nإدارة النشر", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.04498647170479512, "y": 0.015121109918660232}, {"id": 13, "article": "15", "content": "المادة \n15\n \n يجب أن يكون لكل مطبوع دوري أو صحيفة إلكترونية أو أية دعامة إلكترونية أخرى\n طبقا لما ورد في المادة2 \n.أعاله، مدير للنشر", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.04736677310709839, "y": -0.004474015684303956}, {"id": 14, "article": "16", "content": "المادة16\n \n يجب أن تتوفر في مدير النشر\nا:لشروط التالية \n1. أن يكون راشدا ومن جنسية مغربية ومقيما بالمغرب؛ \n2. أن يكون حاصال عل ى شهادة من مستوى اإلجازة على األقل أو شهادة\n متخصصة في مجال الصحافة مسلمة من طرف مؤسسات التعليم العالي العام\nأو الخاص أو دبلوم معترف بمعادلته لها؛ \n3. أن يتمتع بحقوقه المدني", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.11376637495222022, "y": 0.03037862136502214}, {"id": 15, "article": "17", "content": "المادة17\n \nه يس ر مدير النشر على ضمان تقيد الصحافيات والصحافيين العاملين بالمؤسسة\n باألحكام التشريعية والتنظيمية المتعلقة بممارسة.مهنة الصحافة \n ويتحقق كذلك، قبل النشر، من األخبار أو التعاليق أو الصور أو كل شكل يحمل أو\n.يدعم محتوى إعالميا، ومن هوية محرري المقاالت الموقعة بأسماء مستعارة قبل نشرها \nيت", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.142095487717065, "y": 0.021978993795783393}, {"id": 16, "article": "18", "content": "المادة18\n \nتتنافى \n مهمة مدير النشر مع العضوية في الحكومة، وتعين المؤسسة الصحفية مديرا\nجديدا للنشر في حالة إذا ما تم \n تعيين مدير النشر عضوا في الحكومة، مع مراعاة أحكام", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09836735227554158, "y": -0.05651099737583175}, {"id": 17, "article": "34", "content": "المادة34\n من القانون التنظي\nم ي رقم065.13\n المتعلق بتنظيم وت\nس يير أشغال الحكومة\nوالو ضع القانوني\nألعضائها \n الصادر بتنفيذه الظهير الشريف رقم1.15.33\n \n بتاريخ28\n \n من\n جمادى األولى1436\n (\n19\n \n مارس2015\n.)\n \n\n \n- 12 - \nالماد ة19\n \nيجب ع\nلى مدير النشر الجديد أن ي\nس توفي الشروط الالزمة لمزاولة مهام مد", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.08784817124118162, "y": 0.055333030151584965}, {"id": 18, "article": "20", "content": "المادة20\n \nإذا لم يعد مدير النشر الجديد م\nس\nتوفيا للشرو ط المتطلبة في هذا القانون، يتعين على\n مدير المطبوع الدوري أو الصحيفة اإللكترونية، تسوية الوضعية داخل أجل أقصاه شهر\n.واحد \n يترتب على عدم تعيين مدير النشر الجديد داخل األجل المنصوص عليه في الفقرة\nاألولى أعاله، إيقاف المطبوع الدوري أو حجب موقع ال", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.1417032102364432, "y": 0.0014332740698634171}, {"id": 19, "article": "21", "content": "المادة21\n \n يجب التصريح بنشر أي مطبوع دوري أو صحيفة إلكترونية داخل أجل ثالثين يوما\n السابقة لليوم الذي يتوقع فيه إصداره. ويودع هذا التصريح في ثالثة نظائر لدى وكيل الملك\n بالمحكمة االبتدائية الذي يوجد فيه المقر الرئيسي للمؤسسة الصحفية ويتضمن البيانات\nل التا:ية \n\n \n اسم المطبوع الدوري وطريقة نشره وتو", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.15318693361147237, "y": 0.10557641868073835}, {"id": 20, "article": "22", "content": "المادة22\n \n يوقع مدير النشر على التصريح الوارد في المادة21\n \n أعاله، ويودعه لدى وكيل الملك\n لدى المحكمة االبتدائية الي يوجد بدائرة نفوذها المقر الرئيسي للمطبوع الدوري أو الصحيفة\n.اإللكترونية \n يسلم وكيل الملك المختص فورا شهادة اإليداع تتضمن البيانات الواردة في المادة21\n \nأعال\nه مختومة ومؤرخة ويرسل ن", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.1553246441985307, "y": -0.03847154630822377}, {"id": 21, "article": "23", "content": "المادة23\n \n يمكن إصدار المطبوع الدوري أو الصحيفة اإللكترونية بعد أجل شهر من تاريخ تسلم\nشهادة اإليداع إن لم يتلق مدير النشر اعتراضا كتابيا ومعلال من طرف وكيل الملك المخت.ص \nيحق للمع\nن ي باألمر، في حالة االعتراض داخل أجل أقصاه شهرا أن يرفع دعوى أمام\n المحكمة اإلدارية المختصة من أجل البت في مبررات الرف", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09777787034278826, "y": 0.058894923478341334}, {"id": 22, "article": "24", "content": "المادة \n24\n \n يعاقب بغرامة من2.000\n \n إلى10.000\n \n درهم مالك المطبوع الدوري أو الصحيفة\nاإللكترونية أو المستأجر المسير \n ،لهما، وعند عدم وجودهما مدير النشر، وعند عدمه الطابع\nوعند عدمه موزع ا\nل مطبوع الدوري أو المضيف بالنسبة للصحيفة اإللكترونية، اللذان لم\n يكونا موضوع تصريح طبقا لمقتضيات المادتين21\n و", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07723540201088377, "y": 0.0726752681218679}, {"id": 23, "article": "25", "content": "المادة25\n \n يجب أن يرد في كل نسخة من نسخ المطبوع الدوري أو في صفحة االستقبال الرئيسية\nلكل صحيفة إلكترونية متاحة لولوج العموم ما \n:يلي \n\n اسم مدير النشر؛ \n\n أسماء وصفات األشخاص الذين يتولون اإلدارة؛ \n\n \n عنوان المطبوع وكذا اسم وعنوان المطبعة والموزع في حالة وجوده، بالنسبة\nللمطبوع الدوري\n؛ \n\n \n عن", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.1407269218146935, "y": 0.047541353106092116}, {"id": 24, "article": "26", "content": "المادة26\n \n تسلم عند نشر كل عدد من المطبوع الدوري نسخة منه، للسلطة الحكومية المكلفة\n باالتصال ونسخة للنيابة العامة لدى المحكمة االبتدائية الي يوجد في دائرة نفوذها الترابي\n.المقر االجتماعي للمؤسسة الصحفية ونسخة للمجلس الوطني للصحافة \n.كما يمكن إيداع النسخ عن طريق البريد المضمون", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.11615598405776466, "y": -0.04394186810941452}, {"id": 25, "article": "27", "content": "المادة27\n \n يعاقب مدير نشر المطبوع الدوري بغرامة من2.000\n \n إلى4.000\n درهم عن \n كل عدد\nيصدر مخالفا لم\nق تضيات المادة25\n \n.أعاله \n يعاقب مدير نشر الصحيفة اإللكترونية بنفس الغرامة الواردة في الفقرة األولى أعاله\n عند مخالفته لمقتضيات المادة25\n \n.أعاله", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.06562559360471076, "y": 0.005944025813807348}, {"id": 26, "article": "28", "content": "المادة28\n \n يعاقب مدير نشر المطبوع الدوري بغرامة قدرها1.200\n درهم عن كل عدد لم ت\nس لم\nمنه النسخ إ لى الجهات المعنية المشار إليها في المادة26\n أعاله. \nالباب الخامس :في المطبوعات األجنبية", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.03488232667150803, "y": 0.02403639908442556}, {"id": 27, "article": "29", "content": "المادة29\n \n يعد مطبوعا أجنبيا، ألجل تطبيق هذا القانون، كل مطبوع مهما كانت دعامته يتوفر فيه\n:أحد الشرطين التاليين \n\n أن يصدر في الخارج؛ \n\n أن يصدر في المغرب، غير أن ما يفوق ثلث ا\nلمالكين أو الشركاء أو \n المساهمين\nأو \n رأس المال أومن لهم حقوق التصويت في الجموع وأجهزة إدارة المؤسسة\n.أوهما معا، يمتلكه", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07185044533867507, "y": 0.013429779173434193}, {"id": 28, "article": "30", "content": "المادة30\n \n يخضع كل مطبوع دوري أجنبي يطبع بالمغرب لمقتضيات هذا القانون والنصوص\n.الصادرة لتطبيقه \n عالوة\nعلى ذلك، يمنع أن يحدث أو \n ينشر أو يطبع أي مطبوع دوري أجنبي، تحت\n طائلة الحجز اإلداري، إال إذا صدر بشأنه سابق إذن من طرف رئيس الحكومة أو من\n يفوضه لذلك، بناء على طلب كتابي يوجهه المالك أو المستأجر", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09125552074850402, "y": 0.05591560934216278}, {"id": 29, "article": "31", "content": "المادة31\n \n يجوز عدم الترخيص بتوزيع المطبوعات األجنبية والمطبوعات الدورية األجنبية\n وعرضها للبيع أو عرضها على أنظار العموم ومسكها قصد التوزيع والبيع أو العرض ألجل\nالدعاية، إذا كانت تتضمن إس اءة إلى الدين اإلسالمي أو النظام الملكي أو تحريضا ضد\n الوحدة الترابية للمملكة، أو قذفا أو سبا أو مسا بالحياة ا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09405753282319236, "y": 0.003270878033494877}, {"id": 30, "article": "32", "content": "المادة32\n \n يمكن في حالة ثبوت كل منع أو حجز تعسفي للمطبوع أو المطبوع الدوري األجنبي\n.طلب تعويض يوازي الضرر المترتب عن ذلك \n\n \n \n-19 - \nالباب السادس :في خدمات الصحافة اإللكترونية", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.006731362640010185, "y": 0.034285902390831076}, {"id": 31, "article": "33", "content": "المادة33\n \n.حرية خدمات الصحافة اإللكترونية مكفولة ومضمونة \n مع مراعاة مقتضيات البند3 \n من المادة2 \n أعاله، ال يجوز اعتبار خدمات التواصل مع\n العموم على شبكة األنترنيت التي يكون غرضها األساسي تقديم وصالت إشهارية أو\nإعالنات كيفما كان شكلها أو مض\nنوم.ها، صحفا إلكترونية \n تلتزم الصحف اإللكترونية بالمقتضي", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.0723786929472208, "y": 0.05104885209680307}, {"id": 32, "article": "34", "content": "المادة34\n \nتستفيد الصحيفة اإللكترونية وبالمجان من اسم نطاق وط\nن ي بامتداد خاص بالصحافة\nيكون مدخال لمضمو\nن\nها اإلعالمي \npress.ma\n.، يكون مدخال لمضمونها اإلعالمي \n كما\nتستفيد الصحف اإللكترونية من الت دابير التحفيزية العمومية المخصصة للقطاع، وفق\n.المقتضيات التشريعية والتنظيمية الجاري بها العمل", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07407025488125812, "y": 0.016891736863686096}, {"id": 33, "article": "35", "content": "المادة35\n \n تستفيد الصحيفة اإللكترونية التي استوفت شروط المادة21\n \n أعاله، وجوبا من تصريح\nللتصوير الذاتي، مسلم من طرف المركز السينمائي المغربي، صالح لمدة سنة قابل للت ،جديد\n.لإلنتاج السمعي البصري الموجه لخدمة الصحافة اإللكترونية \n يتعرض كل تصوير بدون تصريح، للعقوبات المنصوص عليها في التشريع الجاري ب", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.056578327779140784, "y": -0.005522007960205151}, {"id": 34, "article": "36", "content": "المادة \n36\n \n تخضع تعليقات زوار الصحيفة اإللكترونية والروابط لمبدأ الحرية ويلتزم مدير النشر\nبعدم نشر أي مح توى يعد جريمة طبقا للقانون. مع سحب التعليق أو الرابط في حالة ثبوت\n.اإلساءة \n ولهذا الغرض، يضع مدير النشر في الحيز المخصص للمساهمات الشخصية لمستعملي\nشبكة األنترنيت وسائل مالئمة لمراقبة المضامين ", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.0742343932348676, "y": -0.021583773060826095}, {"id": 35, "article": "37", "content": "المادة37\n \n ال يجوز حجب موقع الصحيفة اإللكترونية إال بمقرر قضائي وفي الحاالت المنصوص\n.عليها في هذا القانون، على أال تتجاوز مدة الحجب شهرا واحدا \nال يجوز السحب النهائي للمادة الصحفية من موقع الصحيفة اإل لكترونية إال بمقرر\n قضائي في حالة الجرائم المنصوص عليها في المواد73\n و75\n و76\n و81\n \n.من هذا القان", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07623071556663981, "y": 0.012585922524661675}, {"id": 36, "article": "38", "content": "المادة38\n \n ال تتحمل الصحيفة اإللكترونية مسؤولية المواد الناتجة عن فعل االختراق أو القرصنة\nالذي يجب إثباته سواء بوسائلها الخاصة أو من قبل شر كة متخصصة في المجال، على أن\n تلتزم باحترام القواعد والتوجيهات المعمول بها في مجال أمن نظم المعلومات وكذا التحقق\n.من تفعيلها عبر القيام بافتحاصات دورية للموقع \n", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.08893474335625891, "y": 0.03933414780419564}, {"id": 37, "article": "39", "content": "المادة39\n \n يلتزم مدير نشر الصحيفة اإللكترونية باالحتفاظ بأرشيف الصحيفة لفترة توازي مدة\n.ستة أشهر على األقل تبتدئ من تاريخ نشر المادة اإلعالمية", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.006666105204114783, "y": -0.002137771430926244}, {"id": 38, "article": "40", "content": "المادة40\n \n يتعرض كل من قام باالستنساخ الكلي أو الجزئي لمواد إعالمية إلكترونية أصلية دون\n ترخيص مسبق من صاحب الحق، للجزاءات المنصوص عليها في التشريع المتعلق بحقوق\n.المؤلف والحقوق المجاورة \nيستث\nن ى من هذه الجزاءات االستنساخ لغاية االستشهاد واالستعمال غير التجاري في\n مجال التعليم، وكل شكل من االستشها", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.06125675416905755, "y": 0.04820776850983708}, {"id": 39, "article": "41", "content": "المادة41\n \nيتعين على مدير نشر الصحيفة اإللكترونية فور توصله من صاحب حق مح\nم ي بما\nي فيد\nو\nجود خرق لحقوق المؤلف والحقوق المجاورة. المبادرة إلى سحب المادة المعنية أو \n تعطيل\n\n \n- 22 - \n الولوج إليها وتقديم االعتذار، عند توفر الشروط القانونية الواردة في التشريع المتعلق بحقوق\n.المؤلف والحقوق المجاورة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.08305140095074634, "y": 0.038063336649002646}, {"id": 40, "article": "42", "content": "المادة42\n \n تترتب على عدم االستجابة لمقتضيات المادة41\n أعاله، ال جزاءات الواردة في قانون\n حقوق المؤلف والحقوق المجاورة، دون إسقاط الحقوق المرتبطة بالفترة السابقة لإلشعار\n.بالخرق \nالقسم الثاني :في الطباعة والتوزيع واإلشهار \nالباب األول :في الطباعة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.008454881427538771, "y": 0.03404306977345739}, {"id": 41, "article": "43", "content": "المادة43\n \n تخضع العالقة بين الطابع والناشر لقواعد التعاقد المعمول بها وفقا للتشريعات الجاري\n.بها العمل", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.0706187699857117, "y": 0.04213748355075555}, {"id": 42, "article": "44", "content": "المادة44\n \n يشترط قبل طبع العدد األول من أي مطبوع دوري وطني أن يتلقى المدير المسؤول\nعن المطبعة نسخة من شهادة إيداع التصر\nي ح الوارد في المادة22\n \n أعاله مصادق عليها من\n.قبل السلطات المختصة \nيمنع على المدير المسؤول عن المطبعة عند عدم تو صله بنسخة من شهادة إيداع\n.التصريح المذكور أعاله، إصدار المطبوع ا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.11509409576342537, "y": 0.042475951102499784}, {"id": 43, "article": "45", "content": "المادة45\n \n يشترط قبل طبع أي مطبوع دوري أجنبي الحصول على اإلذن الوارد في لمادة30\n \nأعاله.", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.021121780639077437, "y": 0.006389117623369513}, {"id": 44, "article": "46", "content": "المادة46\n \n عالوة على البيانات اإلجبارية الواردة في المادة25\n \n أعاله، يتأكد المدير المسؤول عن\nالمطبعة من اإلشارة في كل عدد جديد من مطبوع دو\nر:ي الى ما يلي \n\n \n اإليداع القانوي للمطبوع\nالدوري؛ \n\n \n.عدد النسخ المسحوبة ودورية صدور المطبوع \n يمتنع المدير المسؤول عن المطبعة عن طبع أي مطبوع دوري، بعد إ", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09924336477602615, "y": 0.0792752323562784}, {"id": 45, "article": "47", "content": "المادة47\n \n يعاقب بغرامة من3000\n \n إلى10000\n د رهم، كل طابع قام بطبع مطبوع دوري\nوطني \n من غير الحصول على نسخة من شهادة ايداع التصريح المسبق الوارد في المادة44\n \n.أعاله", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.05465509751094365, "y": 0.021637241409182398}, {"id": 46, "article": "48", "content": "المادة48\n \n يعاقب بغرامة من30000\n \n إلى100000\n درهم كل طابع قام بط\nب ع مطبوع دوري\n أجنبي دون الحصول على اإلذن المنصوص عليه في المادة45\n \n.عاله \nالم ادة49\n \n يعاقب بغرامة من2000\n \n إلى3000\n \n درهم كل طابع قام بطبع مطبوع دوري ال تتوفر\n فيه أحد البيانات الواردة في المادة46\n \n.أعاله \n\n \n- 24 - \nب البا ا", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.050183185608235245, "y": 0.08698216348435313}, {"id": 47, "article": "50", "content": "المادة50\n \nيخ ضع توزيع المطبوعات الدورية الوطنية واألجنبية لهذا القانون وللقوانين األخرى\nالجاري بها العمل، وال سيما فيما يتعلق باحترام مبادئ حماية النءء والقاصرين وحظر\n.اإلساءة للمرأة واحترام األشخاص في وضعية إعاقة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.020670552242310142, "y": -0.042234054943295074}, {"id": 48, "article": "51", "content": "المادة51\n \n يخضع توزيع المطبوعات الدورية األجنبية إلى ترخيص مسبق من قبل السلطة\n.الحكومية المكلفة باالتصال", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.017957560752291303, "y": -0.010166638993052503}, {"id": 49, "article": "52", "content": "المادة \n52\n \nتخ ضع العالقة بين كل من الناشر والموزع، وكذا بين الموزع والبائع، لقواعد تعاقدية\n.حرة مشتركة طبقا للتشريع الجاري به العمل", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.026983883916584735, "y": 0.03779259716155878}, {"id": 50, "article": "53", "content": "المادة53\n \n يعاقب بغرامة من2000\n \n إلى15000\n \n درهم، كل موزع قام بتوزيع مطبوع دوري\n دون الحصول على نسخة من شهادة إيداع التصريح أو اإلذن أو الترخيص الواردين على\nالتوالي في ال مواد22\n و30\n و51\n أعاله \n.مسلم من قبل المؤسسة الصحفية \nالباب ا\nثالث ل :مقتضيات مشتركة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.04744534229158847, "y": 0.049046343238809596}, {"id": 51, "article": "54", "content": "المادة54\n \n تعد شركات الطباعة أو التوزيع في مدلول هذا القانون تلك التي يتمثل مجال نشاطها\n.الرئيسي في طبع أو توزيع المطبوعات \n\n \n \n-25 -", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.02253344808358925, "y": 0.01751630925630799}, {"id": 52, "article": "55", "content": "المادة55\n \n تخضع شركات طبع وتوزيع المطبوعات الدورية لمقتضيات التشريع المتعلق\n.بالشركات وللتشريع الجاري به العمل في مجالي الطباعة والتوزيع \n تعمل شركات الطباعة والتوزيع على نشر تقرير سنوي عن الخدمات المقدمة من\n.طرفها", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07934224773515704, "y": 0.006984089023315708}, {"id": 53, "article": "56", "content": "المادة56\n \nيجب أن يكون مدير \n:شركة طبع أو توزيع المطبوعات الدورية \n\n راشدا ومقيما بالمغرب\n؛ \n\n متمتعا بحقوقه المدنية وأن ال يكون قد صدر \n في حقه حكم نهائي من أجل جناية\nأو جنحة في قضايا االبتزاز \n والنصب وخيانة األمانة والرشوة واستغالل النفوذ\nأو في قضايا االغتصاب أو التغرير بالقاصرين أوفي االتجار ف", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.09535576408012132, "y": 0.018227734876521365}, {"id": 54, "article": "57", "content": "المادة57\n \n مع مراعاة ما ينص عليه التشريع الجاري به العمل، تعين السلطة اإلدارية المحلية\nبموجب قرار في كل جماعة ترابية األماكن المعدة إلل\nص.اق اإلعالنات \nويمنع إلصاق اإلعالنات الخاصة في هذه األماكن، وال تلصق مط بوعة على الورق\nاألبيض الخصوص سوى المناشير الصادرة عن السلطة والمتعلقة بأعم\nها ال. \n دون اإ", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.10499345531371788, "y": 0.07570783772720777}, {"id": 55, "article": "58", "content": "المادة58\n \n يعاقب بغرامة من500\n \n إلى2000\n \n درهم كل من ينتزع اإلعالنات المعلقة بأمر من\nاإلدارة أو \n يمزقها أو يغطيها أو يفسدها بأية طريقة كانت قصد تحريفها أو جعلها غير\n.مقروءة \n وإذا صدرت مخالفة من هذا القبيل عن موظف أو أحد أعوان السلطة العمومية فيعاقب\n عنها بغرامة من3000\n إلى \n5000\n \n.درهم", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.02956022097322753, "y": 0.00907130231550042}, {"id": 56, "article": "59", "content": "المادة59\n \nيجب على كل من يريد أن يتعاطى في الطريق العمومية أو غيرها من \n األماكن\n العمومية أو الخاصة، مهنة بائع متجول للكتب والنشرات والكراسات والجرائد والرسوم أو\n الشعارات والمنقوشات والصور الحجرية والشمسية أو مناد بها أو موزع لها أو القيام بهذا\n العمل، ولو بصفة عرضية، أن يطلب اإلذن في ذلك من السلط", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07181899634575578, "y": 0.050929808867045984}, {"id": 57, "article": "60", "content": "المادة60\n \n يمنع اإلعالن عن المطبوع، وبصفة عامة. عن جميع النشرات أو المطبوعات الموزعة\nأو الم\nبي\nعة في الطريق العمومية إال بأسما\nئ ها، وإال فإن المنادي أو الموزع أو البائع يعاقب\nبغ رامة من500\n \n إلى2000\n \n.درهم \n\n \n \n-27 -", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.03340723131365852, "y": 0.0406617169546589}, {"id": 58, "article": "61", "content": "المادة61\n \n يتابع وفق مقتضيات هذا القانون كل من الباعة المتجولين والموزعين للكتب والنشرات\nوالدفاتر \n.والجرائد والرسوم والمنقوشات والصور الحجرية والشمسية التي تشكل جريمة \nالباب الخامس :في اإلشهار في الصحافة المكتوبة أو اإللكترونية \nالفرع األول :مقتضيات عامة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.03824466581175153, "y": -0.023705067389107888}, {"id": 59, "article": "62", "content": "المادة62\n \n.حرية اإلشهار والدعاية في الصحافة المكتوبة أو اإللكترونية مضمونة", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": -0.04042367931663445, "y": 0.021722859931980632}, {"id": 60, "article": "63", "content": "المادة63\n \n عالوة على مقتضيات هذا\nالقانون، يخضع اإلشهار في مجال ا\nلصحافة والنشر \n لمختلف\n:النصوص التشريعية والتنظيمية الجاري بها العمل، وال ميما \n\n \n القانون رقم77.03\n المتعلق باالتصال السمعي البصري؛ \n\n \n القانون رقم31.08\n القاضي بتحديد تدابير لحماية المستهلك؛ \n\n \n القانون رقم5\n 1\n .\n91\n المتعلق ", "law": "قانون الصحافة والنشر 88.13.pdf", "law_idx": 7, "x": 0.07484795299223969, "y": 0.12381066259911264}, {"id": 2238, "article": "3", "content": "المادة3\n \nالجهة جماعة ترابية خاضعة للقانون العام، تتمتع بالشخصية االعتبارية واالستقالل اإلداري وال مالي، وتشكل أحد\nمستويات التنظيم الترابي للمملكة، باعتب\nاره تنظيما ال مركزيا يقوم على الجهوية المتقدمة.", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.056939144559224095, "y": -0.08570993262326945}, {"id": 2239, "article": "4", "content": "المادة4\n \nيرتكز تدبير الجهة لشؤونها على مبدأ التدبير الحر الذي يخول بمقتضاه لكل جهة، في حدود اختصا صاتها\nالمنصوص عليها في القسم الثاني من هذا القانون التنظيمي، سلطة التداول بكيفية ديمقراطية، وس لطة تنفيذ\nمداوالت\nها ومقرراتها، طبقا ألحكام هذا القانون التنظيمي والنصوص التشريعية والتنظيمية المتخ\nذة لتط", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.09392461207569892, "y": -0.022537116968004506}, {"id": 2240, "article": "5", "content": "المادة5\n \n تطبيقا ألحكام الفصل143\n \n من الدستور، تتبوأ الجهة مكانة الصدارة بالنسبة للجماعات الترابية\nا ألخرى في عمليات\n إعداد برامج التنمية الجهوية والتصاميم الجهوية إلعداد التراب وتنفيذها وتتبعها، مع مراعاة\nا الختصاصات الذاتية\nلل\nجماعات الترابية األخرى.\n \nويتعين على السلطات العمومية المعنية مراعاة ", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.06731280059200602, "y": -0.07282144009227519}, {"id": 2241, "article": "6", "content": "المادة6\n \n طبقا للفقرة األولى من الفصل140\n من الدستور، وبناء على مبدأ التفريع، تمارس الجهة االختصاص ات الذاتية\nالمسندة إليها بموجب أحكام هذا القانون التنظيمي والنصوص المتخذة لتطبيقه. وتمارس أيضا االخ تصاصات\n المشتركة بينها وبين الدولة، والمنقولة إليها من هذه األخيرة وفق الشروط والكيفيات المنصوص\nع لي", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", le": "41", "content": "المادة41\n \n يعد رئيس المجلس جدول أعمال الدورات، بتعاون مع أعضاء المكتب، مع مراعاة أحكام المادتين42\n و43\n بعده.\n \n( يبلغ رئيس المجلس جدول أعمال الدورة إلى والي الجهة عشرين20) يوما على األقل قبل تاريخ ان\nعقاد الدورة.\n \nتسجل وجوبا في جدول األعمال العرائض المقدمة من قبل المواطنات والمواطنين والجمعيات ال", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.17967636390851865, "y": -0.04940717961232942}, {"id": 2279, "article": "42", "content": "المادة42\n \nتدرج، بحكم القانون، في جدول أعمال الدورات النقط اإلضافية التي يقترحها والي الجهة، والسيم ا تلك التي تكتسي\n( طابعا استعجاليا، على أن يتم إشعار الرئيس بها، داخل أجل ثمانية8) أيام ابتداء من ت\nاريخ تو صل الوالي بجدول\nاألعمال.", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.1005967414605091, "y": -0.006570360174893343}, {"id": 2280, "article": "43", "content": "المادة43\n \nيجوز ألعضاء المجلس المزاولين مهامهم أن يقدموا للرئيس ، بصفة فردية أو عن طريق الفريق الذي \n ينتمون إليه\n، طلبا كتابيا قصد إدراج كل نقطة تدخل في صالحيات المجلس في جدول أعمال الدورات.\n \nيتعين أن يكون رفض إدراج كل نقطة مقت\nرحة معلال وأن يبلغ إلى مقدم أو مقدمي الطلب.\n \nيحاط المجلس علما ، دون م", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعات.pdf", "law_idx": 8, "x": 0.14542567190309325, "y": -0.016719068099774456}, {"id": 2281, "article": "44", "content": "المادة44\n \n ،ال يجوز للمجلس أو للجانه التداول إال في النقط التي تدخل في نطاق صالحياتهم والمدرجة في جدول األعمال\nويجب على رئيس المجلس أو رئيس اللجنة ، حسب الحالة ، أن يتعرض على م ناقشة كل نقطة غير مدرجة في\nجدول األعمال المذكور.\n \n\nمجموعة الق انون االداري الم\nغربي  المغربي \n10 \n \n ،يتعرض والي الجهة عل", "law": "كتاب مجموعة القانون الاداري المغربي تجميعة لاهم القوانين ذات الصلة بالمادة الادارية صفحة قانون المنازعا
