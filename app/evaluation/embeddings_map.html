شكال ،\n إدعاء أو بيانا أو عرضا\n.كاذبا \nكما يمنع كل إشهار من شأنه أن يوقع في الغلط بأي وجه من الوجوه ،\n إذا كان ذلك\n يتعلق بواحد أو أكثر من العناصر:التالية \n", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.03476158624578246, "y": 0.1777985363076905}, {"id": 3840, "article": "22", "content": "المادة22\n \nيعتبر إشهارا مقارنا ،\n كل إشهار يقارن بين خصائص أو أسعار أو تعريفات السلع أو\n المنتوجات أو الخدمات إما باإلشارة إلى عالمة الصنع أو التجارة أو الخدمة الخاصة بالغير\n أو تجسيدها وإما باإلشارة إلى العنوان التجاري أو تسمية الشركة أو اإلسم التجاري أو\n الشعار الخاص بالغير أو تجسيد.ذلك \nلا \n يرخص", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.04295761681401019, "y": 0.1709086228422883}, {"id": 3841, "article": "23", "content": "المادة23\n \nيجب أن يشير كل إشهار كيفما كان شكله ،يمكن است قباله عبر خدمة لالتصاالت موجهة\nللعموم إلى طبيعته اإلشهارية بطريقة واضحة ال تحتمل أي لبس ،\n السيما العروض الدعائية\n                                                             \n6\n - \n القانون رقم77.03\n المتعلق باالتصال السمعي البصري الصا\nد ر بت", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.04994368438322416, "y": 0.1670523797241844}, {"id": 3842, "article": "24", "content": "المادة24\n \n يجب على المورد عند القيام بكل إشهار عن طريق البريد:اإللكتروني \n- \n تقديم معلومات واضحة ومفهومة حول حق التعرض في المستقبل على تلقي\nاإلشهارات؛ \n- تحديد وسيلة مالئمة لممارسة الحق المذكور بفعالية عن طريق البريد اإل\nلك تروني\n ووضعها رهن تصرف\nال\nمستهلك؛ \n يمنع عند إرسال كل إشهار عن طريق البريد", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.003987826933110055, "y": 0.1469075029506078}, {"id": 3843, "article": "25", "content": "المادة25\n \n يقصد:ب \n1. \"تقنية االتصال عن بعد:\"\n كل وسيلة تستعمل إلبرام العقد بين المورد والمستهلك \nبدون حضورهما شخصيا وفي آن واحد\n؛ \n2. \n\"\"متعهد تقنية االتصال: \n كل\nشخص طبيعي أو معنوي ،\n تابع للقطاع العام أو\nالخاص يرتكز نشاطه المهني على وضع تقنية أو عدة تقنيات \n لالتصال عن بعد\nتحت تصرف المورد. \n3. \n", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.005005725413171516, "y": 0.11917184821204124}, {"id": 3844, "article": "26", "content": "المادة26\n \nتطبق أحكام هذا الباب على \n كل شخص طبيعي أو معنوي يمارس نشاطا عن بعد أو\nيقترح بواسطة إلكترونية توريد منتج أو سلعة أو تقديم خدمة للمستهلك ،\n كما تطبق هذه\n المقتضيات على كل عقد ينتج عن هذه العملية بين مستهلك ومورد بواسطة تقنية لالتصال\n.عن بعد \n\n \n - 13 -  \nيعتبر المورد مسؤوال بقوة القانون تج", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.004126047410101998, "y": 0.1648634595924519}, {"id": 3845, "article": "27", "content": "المادة27\n \n يكون عقد البيع عن بعد بوسيلة إلكترونية صحيحا إذا\nأ برم طبقا للشروط المنصوص\n عليها في القانون رقم53.05\n المتعلق بالتبادل اإل\nلكت\nروني للمعطيات القانونية7 \n والتشريعات\nالمعمول بها في هذا المجال وكذا الشروط الواردة في هذا القانون.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.044443648657717015, "y": 0.10049436625624467}, {"id": 3846, "article": "28", "content": "المادة28\n \n ال تطبق أحكام هذا الباب على العقود المبرمة في الحاالت:التالية \n- \n بواسطة موزعين آليين أو محالت تجارية مجهزة\nباآلالت؛ \n- \n مع المتعهدين في مجال االتصاالت ألجل استخدام مخادع هاتفية\nعمومية؛ \n- \n ألجل بناء وبيع العقارات أو متعلقة بحقوق أخرى خاصة بالعقارات ماعدا\nاإليجار؛ \n- \n أثناء بيع.بالمز", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.045534115547012075, "y": 0.055708134883469186}, {"id": 3847, "article": "29", "content": "المادة29\n \n دون اإلخالل بالمعلومات المنصوص عليها في المادتين3 و5 أو \n في أي نص تشريعي\nأو تنظيمي آخر جاري به العمل ،\n يجب أن يتضمن العرض المتعلق بعقد البيع عن بعد\n المعلومات:التالية \n1. \n التعريف بالمميزات األساسية للمنتوج أو السلعة أو الخدمة محل\nالعرض؛ \n2. إ سم المورد وتسميته التجارية والمعطيات الها", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.06408800051093735, "y": 0.22753470302655887}, {"id": 3848, "article": "31", "content": "المادة31\n \n دون اإلخالل بمقتضيات المادة29\n ،يجب على المورد ،\n إذا تعلق األمر ببيع عن بعد\nباستعمال الهاتف أو أية تقنية أخرى لالتصال عن بعد ،\n أن يشير صراحة في بداية المحادثة\nمع المستهلك إلى هويته والغرض التجاري من االتصال.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.05085823215746338, "y": 0.1469525180185823}, {"id": 3849, "article": "32", "content": "المادة32\n \nيجب أن يتلقى المستهلك كتابة أو بأي وسيلة دائمة أخرى موضوعة رهن تصرفه ،\n في\n الوقت المناسب وعلى\nأ\nبعد تقدير عند \n:التسليم \n\n \n - 15 -  \n1. \n تأكيدا للمعلومات المشار إليها في المواد3 و5 و29\n ما لم يف المورد بهذا ا اللتزام\n قبل إبرام\nالعقد؛ \n2. \n عنوان المورد حيث يمكن للمستهلك تقديم\nشكاياته؛", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.0022407092301996922, "y": 0.2068460348877887}, {"id": 3850, "article": "33", "content": "المادة33\n \nيمن\nع توريد المنتوجات والسلع ،أو تقديم الخدمات إلى المستهلك دون طلبية مسبقة منه ،\nإذا تضمن هذا التوريد طلبا باألداء. \n.وال يعتبر سكوت المستهلك بمثابة قبول \n.ال يتحمل المستهلك أي مقابل في حال توريد دون طلب منه", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.047572560041632184, "y": 0.14388606452988892}, {"id": 3851, "article": "34", "content": "المادة34\n \nفي حالة حدوث نزاع بين المورد والمستهلك ،\n يقع عبء اإلثبات على المورد خاصة\n فيما يتعلق بالتقديم المسبق للمعلومات المنصوص عليها في المادة29\n \n وتأكيدها واحترام\n.اآلجال وكذا قبول المستهلك \nيعتبر كل \n.اتفاق مخالف باطال وعديم األثر", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.07977586789678341, "y": 0.09035766106050977}, {"id": 3852, "article": "35", "content": "المادة35\n \nتخضع عمليات األداء المتعلقة بالعقود المبرمة عن بعد ،للتشريعات الجاري ب.ها العمل \nيضمن المورد للمستهلك سالمة وسائل األداء التي يقترحها.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.051955554161124774, "y": 0.06640215598784992}, {"id": 3853, "article": "36", "content": "المادة36\n \n:للمستهلك أجل \n- \n سبعة أيام كاملة لممارسة حقه في\nالتراجع؛ \n\n \n - 16 -  \n- \n ثالثين يوما لممارسة حقه في التراجع في حالة ما لم يف المورد بالتزامه بالتأكيد\nالكتابي للمعلومات الم نصوص عليها في المادتين29\n و32\n.\n \n وذلك دون الحاجة إلى تبرير ذلك أو دفع غرامة باستثناء مصاريف اإلرجاع إن اقتضى\n.ا", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.027952843556060147, "y": 0.17760343512840818}, {"id": 3854, "article": "37", "content": "المادة37\n \nعند ممارسة حق التراجع ،\n يجب على المورد أن يرد إلى المستهلك المبلغ المدفوع\n كامال على الفور وعلى\nأ بعد تقدير داخل الخمسة عشر يوما الموالية للتاريخ الذي تمت فيه\nممارس الحق المذكور. وبعد انصرام األجل المذكور ،تترتب ،بقوة القانون ،\n على المبلغ\nالمستحق فوا\nئد با.لسعر القانوني المعمول به", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.03718191095715971, "y": 0.16987096661209125}, {"id": 3855, "article": "38", "content": "المادة38\n \nال يمكن أن يمارس حق التراجع ،إال إذا اتفق الطرفان على خالف ذلك ،\n في العقود\n:المتعلقة بما يلي \n1. \n الخدمات التي شرع في تنفيذها بموافقة المستهلك قبل انتهاء\nأ جل السبعة أيام\nكاملة؛ \n2. \n التزويد بالمنتوجات أو السلع أو الخدمات التي يكون\nث منها أو تعريفتها رهينا\n بتقلبات أسعار السوق\nالمالية؛", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.027091179536420602, "y": 0.1737810894975485}, {"id": 3856, "article": "39", "content": "المادة39\n \n ال يمكن أن يتجاوز تنفيذ الطلبية أجال أقصاه ثالثون يوما ابتداء من اليوم الذي أكد فيه\nالمورد تسلم طلبية المستهلك ما لم يتفق الطرفان على خالف ذلك.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.05719373719408328, "y": 0.10581392939360376}, {"id": 3857, "article": "40", "content": "المادة40\n \n في حالة عدم تنفيذ المورد للعقد بسبب عدم توفر المنتوج أو السلعة أو الخدمة\nالمطلوبة ،يجب أن يبلغ ذلك إلى المستهلك وعند االقتضاء ،\n أن ترد إليه المبالغ التي دفعها\n\n \n - 17 -  \n على الفور وعلى\nأ بعد تقدير خالل الخمسة عشر يوما الموالية ألداء المبالغ\nالمذكورة. وبعد \nانتهاء األجل المذكور ،تترتب", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.016125287877968592, "y": 0.17300434885032862}, {"id": 3858, "article": "41", "content": "المادة41\n \n يمكن للمورد أن يوفر منتوجا أو سلعة أو خدمة تكون لها نفس الجودة ونفس الثمن إذا\n كانت هذه اإلمكانية معلن عنها قبل إبرام العقد أو منصوص عليها في العقد بصورة واضحة\nومفهومة. وفي هذه الحالة ،\n يتحمل المورد مصاريف اإلرجاع المترتبة عن ممارسة حق\nالتراجع ،ويجب أن يخبر المستهلك بذلك.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.008914270382076612, "y": 0.1890547625203533}, {"id": 3859, "article": "42", "content": "المادة42\n \n ال تطبق أحكام المواد29\n و32\n و36\n و37\n على \n العقود التي يكون:محلها \n1. تزويد المستهلك بسلع االستهالك العادي في محل سكناه أو \n عمله من لدن موزعين\n يقومون بجوالت متواترة\nومنتظمة؛ \n2. \n تقديم خدمات اإليواء أو النقل أو المطاعم أو الترفيه التي يجب أن تقدم في تاريخ\nمعين أو بشكل دوري محدد.\n \n ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.009580949478354698, "y": 0.1279029450091966}, {"id": 3860, "article": "43", "content": "المادة43\n \nبالرغم من أي تشريع مخالف ،يتحمل المورد \n وحده المسؤولية في حالة وقوع نزاع فيما\nيتعلق بالملكية الفكرية.", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.08831525106543531, "y": 0.0037907343197226204}, {"id": 3861, "article": "44", "content": "المادة44\n \nتعتبر أحكام هذا الباب من النظام العام.\n \nالباب الثالث: البيع خارج المحالت التجارية", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.0588583903763818, "y": 0.04165680575491047}, {"id": 3862, "article": "45", "content": "المادة45\n \n يخضع ألحكام هذا الباب كل من يمارس أو يعمل على ممارسة البيع خارج المحالت\n التجارية في موطن\nشخص طبيعي أو في محل إقامته أو في مقر عمله، و\nلو بطلب منه ،\n ألجل أن يقترح عليه شراء منتوجات أو سلع أو بيعها أو إيجارها أو إيجارها المفضي إلى\nالبيع أو إيجارها مع \n.خيار الشراء أو تقديم خدمات \nويخضع ك", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.004864219363966104, "y": 0.13030281181047895}, {"id": 3863, "article": "46", "content": "المادة46\n \n ال تخضع ألحكام هذا\nالباب: \n- \n األنشطة التي يكون فيها البيع خارج المحالت التجارية منظما بنص\nتشريعي خاص؛ \n- \n البيع بالمنازل لمنتوجات االستهالك العادي الذي يقوم به المورد أو مأموره خالل\nجوالت متواترة أو دورية داخل المجموعة \n العمرانية التي توجد بها مؤسستهم أو\nبجوارها؛ \n- \n بيع المنتوجات ا", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.012627967587421175, "y": 0.10736881996308158}, {"id": 3864, "article": "47", "content": "المادة47\n \n يجب أن يبرم في شأن عمليات البيع خارج المحالت التجارية المشار إليها في المادة\n45\n أعاله عقد مكتوب يسلم نظير منه إلى المستهلك وقت إبرام العقد المذكور و الذي يجب أن\nيتضمن است\nمارة قابلة لالقتطاع يكون الغرض منها تسهيل ممارسة \n حق التراجع وفق\n الشروط المنصوص عليها في المادة49\n.\n \nيجب أن يوقع ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.0012355983219389344, "y": 0.20716910831057414}, {"id": 3865, "article": "48", "content": "المادة48\n \n يجب أن يتضمن العقد تحت طائلة البطالن ما\nيلي: \nأ.\n اسم المورد و البائع خارج المحالت التجارية أو تسميتهما\nالتجارية\n؛ \nب. \n عنوان\nالمورد\n؛ \nج. عنوان مكان إبرام العقد\n؛ \nد.\n التحديد الدقيق لطبيعة المنتوجات أو السلع أو الخدمات ومميزاتها\n؛ \nه.\n شروط تنفيذ العقد و\nالسيما كيفيات و\nأجل تسليم \n ال", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.00017501415157459546, "y": 0.1817182875058974}, {"id": 3866, "article": "29", "content": "المادة29\n من المرسوم رقم \n2.12.503\n، سالف الذكر.\n \n\n \n - 19 -", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.06298383575170578, "y": 0.026070459895073003}, {"id": 3867, "article": "49", "content": "المادة49\n \nـ اس تثناء من أحكام الفصل604\n \n من الظهير الشريف الصادر في9\n \n رمضان1331\n \n(\n12\n \n أغسطس1913) بمثابة قانون االلتزامات و\nالعقود ،\n يجوز للمستهلك التراجع داخل أجل\nأقصاه سبعة أيام ابتداء من تاريخ الطلبية أو االلتزام بالشراء ،\n عن طريق إرسال االستمارة\n.القابلة لالقتطاع من العقد بواسطة أية وسي", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.0027921361626377897, "y": 0.1897855758054191}, {"id": 3868, "article": "50", "content": "المادة50\n \nال يج\nوز ألي كان ،\n قبل انصرام أجل التراجع المنصوص عليه في المادة49\n ،\n أن\nيطالب المستهلك أو يحصل منه ،\n بصفة مباشرة أو غير مباشرة بأي وجه من الوجوه أو بأي\nشكل من األشكال، \n.على أي مقابل أو أي التزام أو تقديم أي خدمة كيفما كانت طبيعتها \nال يجوز تنفيذ االلتزامات أو األوا مر باألداء إال بعد", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.03445345090096203, "y": 0.134548041797131}, {"id": 3869, "article": "49", "content": "المادة49\n، ويجب أن ترد إلى المستهلك االلتزامات واألوامر المذكورة داخل ال خمسة عشر\n.يوما الموالية لتراجعه", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.047732140682615776, "y": 0.093638594976547}, {"id": 3870, "article": "51", "content": "المادة51\n \nيجب على المورد ،\n عند كل بيع خارج المحالت التجارية عن طريق الهاتف أو بأية\nوسيلة تقنية مماثلة ،أن يبين صراحة هويته والطابع التجاري للعملية. و يجب عليه أن يوجه\nإلى المستهلك تأكيدا للعرض الذي قدمه \n.والذي ال يلزمه إال عند توقيعه", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.00486619361091912, "y": 0.1688091146743843}, {"id": 3871, "article": "52", "content": "المادة52\n \n.تعتبر أحكام هذا الباب من النظام العام \nالباب الرابع: البيع بالتخفيض", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.08500759063905178, "y": 0.013830429573929092}, {"id": 3872, "article": "53", "content": "المادة53\n \nيراد بالبيع بالتخفيض ،\n حسب مدلول هذا\nالقانون ،\n البيع المقترن أو المسبوق بإشهار\n والمعلن عنه باعتباره يهدف إلى التصريف السريع للمنتوجات والسلع المخزونة عن طريق\nتخفيض السعر.\n \n\n \n - 20 -", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.03892903609341829, "y": 0.11691950287133905}, {"id": 3873, "article": "54", "content": "المادة54\n \n ال يجوز أن يتم البيع بالتخفيض إال إذا كان مقترنا بإعالن واضح ومقروء للفظة\n.\"\"تخفيض \nيجب على المورد أن يشير في أماك ن البيع إلى ما:يلي \n- \n المنتوجات أو السلع التي يشملها\nالتخفيض؛ \n- \n السعر الجديد المطبق والسعر القديم الواجب التشطيب\nعليه؛ \n- مدة التخفيض مع تحديد بدايته ونهايته.  \n ال يمك", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.021669246576051262, "y": 0.19747218876440875}, {"id": 3874, "article": "55", "content": "المادة55\n \nتجب اإلشارة في كل إشهار يتعلق بإحدى عمليات التخفيض إ لى تاريخ بداية العملية\nومدتها وطبيعة السلع أو المنتوجات التي تشملها ،\n إذا كانت ال تهم جميع سلع أو منتوجات\n.المورد \n يمنع أن تستعمل في كل إشهار أو شعار أو تسمية شركة أو\nإ سم تجاري لفظة\n\"تخفيض\" أو مثيالتها في لغات أخرى ومشتقاتها للداللة ", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.027683952831255108, "y": 0.17092669438780164}, {"id": 3875, "article": "56", "content": "المادة56\n \n يمنع القيام ببيع منتوجات أو سلع أو عرضها للبيع أو تقديم خدمة أو عرضها على\nالمستهلك إذا كانت تخول الحق في الحصول بالمجان ،\n على\nالفور أو ألجل ،\n على مكافأة\nتتكون من منتوجات أو سلع أو خدمات ،\n ماعدا إذا كانت مماثلة للمنتوجات أو السلع أو\n.الخدمات محل البيع أو الخدمة \n ال يطبق هذا المقتضى عل", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.01048620504215938, "y": 0.17775226992118798}, {"id": 3876, "article": "30", "content": "المادة30\n من المرسوم رقم \n2.12.503\n، سالف الذكر. \n \n\n \n - 21 -  \n ال تعتبر مكافأة حسب مدلول الفقرة:األولى \nأ.\n \n التوضيب المعتاد للمنتوجات أو السلع أو الخدمات التي تعتبر ضرورية لالستعمال\n العادي للمنتوج أو السلعة أو الخدمة محل\nالبيع؛ \nب. \n الخدمات المقدمة بعد البيع وتسهيالت الوقوف التي يوفرها المورد", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.025467206342823196, "y": 0.16849452258746347}, {"id": 3877, "article": "57", "content": "المادة57\n \n:يمنع ما يلي \n- \n االمتناع عن بيع منتوج أو سلعة أو تقديم خدمة إلى المستهلك دون سبب\nمقبول؛ \n- \n تعليق بيع منتوج أو سلعة على شراء كمية مفروضة أو على شراء منتوج أو سلعة\n أخرى أو تقديم خدمة أخرى في آن\nواحد؛ \n- تعليق تقديم خدمة على تقديم خدمة أخرى أو على شراء منتوج أو سلعة.\n \nالباب السابع: الب", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": -0.05086073957434391, "y": 0.13133665701902086}, {"id": 3878, "article": "58", "content": "المادة58\n \n:يمنع ما يلي \n1. البيع بالشكل الهرمي أو بأي طريقة أخرى مماثل ة يتعلق خاصة بعرض منتوجات\nأو سلع أو خدمات على المستهلك ،\n مع إغرائه بالحصول على المنتوجات أو السلع\nأو الخدمات المذكورة بالمجان أو بسعر يقل عن قيمتها الحقيقية و بتعليق البيع على\nتوظيف سندات أو تذاكر للغير أو على جمع اشتراكات أو ت", "law": "loi-31-08-consommation.pdf", "law_idx": 3, "x": 0.03589308792795136, "y": 0.1879881327524571}, {"id": 122, "article": "65", "content": "المادة65\n \n من القانون رقم24.09\n يتعلق بسالمة المنتوجات والخدمات وبتت ميم\n الظهير الشريف الصادر في9\n \n رمضان1331\n (\n12\n \n أغسطس1913\n ) بمثابة\n قانون االلتزامات والعقود الصادر بتنفيذه الظهير الشريف رقم1.11.140\n ب\nتاريخ \n16\n \n من رمضان1432\n (\n17\n \n أغسطس2011\n )، الجريدة الرسمية عدد5980\n \n بتاريخ23\n \n ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": 0.04921842027768825, "y": 0.19238230888423605}, {"id": 123, "article": "2", "content": "الفصل2\n \nاألركان \n:الالزمة لصحة االلتزامات الناشئة عن التعبير عن اإلرادة هي \n1 - األهلية لاللتزام\n؛ \n2 - تعبير صحيح عن اإلرادة يقع على العناصر األساسية لاللتزام\n؛ \n3 - شيء محقق يصلح ألن يكون محال لاللتزام\n؛ \n4 - \n.سبب مشروع لاللتزام", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08933166952900573, "y": -0.022317278746767578}, {"id": 124, "article": "2.1", "content": "الفصل2.1\n2\n \n عندما\nتشترط الكت،ابة لصحة تصرف قانوني يمكن إعداد\nها وحفظه\nا \n بشكل إلكتروني\n وفق الشروط المنصوص عليها في الفصلين1\n-\n417\n و 2\n-\n417أدناه3. \n                                                \n \n \n \n2 - \n تَمَّم الفصل2-1\n أعاله، البا\nب األول من القسم األول من الكتاب األول من الظهير الش ريف ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": 0.04808733740733991, "y": 0.1502922008654925}, {"id": 125, "article": "3", "content": "الفصل3\n \n.األهلية المدنية للفرد تخضع لقانون أحواله الشخصية \n.وكل شخص أهل لإللزام وااللتزام ما لم يصرح قانون أحواله الشخصية بغير ذلك", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.1377385092712747, "y": -0.07198674310339531}, {"id": 126, "article": "4", "content": "الفصل4\n \nإذا تعاقد القاصر وناقص األهلية بغير إذن األب أو الوصي أو المقدم \n فإنهما\nلا \n يلزمان\nبالتعهدات التي يبرمانها، ولهما أن \n يطلبا إبطالها وفقا للشروط المقررة بمقتضى\nه.ذا الظهير \n ،غير أنه يجوز تصحيح االلتزامات الناشئة عن تعهدات القاصر أو ناقص األهلية\nإ ذا\n وافق األب أو الوصي أو المقدم على تصرف", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.07674490399661948, "y": 0.019122869181409104}, {"id": 127, "article": "5", "content": "الفصل5\n \nيجوز للقاصر ولناقص األهلية أن يجلبا لنفسهما نفعا ولو بغير مساعدة األب أو \n الوصي\nأو المقدم، بمعنى أنه يجوز لهما أن يقبال الهبة أو أي تبرع آخر من شأنه أن يثر يهما أو يبرئهما\n.من التزام دون أن يحملهما أي تكليف", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08781409000832867, "y": -0.05588986298338517}, {"id": 128, "article": "6", "content": "الفصل6\n \nيجو\nز الطعن في االلتزام من الوصي أو من القاصر بعد بلوغه رشده، ولو كان هذا \nاألخير قد استعمل طرقا احتيالية من شأنها أن تحمل المتعاقد اآلخر على االعتقاد \n برشده أو\n.بموافقة وصيه أو بكونه تاجرا  \n                                                \n \n \n \n4 - \n تم تغيير الفقرة3 \n من الفصل2.1\n \n أعا", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.013580245335314942, "y": 0.09658918680127351}, {"id": 129, "article": "7", "content": "الفصل7\n \nالقاصر المأذون له إذنا صحيحا في التجارة والصناعة، ال يسوغ له أن يطلب إبط ال\nالتعهدات التي تحمل بها بسبب تجارته في حدود اإلذن الممنوح له، وفي جميع األحو ال يشمل\nهذا اإلذن األعمال الضرورية لتعاطي التجارة المأذون ف.يها", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10504722253575141, "y": -0.0020472627256420896}, {"id": 130, "article": "8", "content": "الفصل8\n \nيجوز في أي وقت بإذن المحكمة وبعد سماع أقوال القاصر إلغاء اإلذن بتعاطي ال تجارة\nإذا توفرت هناك أسباب خطيرة تبرره. وال يكون لهذا اإللغاء أثر بالنسبة إلى الص فقات التي\n.شرع فيها القاصر قبل حصول اإللغاء", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.09499072000484148, "y": -0.020107452240093308}, {"id": 131, "article": "9", "content": "الفصل9\n \nالقاصر وناقص األهلية يلتزمان دائما، بس\nبب تنفيذ الطرف اآلخر التزامه، وذلك \n في حدود\nالنفع الذي يستخلصانه من هذا التنفيذ. ويكون هناك نفع إذا أنفق ناقص األهلية ا لشيء الذي\nتسلمه في المصروفات الضرورية أو النافعة، أو إذا كان هذا الشيء الزال موجودا ف.ي ماله", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.11746208008081399, "y": -0.016244985293598465}, {"id": 132, "article": "10", "content": "الفصل10\n \nال يجوز للمتعاقد الذي كان أهال لاللت\nزام أن يحتج بنقص أهلية الطرف الذي تع.اقد معه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12114145921049409, "y": -0.018617864550815835}, {"id": 133, "article": "11", "content": "الفصل11\n \nاألب الذي يدير أموال ابنه القاصر أو ناقص األهلية، والوصي والمقدم وبوجه ع ام كل\nمن يعينه القانون إلدارة أموال غيره، ال يجوز لهم إجراء أي عمل من أعمال التصر ف على\nاألموال التي يتولون إدارتها، إال بعد الحصو\nل على إذن خاص بذلك من القاضي المخ ،تص\nوال يمنح هذا اإلذن إال في حالة الضرورة أو في حال", "law": "obligations-contracts.pdf", "law_idx": 4, "x": 0.04019239867873664, "y": 0.0876219574463983}, {"id": 134, "article": "12", "content": "الفصل12\n \nالتصرفات التي يجريها في مصلحة القاصر أو المحجور عليه أو الشخص المعنوي من \nينوب عنهم وفي الشكل المقرر في القانون، تكون لها نفس قيمة التصرفات التي يجري ها\nالراشدون المتمتعون بأهلية مبا شرة حقوقهم. وال تسري هذه القاعدة على التبرعات\nا ،لمحضة\nحيث ال يكون لها أدنى أثر ولو أجريت مع اإلذن الذي يتط", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.03418799787084837, "y": -0.06507977521932062}, {"id": 135, "article": "13", "content": "الفصل13\n \nال يجوز للنائب القانوني عن القاصر أو المحجور عليه أن يستمر في تعاطي \n التجارة\n لحسابهما إال إذا أذنت له بذلك السلطة المختصة، وال يجوز لهذه األخيرة أن تأذن إال في حالة\n.النفع الظاهر للقاصر أو المحجور عليه \nالفرع الثاني: التعبير عن اإلرادة \nأوال: التعبير عن اإلرادة الصادر من طرف واحد", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.04951160879602506, "y": -0.04261517951282703}, {"id": 136, "article": "14", "content": "الفصل14\n \n.مجرد الوعد ال ينشئ التزاما", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08869900330587814, "y": 0.018753173773561796}, {"id": 137, "article": "15", "content": "الفصل15\n \n الوعد عن طريق اإلعالنات أو أي وسيلة أخرى من وسائل اإلشهار بمنح جائزة لمن\n يعثر على شيء ضائع أو يقوم بأي عمل آخر، يعتبر مقبوال ممن يأتي بالشيء أو يقوم بالعمل\n.ولو فعل ذلك وهو جاهل الوعد، وفي هذه الحالة يلتزم الواعد من جانبه بإنجاز ما وعد به", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.06507315826046896, "y": -0.017830875988111956}, {"id": 138, "article": "16", "content": "الفصل16\n \nال يجوز \n الرجوع في الوعد بجائزة بعد الشروع في تنفيذ الفعل الموعود بالجائزة من\n.أجله \n ويفترض فيمن حدد أجال إلنجاز ذلك الفعل أنه تنازل عن حقه في الرجوع عن وعده إلى\n.انتهاء ذلك األجل", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.07868381734454563, "y": -0.023159889047473004}, {"id": 139, "article": "17", "content": "الفصل17\n \n إذا أنجز أشخاص متعددون في وقت واحد الفعل الموعود بالجائزة من أجله، قسمت\nالجا ئزة بينهم، وإذا أنجزوه في أوقات مختلفة، كانت الجائزة ألسبقهم تاريخا، وإذا اشترك عدة\n أشخاص في إنجاز الفعل، كل منهم بقدر فيه قسمت عليهم الجائزة بنفس النسبة، فإذا كانت ال\nتقبل القسمة ولكنها تقبل البيع، قسم ثمنها عل", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.048015588121909134, "y": -0.00011761527647164732}, {"id": 140, "article": "18", "content": "الفصل18\n \n االلتزامات الصادرة من طرف واحد تلزم من صدرت منه بمجرد وصولها إلى علم\n.الملتزم له  \nثانيا : االتفاقات والعقود", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10028950234629157, "y": -0.02281756735753702}, {"id": 141, "article": "19", "content": "الفصل19\n \nال يتم االتفاق إال بتراضي الطرفين على ال\nعناصر األساسية لاللتزام وعلى باق\nي الشروط  \nالمشروعة األخرى التي يعتبرها \n.الطرفان أساسية \nوالتعديالت التي يجريها الطرفان بإرادتهما على االتفاق فور إبرامه ال تعتبر \n ... جزءا\n.من االتفاق األصلي وذلك ما لم يصرح بخالفه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12877015180049603, "y": -0.03073510000711402}, {"id": 142, "article": "20", "content": "الفصل20\n \nال يكون العقد تاما إذا احتفظ المتعاق\nدان صراحة بشروط معينة لكي تكون موضوع ا\n التفاق الحق، وما وقع عليه االتفاق من شرط أو شروط والحالة هذه ال يترتب عليه\nا لتزام ولو\n.حررت مقدمات االتفاق كتابة", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.11520030564940918, "y": -0.02149329940435468}, {"id": 143, "article": "21", "content": "الفصل21\n \nالتحفظات والقيود التي لم تنه إلى علم الطرف اآلخر ال تنقص وال تقيد آثار ا لتعبير عن\nاإلرادة المستف .ادة من ظاهر اللفظ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.1142433841109028, "y": 0.005970121739737985}, {"id": 144, "article": "22", "content": "الفصل22\n \nاالتفاقات السرية المعارضة أو غيرها من التصريحات المكتوبة ال يكون لها أثر \n إال فيما\nبين المتعاقدين ومن يرثهما، فال يحتج بها على الغير، إذا لم يكن له علم بها. و يعتبر الخلف\n.الخاص غيرا بالنسبة ألحكام هذا الفصل \n\n \n- \n10\n -", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10707593138068862, "y": -0.049228003528049555}, {"id": 145, "article": "23", "content": "الفصل23\n6\n \nاإليجاب الم\nوجه لشخص حاضر، من غير تحديد ميعاد، يعتبر كأن لم يكن إذا لم يق بل\n.على الفور من الطرف اآلخر \n.ويسري هذا الحكم على اإليجاب المقدم من شخص إلى آخر بطريق التليفون", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.13246372422734648, "y": -0.00616346946913011}, {"id": 146, "article": "24", "content": "الفصل24\n \nيكون العقد الحاصل بالمراسلة تاما في الوقت والمكان اللذين يرد فيهما من تل قى اإليجاب\n.بقبوله \n والعقد الحاصل بواسطة رسول أو وسيط يتم في الوقت والمكان اللذين يقع فيهما\nر د من\n.تلقى اإليجاب للوسيط بأنه يقبله", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.0910015580003365, "y": 0.017880179890201547}, {"id": 147, "article": "25", "content": "الفصل25\n \nعندما يكون الرد بالقبول غير مطلوب من الموجب، أو عندما ال يقتضيه العرف ال تجاري\nفإن العقد يتم بمجرد شروع الطرف اآلخر في تنفيذه. ويكون السكو\nت عن الرد بمثابة \n ،القبول\n.إذا تعلق اإليجاب بمعامالت سابقة بدأت فعال بين الطرفين", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10482847698110155, "y": 0.036977444450443646}, {"id": 148, "article": "26", "content": "الفصل26\n \nيجوز الرجوع في اإليجاب مادام العقد لم يتم بالقبول أو بالشروع في تنفيذه م ن الطرف\n.اآلخر", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.13901686676404038, "y": -0.005436477096508607}, {"id": 149, "article": "27", "content": "الفصل27\n \nالرد المعلق على شرط أو المتضمن لقيد يعتبر بمثابة رفض لإليجاب يتضمن إيجا\nبا \n.جديدا", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.11787400349272578, "y": 0.010070449146850124}, {"id": 150, "article": "28", "content": "الفصل28\n \n يعتبر الرد مطابقا لإليجاب إذا اكتفى المجيب بقوله قبلت أو نفذ العقد بدون\nت.حفظ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.14781071036405305, "y": -0.0004988185921250828}, {"id": 151, "article": "29", "content": "الفصل29\n \nمن تقدم بإيجاب مع تحديد أجل للقبول بقي ملتزما تجاه الطرف اآلخر إلى انصرا م هذا\n.األجل، ويتحلل من إيجابه إذا لم يصله رد بالقبول خالل األجل المحدد \n                                                \n \n \n \n6\n - \n ال تسري أحكام الفصول من23\n \n إلى30\n \n والفصل32\n من هذا القانون على العقد المبرم بش", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.07574763872330405, "y": 0.07558228293383577}, {"id": 152, "article": "30", "content": "الفصل30\n \nمن تقدم بإيجاب عن طريق المراسلة من غير أن يحدد أجال، بقي ملتزما به إلى ا لوقت\nالمناسب لوصول رد المرسل إليه داخل أجل معقول، ما لم يظهر بوضوح من اإليجاب عك س\n.ذلك \n وإذا صدر التصريح بالقبول في الوقت المناسب ولكنه لم يصل إلى الموجب إال بعد\nانصرام األجل الذي يك في عادة لوصوله إليه، فإن الموجب ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.05652559098397682, "y": 0.04696772190254139}, {"id": 153, "article": "31", "content": "الفصل31\n \n موت الموجب أو نقص أهليته إذا طرأ بعد إرسال إيجابه، ال يحول دون إتمام العقد إن\nكان من وجه إليه اإليجاب قد قبله قبل علمه بموت الموجب أو بفقد أهليت.ه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.15286434084485617, "y": -0.006079484312634308}, {"id": 154, "article": "32", "content": "الفصل32\n \n ،إقامة المزايدة تعتبر دعوة للتعاقد. وتعتبر المزايدة مقبولة ممن يعرض الثمن األخير\n.ويلتزم هذا العارض بعرضه إذا قبل البائع الثمن المعروض", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.07310509693632623, "y": 0.035235208012601334}, {"id": 155, "article": "33", "content": "الفصل33\n \n ال يحق ألحد أن يلزم غيره، وال أن يشترط لصالحه إال إذا كانت له سلطة النيابة عنه\nبمقتضى وكالة أو بمقت .ضى القانون", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10572602189999926, "y": -0.06366281309483394}, {"id": 156, "article": "34", "content": "الفصل34\n \n ومع ذلك، يجوز االشتراط لمصلحة الغير ولو لم يعين إذا كان ذلك سببا التفاق أبرمه\nمعاوضة المشترط نفسه أو سببا \n.لتبرع لمنفعة الواعد \n وفي هذه الحالة ينتج االشتراط أثره مباشرة لمصلحة الغير، ويكون لهذا الغير الحق في\nأن يطلب باسمه من الواعد تنف يذه وذلك ما لم يمنعه العقد من مباشرة هذه الدعوى أو ", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08557371420241465, "y": 0.010900650114369817}, {"id": 157, "article": "35", "content": "الفصل35\n \n يسوغ لمن اشترط لمصلحة الغير أن يطلب مع هذا الغير تنفيذ االلتزام ما لم يظهر منه\nأن طلب تنفيذه مقصور على الغير \n.الذي أجري لصالحه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.15317821328276462, "y": -0.027902377835371847}, {"id": 158, "article": "36", "content": "الفصل36\n \n يجوز االلتزام عن الغير على شرط إقراره إياه، وفي هذه الحالة يكون للطرف اآلخر أن\n يطلب قيام هذا الغير بالتصريح بما إذا كان ينوي إقرار االتفاق. وال يبقى هذا الطرف ملتزما\n\n \n- \n12\n -\n \nإذا لم يصدر اإلقرار داخل أجل معق ول، على أن ال يتجاوز هذا األجل خمسة عشر يوما بعد\n.اإلعالم بالعقد", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12075647211942905, "y": -0.0193330236778806}, {"id": 159, "article": "37", "content": "الفصل37\n \n يعتبر اإلقرار بمثابة الوَكالة، ويصح أن يجيء ضمنيا وأن ينتج من قيام الغير بتنفيذ العقد\n.الذي أبرم باسمه \n وينتج اإلقرار أثره في حق المقر فيما يرتبه له وعليه من وقت إبرام العقد الذي حصل\n.إقراره ما لم يصرح بغير ذلك، وال يكون له أثر تجاه الغير، إال من يوم حصوله", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12338994725586175, "y": 0.002359596573700926}, {"id": 160, "article": "38", "content": "الفصل38\n \n يسوغ استنتاج الرضى أو اإلقرار من السكوت، إذا كان الشخص الذي يحصل التصرف\n في حقوقه حاضرا أو أعلم بحصوله على وجه سليم، ولم يعترض عليه من غير أن يكون هناك\n.سبب مشروع يبرر سكوته  \n ثالثا- عيوب الرضى", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.1121657214523347, "y": -0.03567147848098539}, {"id": 161, "article": "39", "content": "الفصل39\n \n.يكون قابال لإلبطال الرضى الصادر عن غلط، أو الناتج عن تدليس، أو المنتزع بإكراه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.16085828989684958, "y": -0.03890793989029359}, {"id": 162, "article": "40", "content": "الفصل40\n \n:الغلط في القانون يخول إبطال االلتزام \n1 - إذا كان هو السبب الوحيد أو األساسي\n؛ \n2 - \n.إذا أمكن العذر عنه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12928764283518054, "y": -0.048779516267614946}, {"id": 163, "article": "41", "content": "الفصل41\n \n يخول الغلط اإلبطال، إذا وقع\nفي ذات الشيء  \n أو في نوعه أو في صفة فيه كانت هي\n.السبب الدافع إلى الرضى", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12470316449345041, "y": -0.06647944997667073}, {"id": 164, "article": "42", "content": "الفصل42\n \n الغلط الواقع على شخص أحد المتعاقدين أو على صفته، ال يخول الفسخ إال إذا كان هذا\n.الشخص أو هذه الصفة أحد األسباب الدافعة إلى صدور الرضى من المتعاقد اآلخر", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.13080048764796734, "y": 0.0007252293782942643}, {"id": 165, "article": "43", "content": "الفصل43\n \nمجرد غلطات الحس\nاب ال تكون سببا للفسخ \n.وإنما يجب تصحيحها  \n\n \n- \n13\n -", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.13451755736623874, "y": -0.015275964504617585}, {"id": 166, "article": "44", "content": "الفصل44\n \n على القضاة، عند تقدير الغلط أو الجهل، سواء تعلق بالقانون أم بالواقع، أن يراعوا\n.ظروف الحال، وسن األشخاص وحالتهم وكونهم ذكورا أو إناثا", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.09456053636524511, "y": -0.09054706708067606}, {"id": 167, "article": "45", "content": "الفصل45\n \nإذا وقع الغلط من الوسيط الذي استخدمه أحد المتعاقدين، كان لهذا المتعاقد أن يطلب فسخ  \n االلتزام في األحوال المنصوص عليها في الفصلين41\n و42\n \n السابقين وذلك دون إخالل\n بالقواعد العامة المتعلقة بالخطأ وال بحكم الفصل430\n \n.في الحالة الخاصة بالبرقيات", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08780096905180167, "y": 0.027864913474709634}, {"id": 168, "article": "46", "content": "الفصل46\n \nاإلكراه إجبار يباشر من غير أن يسمح به القانون يحمل بواسطته شخص شخصا آ خر\n.على أن يعمل عمال بدون رضاه", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.1163710245534274, "y": -0.010717107947233274}, {"id": 169, "article": "47", "content": "الفصل47\n \n:اإلكراه ال يخول إبطال االلتزام إال \n1 - \n.إذا كان هو السبب الدافع إليه \n2 - إذا قام على وقائع من طبيعتها أن تحدث لمن وقعت عليه إ ما ألما جسميا أو اضطرابا\n.نفسيا  أو الخوف من تعريض نفسه أو شرفه أو أمواله لضرر كبير مع مر اعاة السن والذكورة\n.واألنوثة وحالة األشخاص ودرجة تأثرهم", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08663252859346673, "y": -0.022600271321269187}, {"id": 170, "article": "48", "content": "الفصل48\n \n الخوف الناتج عن التهديد بالمطالبة القضائية أو عن اإلجراءات القانونية األخرى ال\n يخول اإلبطال، إال إذا استغلت حالة المتعاقد المهدد بحيث تنتزع منه فوائد مفرطة أو غير\nمستحقة وذلك ما لم يكن التهدي د مصحوبا بوقائع تكون اإلكراه بالمعنى الذي يقتضيه الفصل\n.السابق", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.10088698886768498, "y": 0.016578233789055794}, {"id": 171, "article": "49", "content": "الفصل49\n \n.اإلكراه يخول إبطال االلتزام وإن لم يباشره المتعاقد الذي وقع االتفاق لمنفعته", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.1526488259278526, "y": 0.003824274262285114}, {"id": 172, "article": "50", "content": "الفصل50\n \n.اإلكراه يخول اإلبطال، ولو وقع على شخص يرتبط عن قرب مع المتعاقد بعالقة الدم", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.14085924221506932, "y": -0.026047652907306654}, {"id": 173, "article": "51", "content": "الفصل51\n \nالخوف الناشئ \n عن االحترام ال يخول اإلبطال، إال إذا انضمت إليه تهديدات جسيمة أو\n.أفعال مادية \n\n \n- \n14\n -", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.12014383917712765, "y": -0.029406774698899137}, {"id": 174, "article": "52", "content": "الفصل52\n \n التدليس يخول اإلبطال، إذا كان ما لجأ إليه من الحيل أو الكتمان أحد المتعاقدين أو نائبه\n أو شخص آخر يعمل بالتواطؤ معه قد بلغت في طبيعتها حدا بحيث لوالها لما تعاقد الطرف\nاآل خر. ويكون للتدليس الذي يباشره الغير نفس الحكم إذا كان الطرف الذي يستفيد منه عالما\n.به", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.06726446000256893, "y": -0.01225325123846738}, {"id": 175, "article": "53", "content": "الفصل53\n \n التدليس الذي يقع على توابع االلتزام من غير أن يدفع إلى التحمل به ال يمنح إال الحق\n.في التعويض", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.15713288200687822, "y": -0.013031049255885057}, {"id": 176, "article": "54", "content": "الفصل54\n \nأسباب اإلبطال المبنية على حالة المرض والحاالت األخرى المش ابهة متروكة لتقدير\n.القضاة", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.129825044683273, "y": -0.05717159136781834}, {"id": 177, "article": "55", "content": "الفصل55\n \n الغَبْن ال يخول اإلبطال إال إذا نتج عن تدليس الطرف اآلخر أو نائبه أو الشخص الذي\n.تعامل من أجله، وذلك فيما عدا االستثناء الوارد بعد", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.09712200774996826, "y": -0.08318530403745499}, {"id": 178, "article": "56", "content": "الفصل56\n  \nالغَبْن يخول اإلبطال إذا كان الطرف المغبون قاصرا أو ناقص األهلية، ولو تعاقد بمع ونة\n وصيه أو مساعده القضائي وفقا لألوضاع التي يحددها القانون، ولو لم يكن ثمة تدليس من\n الطرف اآلخر. ويعتبر غَبْنا كل فرق يزيد على الثلث بين الثمن المذكور في العقد والقيمة\n.الحقيقية للشيء \nالفرع الثالث: محل اال", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.07843896093079313, "y": -0.041357255640460326}, {"id": 179, "article": "57", "content": "الفصل57\n \nاألشياء واألفعال والحقو ق المعنوية الداخلة في دائرة التعامل تصلح وحدها ألن تكون\nمحال لاللتزام، ويدخل في دائرة \n التعامل جميع األشياء التي ال يحرم القانون صراحة التعامل\n.بشأنها", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.08636209158023869, "y": -0.05653463214231092}, {"id": 180, "article": "58", "content": "الفصل58\n \n.الشيء الذي هو محل االلتزام يجب أن يكون معينا على األقل بالنسبة إلى نوعه \nويسوغ أن يكون مقدار الشي.ء غير محدد إذا كان قابال للتحديد فيما بعد \n\n \n- \n15\n -", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.13351590135733493, "y": -0.009580130313606782}, {"id": 181, "article": "59", "content": "الفصل59\n \n يبطل االلتزام الذي يكون محله شيئا أو عمال مستحيال، إما بحسب طبيعته أو بحكم\n.القانون", "law": "obligations-contracts.pdf", "law_idx": 4, "x": -0.11325356840184984, "y": -0.02318802161832882}, {"id": 1425, "article": "1", "content": "المادة 1\n \n اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي التي تم إحداثها بناء على", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.0012636582227975818, "y": -0.05501565098263017}, {"id": 1426, "article": "27", "content": "المادة27\n \n من\nالقانون رقم \n09.08\n \n .\"وتعرف اختصارا ب \"اللجنة الوطنية", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.00181569264586364, "y": -0.03184040932292657}, {"id": 1427, "article": "2", "content": "المادة 2\n \n \n تطبيقا للمادة32\n من القانون رقم \n08.09\n \n ، تتكون : اللجنة الوطنية من سبعة أعضاء\n يعين الرئيس من طرف جاللة الملك\n، ويعين األعضا\nء الستة أيضا من طرف جاللة الملك ،\nويتم اقتراحهم كما يلي :  \n- \n عضوان من طرف الوزير األول ؛ \n- عضوان من طرف رئيس مجلس النواب ؛ \n- عضوان من طرف رئيس مجلس المست", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.11465638911887993, "y": -0.1025967132098901}, {"id": 1428, "article": "3", "content": "المادة 3\n \n عالوة على\nالرئيس ، \n فإن أعضاء اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع\nالشخصي الذين يقترحون \n  بهدف تعيينهم طبقا ألحكام المادة32\n  من القانون رقم \n08.09\n، \n \n يتم اختيارهم من بين شخصيات القطاع العام أو الخاص المؤهلين. \n يتعين أن تتضمن اللجنة الوطنية من بين أعضائها ،\n شخصيات مؤهل", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.19082012955807173, "y": -0.10594368160883341}, {"id": 1429, "article": "4", "content": "المادة 4\n \nفي حالة شغور مقعد \n أحد أعضاء اللجنة أو وجود عائق أو تغيب ألي سبب من ،األسباب \nوجب حسب نفس الشروط \n تعيين خلف له داخل الثالثين يوما التالية لتاريخ الشغور الذي يثبته\nرئيس اللجنة. \nويقوم أعضاء اللجنة \n المعينون خلفا لألعضاء المنتهي\nة مدة انتدابهم قبل أجلها العادي ،\n بإتمام مدة انتداب األعضا", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08117276240562295, "y": -0.07914231117072287}, {"id": 1430, "article": "5", "content": "المادة 5\n \n يمكن لرئيس اللجنة الوطنية أن \n يفوض جزءا من مهامه لعضو آخر وإلى الكاتب العام\n لنفس،اللجنة ويترأس اجتماعات اللجنة الوطنية أو ينتدب عضوا آخر لهذه الغاية ويمثلها. \n الفرع الثاني :\n قواعد \n عمل اللجنة الوطنية لمراقبة حماية المعطيات \nذات الطابع الشخصي", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.12290639399449628, "y": -0.0999513921274123}, {"id": 1431, "article": "6", "content": "المادة 6\n \nتجتمع اللجنة الوطنية \n بدعوة من،رئيسها \n إما بمبادرة منه أو بطلب من نصف،األعضاء \nبأوقات معلومة محددة \n بواسطة نظامها،الداخلي \n وعلى أي،حال على األقل مرة في \n الشهر.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.07176175021118429, "y": -0.10475933456798055}, {"id": 1432, "article": "7", "content": "المادة7\n \n  طبقا للمادة39\n  \n من القانون رقم \n08.09\n المذكور آنفا ، تضع اللجنة الوطنية نظامها\nالداخلي الذي يحدد على \n الخصوص شروط عملها وتنظيمها، وهذا خالل شهر بعد\nإنشائها ،\nوتبلغه إلى الوزير األول \n أو إلى السلطة الحكومية التي يحددها وذلك بهدف الموافقة عليه ونشره\nفي الجريدة \n الرسمية.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.09623244237500406, "y": -0.056187245826222296}, {"id": 1433, "article": "8", "content": "المادة \n  8\n \n تسجل في ميزانية الوزير األول االعتمادات الالزمة لقيام اللجنة الوطنية بمهامها. \n\n \n4", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.015238323602899501, "y": -0.03417906474967641}, {"id": 1434, "article": "9", "content": "المادة 9\n \n يمكن أن تستفيد \n اللجنة الوطنية من الهبات والوصايا المتأتية من هيئات وطنية ودولية\n عمومية أو خاصة.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.06797376942764813, "y": -0.0955797899648853}, {"id": 1435, "article": "10", "content": "المادة \n10\n \nيتم إعداد مشروع \n الميزانية من طرف الكاتب العام. وقبل الموافقة عليه من طرف اللجنة\n الوطنية يقدم المشروع المذكور من طرف رئيس اللجنة إلى الوزير األول.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.09994314467906107, "y": -0.0621636439788411}, {"id": 1436, "article": "11", "content": "المادة11\n \nرئيس اللجنة الوطنية هو اآلم ر بالصرف للجنة. ويساعده الكاتب العام الذي هو آمر\n مساعد بالصرف بالنسبة للمهام التي يسندها إليه القانون رقم \n08.09\n. \n الفرع الثالث :إدارة \n اللجنة الوطنية لمراقبة حماية المعطيات \nذات الطابع الشخصي", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.16887828149908732, "y": -0.06419424587909714}, {"id": 1437, "article": "12", "content": "المادة \n12\n \nيسهر على إدارة \n اللجنة الوطنية كاتب عام تحت سلطة رئيس اللجنة.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08959203422417848, "y": -0.1143973929972759}, {"id": 1438, "article": "13", "content": "المادة \n13\n \nيسير الكاتب العام \n المرافق اإلدارية والمالية للجنة الوطنية. ويمكنه بهذه،الصفة \n فضال\nعن السلطات \n  التي يزاولها بتفويض من رئيس ،اللجنة  \n توقيع جميع العقود والقرارات ذات\nالطابع \n اإلداري. وهو يحضر مشروع ميزانية،اللجنة \n ويعرضه على الرئيس من أجل الموافقة.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.13625778917887238, "y": -0.07526425773210181}, {"id": 1439, "article": "14", "content": "المادة \n14\n \n الكاتب العام\nمكلف \n .باتخاذ أي إجراء ضروري لتحضير وتنظيم أعمال اللجنة الوطنية\n وهو مسؤول عن تدبير ملفات وأرشيفات اللجنة والمحافظة عليها.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.06225939517094657, "y": -0.09459736507398438}, {"id": 1440, "article": "15", "content": "المادة \n15\n \nمن أجل تأمين تدبير \n اللجنة،الوطنية \n يتوفر الكاتب العام حسب المادة41\n \n من القانون\nرقم \n08.09\n على طاقم \n  إداري وتقني يتكون من موظفي اإلدارات العمومية أو األعوان\nالعموميين الذين يمكن \n وضعهم في وضعية إلحاق لدى اللجنة ،الوطنية \n بناء على قرار مشترك\nبين السلطة الحكومية التي يخضعون إليها", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.1451019573187374, "y": -0.012490132793390481}, {"id": 1441, "article": "16", "content": "المادة \n16\n  \nلالضطالع بسلطات \n  التقصي والتحقيق المسندة إليها بموجب المادة30\n  \n من القانون\nرقم \n08.09\n،  تكلف اللجنة \n الوطنية أعوانها المفوضين من طرف الرئيس والعاملين تحت\n،سلطته  \n،بالبحث  من خالل \n،محاضر  \n عن مخالفات أحكام القانون المذكور آنفا ونصوصه\nالتطبيقية ومراقبتها.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.06505766850731931, "y": -0.06510002399269058}, {"id": 1442, "article": "17", "content": "المادة 17\n \nتكون عملية المراقبة \n موضوع قرار للجنة الوطنية التي\nتحدد: \n1. اسم وعنوان العون \n المسؤول عن المعالجة المعنية؛ \n2. اسم وعنوان العون \n المفوض أو األعوان المكلفين بالعملية؛ \n3. موضوع ومدة \n العملية.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.07359661304414558, "y": -0.08271541792939549}, {"id": 1443, "article": "18", "content": "المادة18\n \n ال يمكن تعيين أي عون \n إلجراء مراقبة لدى مؤسسة، سبق له خالل الخمس سنوات\nالمنصرمة، أن أشرف عليها أو \n حصل منها على منفعة مباشرة أو مارس فيها وظائف،معينة \nأو نشاطا مهنيا أو انتدب انتخابيا.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.0963885343457216, "y": -0.05035750499813089}, {"id": 1444, "article": "19", "content": "المادة \n19\n \nفي حالة إجراء عملية \n مراقبة، يتعين مسبقا إشعار وكيل جاللة الملك المختص،ترابيا \nوذلك على األكثر قبل \n( أربع وعشرين24\n ) ساعة من التاريخ الذي يتعين فيه إجراء المراقبة\nفي عين المكان. \n ويحدد هذا اإلشعار تاريخ وساعة ومكان وموضوع المراقبة. ويتعين على\nاألشخاص المكلفين \n بالمراقبة تقديم وثيقة", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08522856248268103, "y": -0.0013758429379460903}, {"id": 1445, "article": "20", "content": "المادة \n20\n \n تطبيقا للمادة66\n \n من القانون رقم \n08.09\n ، يتعين بالنسبة ألية مراقبة أن يتم تحرير محضر\n يبين طبيعة ويوم وساعة ومكان المراقبات التي تم إجراؤها. ويذكر المحضر موضوع ،العملية \n وأعضاء اللجنة الذين شاركوا في هذه،األخيرة واألشخا ص الذين تمت،مقابلتهم \n ويذكر عند\n اللزوم تصريحاتهم والمطالب ال", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.1096569928727922, "y": 0.015216575106555606}, {"id": 1446, "article": "21", "content": "المادة 21\n \nويمكن ألعوان اللجنة \n الوطنية أيضا، بناء على ترخيص من وكيل جاللة ،الملك \n حجز\nالمعدات موضوع المخالفة.  \n ويجب أن يتضمن طلب الترخيص المذكور جميع عناصر\n المعلومات التي من شأنها تبرير \n الحجز. \n ويتم هذا األخير تحت \n مراقبة وكيل جاللة الملك الذي\nرخص به.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.0771287471585358, "y": -0.032694545404376565}, {"id": 1447, "article": "22", "content": "المادة    22\n \nويمكن لألشخاص \n  المكلفين ،بالمراقبة  \n  استدعاء أي ،شخص  \n بإمكانه تزويدهم بأية\n معلومات أو تبريرات \n مفيدة إلنجاز،مهمتهم واالستماع إليه. \nويتعين أن يصل \n،االستدعاء \n الموجه برسالة مضمونة أو المسلم يدا ليد مقابل إبراء من\n ،المسؤولية قبل سبعة أيام على األقل من تاريخ االستماع. \n يذكر ا", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.04386306693996327, "y": 0.040781843188868204}, {"id": 1448, "article": "23", "content": "المادة \n23\n \n تحدد اللجنة الوطنية \n  نماذج للتصريح واالستشارة وطلب،اإلذن  \n ،وتعين  \n  عند ،اللزوم \n الئحة الملحقات التي يجب إرفاقها.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.01419938468504987, "y": -0.06701936845204247}, {"id": 1449, "article": "24", "content": "المادة 24\n \nتقدم التصريحات \n واالستشارات وطلبات األذونات من طرف المسؤول عن المعالجة أو\nالشخص الذي له صفة \n تمثيله. وعندما يكون المسؤول عن المعالجة شخصا طبيعيا أو ،مصلحة \nفإنه تجدر اإلشارة إلى الشخص المعنوي أو السلطة العمومية التي يتبع إليها. \nويتم موافاة اللجنة \n الوطنية بالتصريحات واالستشارات\nواألذ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.12704789441640316, "y": 0.030283778629410025}, {"id": 1450, "article": "25", "content": "المادة \n25\n \nإن اللجنة التي تدعى \n  لإلدالء برأيها في إطار الفقرة (أ) من المادة27\n  \n وفي إطار", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.01734876961994414, "y": -0.058335823194940975}, {"id": 1451, "article": "50", "content": "المادة50\n من القانون رقم \n08.09\n السالف الذكر ، تبدي رأيها في أجل شهرين تحتسب ابتداء\nمن تاريخ التوصل بطلب \n االستشارة. ويمكن تمديد هذا األجل لمدة شهر بناء على قرار معلل\nيتخذه رئيس اللجنة الوطنية . \n  وفي حالة\nاالستعجال ، \n يمكن أن يرد هذا األجل إلى شهر بناء على طلب الحكومة\n أو البرلمان. \n الفرع الثا", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.09285933454019443, "y": -0.016241199289196488}, {"id": 1452, "article": "26", "content": "المادة \n26\n \nعندما يستجيب التصريح ألحكام القانون رقم \n08.09\n \n ونصوصه التطبيقية ، تسلم اللجنة\n الوصل المنصوص عليه في المادة19\n \n .من القانون المذكور \nويمكن للجنة أن تسلم \n وصال عن التصريح المقدم إلكترونيا مع إشعار باالستالم عبر\nنفس الوسيلة. \n عندما\nيسلم الوصل \n،إلكترونيا \n يمكن للمسؤول عن المعالجة أ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08213667146241566, "y": 0.044683571162922125}, {"id": 1453, "article": "27", "content": "المادة \n27\n \n تطبيقا للمادة21\n من القانون رقم \n08.09\n ال مذكور، \n يتعين أن تحدد األذونات\nالمقدمة: \n1. هوية وعنوان \n  المسؤول عن،المعالجة  \n أو هوية وعنوان ممثله المفوض إذا كان\n المسؤول األول ال يقيم \n بالتراب الوطني؛ \n2. \n الغاية أو \n الغايات من المعالجة ،المتوخاة \n فضال عن تسميتها\nوخصوصياتها ؛ \n3. ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.10879473544856591, "y": 0.07052955610259629}, {"id": 1454, "article": "28", "content": "المادة28\n  \n \nتدلي ال لجنة الوطنية \n .بقرارها داخل أجل شهرين يبتدئ من تاريخ التوصل بطلب اإلذن\nغير أنه يمكن تمديد هذا \n األجل مرة واحدة بناء على قرار معلل للجنة الوطنية. يعتبر عدم إدالء\nاللجنة بقرارها داخل هذه اآلجال بمثابة إذن. \nالباب الثالث :\n أحكام خاصة لبعض أصناف المعالجات \n الفرع األول :شروط \n م", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.037276718488467295, "y": -0.03909815741915361}, {"id": 1455, "article": "29", "content": "المادة29\n \n يتعين أن تكون \n المعالجات المتعلقة بالمعطيات الجينية وتلك الخاصة بالصحة ، موضوع\nإذن من اللجنة \n الوطنية ، وذلك تطبيقا للفقرة1 - \n أ و1 - \n ج من المادة12\n \n والفقرة1 \n من المادة\n21\n من القانون رقم \n08.09\n المذكور سابقا.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.012854040359394492, "y": -0.044817461653219065}, {"id": 1456, "article": "30", "content": "المادة30\n \nيجب أن تتضمن ملفات \n طلبات أذونات معالجات المعطيات المتعلقة بالصحة الموجهة\n للجنة الوطنية ما\nيلي: \n1. هوية وعنوان المسؤول عن المعالجة والشخص ال مسؤول عن ،المعالجة  \n وألقابهم\n،العلمية وتجاربهما \n،ومهامهما \n وفئات األشخاص الذين سيدعون إلى تنفيذ المعالجة وأولئك\nالذين سيكون \n بوسعهم ولوج الم", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08027679206161714, "y": 0.020873985299030378}, {"id": 1457, "article": "31", "content": "المادة31\n \nعندما يبلغ المسؤول \n عن معالجة للمعطيات ذات الطابع الشخصي هذه المعطيات لألغيار\nمن أجل معالجة الحقة \n ألغراض تاريخية وإحصائية أو علمية ، وذلك تطبيقا للفقرة1\n - \n ب \n من المادة12\n من القانون رقم \n08.09\n المذكور سابقا ، يتعين على المسؤول المذكور أو أي\nجهاز مؤهل أن يجعل هذه المعطيات مجهولة اإ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.03632275417893075, "y": 0.02850863036623596}, {"id": 1458, "article": "32", "content": "المادة32\n \nال يمكن أن تعلن \n نتائج معالجة المعطيات ذات الطابع الشخصي ألغراض تاريخية\nوإحصائية أو علمية للعموم \n في شكل يسمح بتحديد هوية الشخص المعني، ماعدا\nإذا: \n1\n . أعطى الشخص \n المعني موافقته صراحة؛ \n2. تم نشر المعطيات \n ذات الطابع الشخصي غير مجهولة اإلسم وغير المشفرة والتي\nتقتصر على معطيات سبق لل", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.039113111220254286, "y": 0.019781438000054913}, {"id": 1459, "article": "33", "content": "المادة33\n \nاللجنة الوطنية مؤهلة \n لإلدالء برأيها بخ صوص الطابع التاريخي واإلحصائي أو العلمي\nللمعطيات ذات الطابع الشخصي. \n \n \n\n \n10\n \nالباب الرابع :عن حقوق األشخاص \n الفرع األول :أحكام عامة", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.029967007254326654, "y": -0.04809912849805683}, {"id": 1460, "article": "34", "content": "المادة \n34\n \n1\n . المعلومات التي يتعين تقديمها من طرف الشخص المسؤول عن المعالجة ، تطبيقا\n للمادة5 من القانون رقم \n09.08\n المذكور ، يمكن تسليمها بأية وسيلة ، وخاصة عبر  : \n-  رسالة إلكترونية أو \n على دعامة ورقية ؛ \n- \n عرض أو شكل نموذج \n إلكتروني ؛ \n- إعالن على دعامة مناسبة ؛ \n- أو خالل مقابلة شخصية.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.023693422817435972, "y": 0.0968488232885833}, {"id": 1461, "article": "35", "content": "المادة \n35\n \n1. الطلبات الرامية \n إلى تنفيذ الحقوق المنصوص عليها في المواد من7 \n إلى9 \n من القانون\nرقم \n08.09\n المذكور \n ، يمكن تقديمها إلى المسؤول عن المعالجة كتابة ، وإلكترونيا أو في عين\nالمكان  ؛ \n2. \n عندما تقدم كتابة \n إلى المسؤول عن،المعالجة \n يتعين أن تكون موقعة ومرفقة بنسخة\nمن بطاقة التعريف ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.025451118080091227, "y": 0.02806533152414157}, {"id": 1462, "article": "36", "content": "المادة36\n \n1. عندما يقدم طلب \n في عين،المكان \n فالمعني المدلي بهويته لدى المسؤول عن ،المعالجة \nيمكن أن يختار \n مستشارا،لمساعدته \n ويمكن أن يقدم الطلب أيضا من طرف شخص مفوض\nخصيصا لهذا الغرض من \n قبل ،المعني \n بعد أن يبرر،انتدابه \n وهوية المنتد ب؛ \n2. \n عندما ال يمكن \n تلبية الطلب المتعلق بحق الولوج فو", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.07102919299063294, "y": 0.05504239629127961}, {"id": 1463, "article": "37", "content": "المادة37\n \n إذا كان الطلب غير دقيق أو ال يتضمن جميع العناصر التي تسمح للمسؤول عن المعالجة\nبأن يباشر ال عمليات المطلوبة منه ، فإن هذا األخير يدعو مقدم الطلب ألن يزوده بها قبل انتهاء\n األجل المحدد في المادة7 \n والفقرة أ من المادة8 من القانون رقم \n08.09\n \n .ونصوصه التطبيقية \nيعلق طلب المعلومات اإلضافية", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.006621949594337198, "y": 0.0836133254283859}, {"id": 1464, "article": "38", "content": "المادة38\n \n  تطبيقا للمادة7\n  من القانون رقم  \n08.09\n ، يحق ألي شخص يدلي بهويته أن يخبر\nبالمعطيات الخاصة التي تكون \n  موضوع،معالجة  \n سواء بالتوجه مباشرة إلى المسؤول عن\nالمعالجة أو بتقديم طلب خطي \n  للولوج إلى المعلومات إلى هذا ،األخير  \n موقع ومؤرخ \nأيا كانت الدعامة. \nويتعين أن يتضمن \n الطلب:الخطي ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.06025956275279238, "y": 0.06748469766429012}, {"id": 1465, "article": "39", "content": "المادة39\n \n إذا كان\nعدة مسؤولين \n عن معالجة المعطيات يديرون بصفة مشتركة ملفا واحدا أو ،أكثر \nفإن حق الولوج إلى \n المعلومات يمكن أن يباشر لدى أي ،منهم \n ما لم يكن أحدهم يعتبر مسؤوال\n عن مجموع المعالجات. \nإذا كان الشخص \n الملتمس منه ليس\nمخوال لتبليغ المعلومات المطلوبة ، فإنه يتعين عليه\nإحا\nلة الطلب عل", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.027647777267365295, "y": 0.029723480926285645}, {"id": 1466, "article": "40", "content": "المادة 40\n \n تطبيقا للمادة8\n من \n القانون رقم \n08.09\n، \n يتوفر أي شخص يدلي بهويته على الحق في\nتصحيح المعطيات الشخصية \n التي تتعلق ،به \n سواء بالتوجه مباشرة إلى المسؤول عن المعالجة\n أو بتقديم طلب خطي \n للتصحيح إلى اللجنة،الوطنية \n موقع ومؤرخ أيا كانت الدعامة. ويتعين أن\nيتضمن الطلب الخطي: \n\n \n12\n \nاإل", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.09820746866716326, "y": 0.04542213616025589}, {"id": 1467, "article": "41", "content": "المادة41\n \nعندما يقدم الشخص \n طلبا يستهدف تصحيح أو حذف معطيات،تخصه \n فإنه يتعين على\n المسؤول عن المعالجة أو اللجنة الوطنية إخباره كتابة بالتدابير المتخذة.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.043903013452434934, "y": -0.010628935770249122}, {"id": 1468, "article": "42", "content": "المادة42\n \nإذا أراد وريث شخص \n متوفى تحديث المعطيات المتعلقة،بالفقيد \n فإنه يتعين عليه لدى\n تقديم،طلبه \n فضال عن \n اإلدالء ،بهويته \n تقديم دليل على صفته كوريث من خالل وثيقة عدلية أو\nدفتر للحالة المدنية. \n الفرع الرابع :\n عن \n الحق في التعرض", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.015969445397778684, "y": 0.006784393339384623}, {"id": 1469, "article": "43", "content": "المادة \n43\n \nعندما يتم جمع \n المعطيات ذات الطاب  ع الشخصي لدى\nالشخص المعني كتابة ، فإن\nالمسؤول عن المعالجة يسأل \n هذا األخير\n، من خالل الوثيقة الت ي يستعملها كدعامة لجمع\n المعطيات\n، عما إذا كان \n يرغب في ممارسة حق التعرض المشار إليه في المادة9 \n من القانون\nرقم 09.08 المذكور سابقا. \nوينبغي أن يكون في", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.030703817528945118, "y": 0.027757369280845632}, {"id": 1470, "article": "44", "content": "المادة \n44\n \n عندما يتم جمع \n المعطيات ذات الطابع الشخصي لدى الشخص المعني بطريقة أخرى غير\n،الكتابة فإن \n المسؤول عن المعالجة يسأل هذا،األخير \n قبل إنهاء،الجمع \n عما إذا كان يرغب\nفي \n ممارسة حق،التعرض \n ويتعين على المسؤول عن المعالجة في هذا،االفتراض \n االحتفاظ\nبما \n يثبت أن الشخص المعني كان\nبوسعه مما", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.03146349792895863, "y": -0.008896193050051623}, {"id": 1471, "article": "45", "content": "المادة \n45\n \nيخبر المسؤول عن \n  المعالجة الذي مورس لديه حق،التعرض  \n بال تأخير عن هذا\n ،التعرض أي مسؤول آخر عن \n المعالجة الذي تم إرسال المعطيات ذات الطابع الشخصي إليه\n والتي كانت موضوع التعرض. \nالباب الخامس :\n عن \n نقل المعطيات ذات الطابع الشخصي \n نحو بلد أجنبي", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.007058183835642322, "y": 0.03714703598079629}, {"id": 1472, "article": "46", "content": "المادة \n46\n \n يتعين أن يتضمن نقل \n المعطيات ذات الطابع الشخصي نحو بلد أجنبي يوفر مستوى كافيا\nمن الحماية حسب معنى", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.04403058274331449, "y": 0.023984638860767484}, {"id": 1473, "article": "43", "content": "المادة43\n من القانون رقم \n08.09\n المذكور سابقا ، البيانات التالية :\n \n1.\n   \n اسم وعنوان الشخص \n المبلغ للمعطيات ؛ \n2.\n    اسم وعنوان من \n أرسلت إليه المعطيات ؛ \n3.\n    \n اسم الملف ووصفه الكامل ؛ \n4.\n    أصناف المعطيات الشخصية الم\nنقولة ؛ \n5.\n    األشخاص المعنيون \n وعددهم التقريبي ؛ \n6.\n    هدف معال", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.04263015666838464, "y": 0.0679281808637788}, {"id": 1474, "article": "47", "content": "المادة \n47\n \n بناء على المادة44\n من القانون رقم \n08.09\n  \n المذكور آنفا ، فإنه عندما ينوي المسؤول\n عن المعالجة نقل معطيات ذات طابع شخصي نحو بلد غير مدرج في القائمة المحددة من طرف\n اللجنة الوطنية والمنصوص عليها في المادة43\n \n من نفس القانون ، متمسكا بإحدى االستثناءات\n المنصوص عليها في الفقرة1 \n والفق", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.08012527089894918, "y": 0.04905053162547563}, {"id": 1475, "article": "48", "content": "المادة \n48\n \n بناء على الفقرة3 من", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": -0.06283448761458464, "y": 0.015756548704725308}, {"id": 1476, "article": "44", "content": "المادة44\n من القانون رقم \n08.09\n \n المذكور آنفا ، فإنه عندما ينوي\nالمسؤول عن \n المعالجة نقل معطيات ذات\nطابع شخصي يتطلب إ ذنا صريحا من طرف اللجنة\n الوطنية\n، فإنه \n يحدد لهذه األخيرة ، فضال عن المعطيات المنصوص عليها في المادة46\n \n من\nهذا المرسوم ، \n اإلجراءات والجهاز الكفيلين بضمان مستوى حماية كافية ل", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.10306631083927593, "y": 0.014614695259824053}, {"id": 1477, "article": "49", "content": "المادة49\n \nيتعين أن ينهى كل تغيير للمعلومات المذكورة \n في المواد46\n  و47\n  و48\n \n من هذا المرسوم\nإلى علم اللجنة \n الوطنية بال تأخير أو داخل أجل8 أيام عمل.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.0445950216612295, "y": 0.011041262397850003}, {"id": 1478, "article": "50", "content": "المادة50\n \n يمكن أن يكون النقل \n المنصوص عليه داخل مجموعة مقاوالت أو إلى عنوان عدة مرسل\nإليهم، بالنسبة لنفس \n أصناف المعطيات ولنفس،الغايات موضوع تصريح مشترك.", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.03446095745535112, "y": -0.01685102337989484}, {"id": 1479, "article": "51", "content": "المادة \n51\n \nيسند إلى وزير \n الصناعة والتجارة والتكنولوجيات الحديثة ووزير االقتصاد،والمالية \n كل\nواحد منهما \n فيما\nيخصه، تنفيذ هذا المرسوم الذي ينشر في الجريدة \n الرسمية. \n وحرر بالرباط في25\n \n من جمادى األولى1430\n (\n21\n \n ماي2009\n.)\n \n:اإلمضاء \n عباس الفاسي. \n وقعه\nبالعطف: \nوزير الصناعة \n والتجارة ", "law": "قانون 09.08 مرسوم تطبيقي.pdf", "law_idx": 5, "x": 0.09616870863651734, "y": 0.04575610120519175}, {"id": 5275, "article": "1", "content": "المادة 1 :\nتسري أحكام هذا القانون على الأشخاص المرتبطين بعقد شغل ، أيا كانت طرق تنفيذه ، وطبيعة الأجر المقرر فيه ، وكيفية أدائه ، وأيا كان نوع المقاولة التي ينفذ العقد داخلها ، وخاصة المقاولات الصناعية والتجارية ، ومقاولات الصناعة التقليدية ، والاستغلالات الفلاحية والغابوية وتوابعها. كما تسري على ال", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.020448189440373417, "y": 0.07213674742964243}, {"id": 5276, "article": "2", "content": "المادة 2 :\nتسري أحكام هذا القانون أيضا على :\n1 - الأشخاص الذين يضعون أنفسهم في مقاولة ما ، رهن إشارة الزبناء لكي يقدموا إليهم مختلف الخدمات ، سواء كان ذلك بتكليف من رئيس المقاولة أو برضاه ؛\n2 - الأشخاص الذين عهدت إليهم مقاولة واحدة بمباشرة مختلف البيوعات وبتلقي مختلف الطلبات ، إذا كان هؤلاء الأشخاص ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.008159769731596656, "y": 0.007953645624898907}, {"id": 5277, "article": "3", "content": "المادة 3 :\nتظل فئات الأجراء الآتي ذكرها ، خاضعة لأحكام الأنظمة الأساسية المطبقة عليها ، والتي لا يمكن بأي حال من الأحوال ، أن تقل عما تنص عليه مدونة الشغل من ضمانات :\n1 - أجراء المقاولات والمؤسسات العمومية التابعة للدولة والجماعات المحلية ؛\n2 - البحارة ؛\n3 - أجراء المقاولات المنجمية ؛\n4 - الصحفيون ا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.06739001989043908, "y": 0.02400212289472241}, {"id": 5278, "article": "4", "content": "المادة 4 :\nيحدد قانون خاص شروط التشغيل والشغل المتعلقة بخدم البيوت الذين تربطهم علاقة شغل بصاحب البيت.\nيحدد قانون خاص العلاقات بين المشغلين والأجراء وشروط الشغل في القطاعات التي تتميز بطابع تقليدي صرف.\nيعتبر ، في مدلول الفقرة الأولى أعلاه ، مشغلا في القطاع الذي يتميز بطابع تقليدي صرف ، كل شخص طبيعي ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.015289775333716105, "y": 0.08452687824741897}, {"id": 5279, "article": "5", "content": "المادة 5 :\nتسري على المستفيدين من التدريب من أجل الإدماج المهني ، وكذا المستفيدين من التدرج المهني ، المقتضيات المتعلقة بالتعويض عن حوادث الشغل والأمراض المهنية ، والمقتضيات التي تضمنها هذا القانون ، وخاصة فيما يتعلق بمدة الشغل ، والراحة الأسبوعية ، والعطلة السنوية المؤدى عنها ، وأيام الراحة والأعيا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.007319472335649815, "y": 0.028765996469125806}, {"id": 5280, "article": "6", "content": "المادة 6 :\nيعد أجيرا كل شخص التزم ببذل نشاطه المهني ، تحت تبعية مشغل واحد أو عدة مشغلين ، لقاء أجر ، أيا كان نوعه ، وطريقة أدائه.\nيعد مشغلا كل شخص طبيعي أو اعتباري ، خاصا كان أو عاما ، يستأجر خدمات شخص ذاتي واحد أو أكثر.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.013494859924260147, "y": 0.03227439124472738}, {"id": 5281, "article": "7", "content": "المادة 7 :\nيعد الأجراء المشار إليهم في الفقرتين الأولى والثانية من المادة الثانية في حكم مديري ورؤساء مؤسسة ، تقع عليهم مسؤولية تطبيق أحكام الكتاب الثاني من هذا القانون ، إذا كانوا هم الذين يحددون نيابة عن مشغليهم ، شروط شغل الأجراء ، المقررة في الكتاب الثاني.\nكما يكون هؤلاء الأجراء مسؤولين ، نيابة ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.050626931930701384, "y": 0.012930604014841144}, {"id": 5282, "article": "8", "content": "المادة 8 :\nيعتبر أجراء مشتغلين بمنازلهم ، في مدلول هذا القانون ، من توفر فيهم الشرطان أدناه ، دون داع إلى البحث عن وجود أو انتفاء علاقة تبعية قانونية تربطهم بمشغلهم ، ولا عن كونهم يشتغلون أو لا يشتغلون مباشرة واعتياديا تحت إشراف مشغلهم ، ولا عن كون المحل الذي يعملون فيه والمعدات التي يستعملونها ملكا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.006564266799205674, "y": 0.07426150431756501}, {"id": 5283, "article": "9", "content": "المادة 9 :\nيمنع كل مس بالحريات والحقوق المتعلقة بالممارسة النقابية داخل المقاولة وفق القوانين والأنظمة الجاري بها العمل كما يمنع كل مس بحرية العمل بالنسبة للمشغل وللأجراء المنتمين للمقاولة.\nكما يمنع كل تمييز بين الأجراء من حيث السلالة ، أو اللون ، أو الجنس ، أو الإعاقة ، أو الحالة الزوجية ، أو العقي", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.009390858962611043, "y": 0.07518109930534694}, {"id": 5284, "article": "10", "content": "المادة 10 :\nيمنع تسخير الأجراء لأداء الشغل قهرا أو جبرا.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.030957309564029704, "y": 0.0038263112993000684}, {"id": 5285, "article": "11", "content": "المادة 11 :\nلا تحول أحكام هذا القانون دون تطبيق مقتضيات الأنظمة الأساسية ، أو عقد الشغل ، أو اتفاقية الشغل الجماعية ، أو النظام الداخلي ، أو ما جرى عليه العرف من أحكام أكثر فائدة للأجراء.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.032201532940155535, "y": 0.016186308936474693}, {"id": 5286, "article": "12", "content": "المادة 12 :\nيعاقب المشغل عن مخالفة أحكام المادة 9 أعلاه بغرامة من 15.000 إلى 30.000 درهم. وفي حالة العود ، تضاعف الغرامة المذكورة أعلاه.\nعند مخالفة الأجير لأحكام الفقرة الأولى من المادة 9 أعلاه ، تتخذ في حقه عقوبة التوقيف لمدة 7 أيام. وفي حالة تكراره لنفس المخالفة خلال السنة ، تتخذ في حقه عقوبة التو", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.004853356897973389, "y": 0.07755576002805505}, {"id": 5287, "article": "13", "content": "المادة 13 :\nفترة الاختبار هي الفترة التي يمكن خلالها لأحد الطرفين إنهاء عقد الشغل بإرادته دون أجل إخطار ولا تعويض.\nغير أنه إذا قضى الأجير أسبوعا في الشغل على الأقل ، فلا يمكن إنهاء فترة الاختبار إلا بعد منحه أحد أجلي الإخطار التاليين ، ما لم يرتكب خطأ جسيما :\n- يومين قبل الإنهاء ، إذا كان من فئة الأ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.015577057409998808, "y": 0.07181933025255832}, {"id": 5288, "article": "14", "content": "المادة 14 :\nتحدد فترة الاختبار بالنسبة للعقود غير المحددة المدة كما يلي :\n- ثلاثة أشهر بالنسبة للأطر وأشباههم ؛\n- شهر ونصف بالنسبة للمستخدمين ؛\n- خمسة عشر يوما بالنسبة للعمال.\nيمكن تجديد فترة الاختبار مرة واحدة.\nلا يمكن أن تتجاوز فترة الاختبار ، بالنسبة للعقود المحددة المدة ، المدد التالية :\n- يوما ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.03553507062584634, "y": 0.10999951368513054}, {"id": 5289, "article": "15", "content": "المادة 15 :\nتتوقف صحة عقد الشغل على الشروط المتعلقة بتراضي الطرفين ، وبأهليتهما للتعاقد ، وبمحل العقد ، وبسببه ، كما حددها قانون الالتزامات والعقود.\nفي حالة إبرام عقد الشغل كتابة ، وجب تحريره في نظيرين موقع عليهما من طرف الأجير والمشغل ومصادق على صحة إمضائهما من قبل الجهة المختصة ، ويحتفظ الأجير بأح", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.030830595608235367, "y": 0.07874470716120723}, {"id": 5290, "article": "16", "content": "المادة 16 :\nيبرم عقد الشغل لمدة غير محددة ، أو لمدة محددة ، أو لإنجاز شغل معين.\nيمكن إبرام عقد الشغل محدد المدة في الحالات التي لا يمكن أن تكون فيها علاقة الشغل غير محددة المدة.\nوتنحصر حالات إبرام عقد الشغل محدد المدة فيما يلي :\n- إحلال أجير محل أجير آخر في حالة توقف عقد شغل هذا الأخير ، ما لم يكن ا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.009087392438361711, "y": 0.11541173227048743}, {"id": 5291, "article": "17", "content": "المادة 17 :\nيمكن في القطاعات غير الفلاحية ، عند فتح مقاولة لأول مرة أو مؤسسة جديدة داخل المقاولة أو إطلاق منتوج جديد لأول مرة ، إبرام عقد الشغل محدد المدة ، لمدة أقصاها سنة قابلة للتجديد مرة واحدة. ويصبح العقد بعد ذلك في جميع الحالات غير محدد المدة.\nغير أن العقد المبرم لمدة أقصاها سنة يصبح ، في حالة", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.01840479304837558, "y": 0.10755745629842758}, {"id": 5292, "article": "18", "content": "المادة 18 :\nيمكن إثبات عقد الشغل بجميع وسائل الإثبات.\nإذا كان عقد الشغل ثابتا بالكتابة أعفي من رسوم التسجيل.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.03024518471969563, "y": 0.04456332525645389}, {"id": 5293, "article": "19", "content": "المادة 19 :\nإذا طرأ تغيير على الوضعية القانونية للمشغل ، أو على الطبيعة القانونية للمقاولة ، وعلى الأخص بسبب الإرث ، أو البيع ، أو الإدماج ، أو الخوصصة ، فإن جميع العقود التي كانت سارية المفعول حتى تاريخ التغيير ، تظل قائمة بين الأجراء وبين المشغل الجديد ، الذي يخلف المشغل السابق في الالتزامات الواج", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.009112862862976516, "y": 0.0971571878768685}, {"id": 5294, "article": "20", "content": "المادة 20 :\nيكون الأجير مسؤولا في إطار شغله عن فعله ، أو إهماله ، أو تقصيره ، أو عدم احتياطه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.053041383544816016, "y": -0.026385373250773128}, {"id": 5295, "article": "21", "content": "المادة 21 :\nيمتثل الأجير لأوامر المشغل ، في نطاق المقتضيات القانونية أو التنظيمية ، أو عقد الشغل ، أو اتفاقية الشغل الجماعية ، أو النظام الداخلي.\nيمتثل الأجير أيضا للنصوص المنظمة لأخلاقيات المهنة.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.0031714967674783016, "y": 0.03821668493662801}, {"id": 5296, "article": "22", "content": "المادة 22 :\nيجب على الأجير المحافظة على الأشياء والوسائل المسلمة إليه للقيام بالشغل ، مع ردها بعد انتهاء الشغل الذي كلف به.\nيسأل الأجير عن ضياع الأشياء ، والوسائل السالفة الذكر ، أو تلفها ، إذا تبين للقاضي بما له من سلطة تقديرية ، أن الضياع أو التلف ناتجان عن خطأ الأجير ، كما لو نتج الضياع أو التلف ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.007613266426119131, "y": 0.043830428370658904}, {"id": 5297, "article": "23", "content": "المادة 23 :\nيحق للأجراء الاستفادة من برامج محو الأمية ومن تكوين مستمر.\nتحدد بنص تنظيمي شروط وكيفيات الاستفادة من هذا التكوين.\nيجب على المشغل أن يسلم الأجير بطاقة شغل.\nيجب أن تتضمن بطاقة الشغل البيانات التي تحدد بنص تنظيمي.\nيجب تجديد بطاقة الشغل كلما حدث تغيير في صفة الأجير المهنية ، أو في مبلغ الأجر", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.0049563767976535614, "y": 0.09295546342567115}, {"id": 5298, "article": "24", "content": "المادة 24 :\nيجب على المشغل ، بصفة عامة ، أن يتخذ جميع التدابير اللازمة لحماية سلامة الأجراء وصحتهم ، وكرامتهم ، لدى قيامهم بالأشغال التي ينجزونها تحت إمرته ، وأن يسهر على مراعاة حسن السلوك والأخلاق الحميدة ، وعلى استتباب الآداب العامة داخل المقاولة.\nيجب عليه أيضا إطلاع الأجراء كتابة ، لدى تشغليهم ، ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.04216045519776609, "y": 0.07736407521517456}, {"id": 5299, "article": "25", "content": "المادة 25 :\nيعاقب بغرامة من 300 إلى 500 درهم عن الأفعال التالية :\n- عدم تسليم بطاقة الشغل أو عدم تجديدها وفق الشروط المنصوص عليها في المادة 23 ؛\n- عدم تضمين بطاقة الشغل أي بيان من البيانات المحددة بنص تنظيمي.\nيتكرر تطبيق الغرامة حسب عدد الأجراء الذين لم تراع في حقهم أحكام المادة 23 ، على ألا يتجاوز ", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.008456692830429258, "y": 0.08635596040822449}, {"id": 5300, "article": "26", "content": "المادة 26 :\nإذا نص عقد الشغل على تحميل الأجير كفالة ، طبقت على هذه الكفالة أحكام هذه المادة والمواد 27 و28 و29 و30 أدناه.\nيجب على المشغل ، أن يسلم الأجير وصلا عن الكفالة ، وأن يمسك سجلا مطابقا للشكليات المقررة من طرف السلطة الحكومية المكلفة بالشغل ، تبين فيه العمليات المتعلقة بالكفالة.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.027041302044460327, "y": 0.05617896596656238}, {"id": 5301, "article": "27", "content": "المادة 27 :\nإذا كانت الكفالة تتكون من سندات ، وجب ألا تتضمن إلا قيما تصدرها الدولة ، أو تحظى بضمانها.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.07385256089139797, "y": -0.011215707584620479}, {"id": 5302, "article": "28", "content": "المادة 28 :\nيجب إيداع الكفالة لدى صندوق الإيداع والتدبير ، في أجل خمسة عشر يوما من تاريخ تسلم المشغل لها ، ويجب أن يشار إلى هذا الإيداع في السجل المنصوص عليه في المادة 26 أعلاه ، وأن يثبت ذلك بشهادة إيداع ، توضع رهن إشارة العون المكلف بتفتيش الشغل.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.014747985377405563, "y": 0.0361553467077317}, {"id": 5303, "article": "29", "content": "المادة 29 :\nلا يمكن سحب الكفالة كلا أو بعضا إلا برضى المشغل والأجير معا ، أو بناء على حكم تصدره المحكمة.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.07208081249442769, "y": -0.019592266663991654}, {"id": 5304, "article": "30", "content": "المادة 30 :\nتخصص الكفالة أساسا لاستيفاء حقوق المشغل وحقوق الأغيار الذين قد يوقعون حجزا بين يديه. يعتبر باطلا بحكم القانون ، كل حجز يوقع لدى صندوق الإيداع والتدبير.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.04866052258380428, "y": -0.01533515466998453}, {"id": 5305, "article": "31", "content": "المادة 31 :\nيعاقب بغرامة من 2000 إلى 5000 درهم عن الأفعال التالية :\n- عدم مسك السجل المنصوص عليه في المادة 26 أو عدم تضمينه البيانات المقرر تقييدها فيه ؛\n- عدم تسليم الوصل عن الكفالة المنصوص عليه في المادة 26 ؛\n- عدم مراعاة الأجل والشروط المنصوص عليهما في المادة 28 ، والتي تلزم المشغل بإيداع الكفالة", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.035675558782761324, "y": 0.06106864684104315}, {"id": 5306, "article": "32", "content": "المادة 32 :\nيتوقف عقد الشغل مؤقتا أثناء :\n1 - فترة الخدمة العسكرية الإجبارية ؛\n2 - تغيب الأجير لمرض ، أو إصابة ، يثبتهما طبيب إثباتا قانونيا ؛\n3 - فترة ما قبل وضع الحامل حملها ، وما بعده ، وفق الشروط المنصوص عليها في المادتين 154 و156 أدناه ؛\n4 - فترة العجز المؤقت الناتج عن حادثة شغل أو مرض مهني ؛\n5", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.02576407776265202, "y": 0.07997159835903558}, {"id": 5307, "article": "33", "content": "المادة 33 :\nينتهي عقد الشغل المحدد المدة بحلول الأجل المحدد للعقد ، أو بانتهاء الشغل الذي كان محلا له.\nيستوجب قيام أحد الطرفين بإنهاء عقد الشغل محدد المدة ، قبل حلول أجله ، تعويضا للطرف الآخر ، ما لم يكن الإنهاء مبررا ، بصدور خطإ جسيم عن الطرف الآخر ، أو ناشئا عن قوة قاهرة.\nيعادل التعويض المشار إليه", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.040547900883475645, "y": 0.11298687931789399}, {"id": 5308, "article": "34", "content": "المادة 34 :\nيمكن إنهاء عقد الشغل غير محدد المدة بإرادة المشغل ، شرط مراعاة الأحكام الواردة في هذا الفرع ، وفي الفرع الثالث أدناه بشأن أجل الإخطار.\nيمكن إنهاء عقد الشغل غير محدد المدة بإرادة الأجير عن طريق الاستقالة المصادق على صحة إمضائها من طرف الجهة المختصة ؛ ولا يلزمه في ذلك إلا احترام الأحكام ال", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.01684465050083188, "y": 0.09490048834121903}, {"id": 5309, "article": "35", "content": "المادة 35 :\nيمنع فصل الأجير دون مبرر مقبول إلا إذا كان المبرر مرتبطا بكفاءته أو بسلوكه في نطاق الفقرة الأخيرة من المادة 37 والمادة 39 أدناه ، أو تحتمه ضرورة سير المقاولة في نطاق المادتين 66 و67 أدناه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.07570845770542331, "y": 0.02841980688980326}, {"id": 5310, "article": "36", "content": "المادة 36 :\nلا تعد الأمور التالية من المبررات المقبولة لاتخاذ العقوبات التأديبية أو للفصل من الشغل :\n1 - الانتماء النقابي أو ممارسة مهمة الممثل النقابي ؛\n2 - المساهمة في أنشطة نقابية خارج أوقات الشغل ، أو أثناء تلك الأوقات ، برضى المشغل أو عملا بمقتضيات اتفاقية الشغل الجماعية أو النظام الداخلي ؛\n3 -", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.013052038193232024, "y": 0.019598875986062515}, {"id": 5311, "article": "37", "content": "المادة 37 :\nيمكن للمشغل اتخاذ إحدى العقوبات التأديبية التالية في حق الأجير لارتكابه خطأ غير جسيم :\n1 - الإنذار ؛\n2 - التوبيخ ؛\n3 - التوبيخ الثاني ، أو التوقيف عن الشغل مدة لا تتعدى ثمانية أيام ؛\n4 - التوبيخ الثالث ، أو النقل إلى مصلحة ، أو مؤسسة أخرى عند الاقتضاء ، مع مراعاة مكان سكنى الأجير.\nتطبق ع", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.03343171604678829, "y": 0.024320531363473744}, {"id": 5312, "article": "38", "content": "المادة 38 :\nيتبع المشغل بشأن العقوبات التأديبية مبدأ التدرج في العقوبة. ويمكن له بعد استنفاذ هذه العقوبات داخل السنة أن يقوم بفصل الأجير ؛ ويعتبر الفصل في هذه الحالة فصلا مبررا.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.0533479912902729, "y": -0.036556921193008775}, {"id": 5313, "article": "39", "content": "المادة 39 :\nتعتبر بمثابة أخطاء جسيمة يمكن أن تؤدي إلى الفصل ، الأخطاء التالية المرتكبة من طرف الأجير :\n- ارتكاب جنحة ماسة بالشرف ، أو الأمانة ، أو الآداب العامة ، صدر بشأنها حكم نهائي وسالب للحرية ؛\n- إفشاء سر مهني نتج عنه ضرر للمقاولة ؛\n- ارتكاب الأفعال التالية داخل المؤسسة أو أثناء الشغل ؛\n- السرق", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.020764863416018214, "y": 0.008801017650840662}, {"id": 5314, "article": "40", "content": "المادة 40 :\nيعد من بين الأخطاء الجسيمة المرتكبة ضد الأجير من طرف المشغل أو رئيس المقاولة أو المؤسسة ، ما يلي :\n- السب الفادح ؛\n- استعمال أي نوع من أنواع العنف والاعتداء الموجه ضد الأجير ؛\n- التحرش الجنسي ؛\n- التحريض على الفساد.\nوتعتبر مغادرة الأجير لشغله بسبب أحد الأخطاء الواردة في هذه المادة في حال", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.013658892781470535, "y": 0.0024759319899181845}, {"id": 5315, "article": "41", "content": "المادة 41 :\nيحق للطرف المتضرر ، في حالة إنهاء الطرف الآخر للعقد تعسفيا ، مطالبته بالتعويض عن الضرر.\nلا يمكن للطرفين أن يتنازلا مقدما عن حقهما المحتمل في المطالبة بالتعويضات الناتجة عن إنهاء العقد سواء كان الإنهاء تعسفيا أم لا.\nيمكن للأجير الذي فصل عن الشغل لسبب يعتبره تعسفيا اللجوء إلى مسطرة الصلح ا", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.016990753603044563, "y": 0.10296364929087179}, {"id": 5316, "article": "42", "content": "المادة 42 :\nإذا أنهى الأجير عقد الشغل بصفة تعسفية ، ثم تعاقد مع مشغل جديد ، أصبح هذا المشغل متضامنا معه في تحمل المسؤولية عن الضرر اللاحق بالمشغل السابق ، وذلك في الأحوال التالية :\n1 - إذا ثبت أنه تدخل من أجل إخراج الأجير من شغله ؛\n2 - إذا شغل أجيرا مع علمه أنه مرتبط بعقد شغل ؛\n3 - إذا استمر في تشغي", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.026814883075044753, "y": 0.061504968145115115}, {"id": 5317, "article": "43", "content": "المادة 43 :\nيكون إنهاء عقد الشغل غير محدد المدة ، بإرادة منفردة ، مبنيا على احترام أجل الإخطار ، ما لم يصدر خطأ جسيم عن الطرف الآخر.\nينظم أجل الإخطار ومدته بمقتضى النصوص التشريعية ، أو التنظيمية ، أو عقد الشغل ، أو اتفاقية الشغل الجماعية ، أو النظام الداخلي ، أو العرف.\nيكون باطلا بقوة القانون ، كل ش", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.017816529316749565, "y": 0.05825997536652665}, {"id": 5318, "article": "44", "content": "المادة 44 :\nيبدأ سريان أجل الإخطار من اليوم الموالي لتبليغ قرار إنهاء العقد.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.07178721240881165, "y": -0.018410261935069058}, {"id": 5319, "article": "45", "content": "المادة 45 :\nيتوقف أجل الإخطار أثناء فترة :\n1 - عجز الأجير مؤقتا عن الشغل إذا تعرض لحادثة شغل ، أو لمرض مهني ؛\n2 - ما قبل وضع الحامل لحملها ، أو ما بعده ، وفق الشروط المنصوص عليها في المادتين 154 و156 أدناه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.04885731423152048, "y": 0.0641352308317686}, {"id": 5320, "article": "46", "content": "المادة 46 :\nلا تطبق المقتضيات المنصوص عليها في المادة 45 أعلاه عندما ينتهي عقد الشغل محدد المدة ، أو المبرم من أجل إنجاز شغل معين ، خلال فترة العجز المؤقت.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.05615258536009894, "y": 0.0647405111119556}, {"id": 5321, "article": "47", "content": "المادة 47 :\nيجب على المشغل والأجير ، خلال أجل الإخطار ، احترام جميع التزاماتهما المتبادلة.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.0722319851388537, "y": 0.011494194822779047}, {"id": 5322, "article": "48", "content": "المادة 48 :\nيستفيد الأجير أثناء أجل الإخطار ، من رخص التغيب ، قصد البحث عن شغل آخر ، على أن يؤدى له عنها الأجر الذي يتقاضاه عن أوقات شغله الفعلي ، أيا كانت طريقة أدائه.", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.0568806652722287, "y": 0.04779485945022749}, {"id": 5323, "article": "49", "content": "المادة 49 :\nتحدد رخصة التغيب المنصوص عليها في المادة 48 أعلاه في ساعتين في اليوم ، على ألا تتعدى الأوقات المرخص بها ثماني ساعات في الأسبوع الواحد ، أو ثلاثين ساعة في كل فترة من ثلاثين يوما متوالية.\nغير أنه إذا كان الأجير يشتغل في مقاولة ، أو مؤسسة ، أو ورش يبعد مسافة تفوق عشرة كيلومترات عن مدينة مصن", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.04903155899331612, "y": 0.09447321877627683}, {"id": 5324, "article": "50", "content": "المادة 50 :\nتحدد مدة التغيب باتفاق بين المشغل والأجير ، وعند الاقتضاء تارة باختيار المشغل ، وتارة باختيار الأجير ، تناوبا بينهما.\nينتهي الحق في التغيب بمجرد حصول الأجير على شغل جديد ، ويجب عليه في هذه الحالة إحاطة مشغله علما بذلك تحت طائلة إنهاء أجل الإخطار. كما ينتهي هذا الحق إذا توقف الأجير عن تخص", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": 0.0006230157574781583, "y": 0.0547851284839048}, {"id": 5325, "article": "51", "content": "المادة 51 :\nيترتب عن إنهاء عقد الشغل غير محدد المدة ، دون إعطاء أجل الإخطار ، أو قبل انصرام مدته ، أداء الطرف المسؤول عن الإنهاء ، تعويضا عن الإخطار للطرف الآخر ، يعادل الأجر الذي كان من المفروض أن يتقاضاه الأجير ، لو استمر في أداء شغله ، ما لم يتعلق الأمر بخطإ جسيم.\nالفرع الرابع\nالتعويض عن الفصل", "law": "قانون 65.99 مدونة الشغل.txt", "law_idx": 6, "x": -0.05667999444458175, "y": 0.1057213650832072}, {"id": 5326, "article": "52", "content": "المادة 52 :\nيستحق الأجير المرتبط بعقد شغل غير محدد المدة ، تعويضا عند ف
